name = "statlib"
version = "0.1.0"
keywords = ["statistics", "probability", "math"]
defaultTargets = ["Statlib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0-rc1"

[[lean_lib]]
name = "Statlib"

# Prover job sandboxes (ProverJobs/<jobId>/Main.lean etc.). REQUIRED for the prove
# engine: toolRunner builds each sandbox via `lake build ProverJobs.<jobId>.Main`, so
# this lib must glob ProverJobs/ — otherwise every sandbox write fails with
# `unknown target ProverJobs.<jobId>.Main`. Re-removed by 2fff4a0 "Update lakefile.toml"
# (2026-06-22); restored again — see prover docs/RESTRUCTURE_2026-06.md §3.2.
[[lean_lib]]
name = "ProverJobs"
globs = ["ProverJobs.+"]
