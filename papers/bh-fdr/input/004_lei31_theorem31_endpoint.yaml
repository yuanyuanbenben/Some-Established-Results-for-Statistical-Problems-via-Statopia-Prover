  lean_namespace: Statlib.MultipleTesting.Lei
  target_dir: ProverJobs
  allow_axiom: false
theorems:
  - id: bh.fdr.showcase.app.lei31_theorem31_endpoint
    title: "Lei Theorem 3.1: final BH FDR bound endpoint"
    kind: theorem
    lean_name: app_lei31_theorem31_endpoint
    lean_namespace: Statlib.MultipleTesting.Lei
    priority: 3
    layer: app-showcase-lei31-final
    target_file: ProverJobs/app_lei31_theorem31_endpoint/Main.lean
    dependencies:
      - bh.fdr.showcase.app.lei31_leave_one_out_fdr
      - bh.fdr.showcase.app.lei31_tail_ratio_excess
    workspace_siblings:
      - bh_showcase_workspace_seed_01
      - bh_showcase_workspace_seed_15
      - app_lei31_leave_one_out_fdr
      - app_lei31_tail_ratio_excess
    required_workspace_decls:
      - app_lei31_leave_one_out_fdr
      - app_lei31_tail_ratio_excess
      - lei_theorem31_explicit_bh_fdr_app_display
    imports:
      - Mathlib
      - Statlib
      - ProverJobs.bh_showcase_workspace_seed_01.Main
      - ProverJobs.bh_showcase_workspace_seed_15.Main
      - ProverJobs.app_lei31_leave_one_out_fdr.Main
      - ProverJobs.app_lei31_tail_ratio_excess.Main
    latex_statement: |
      Lei Theorem 3.1 endpoint. For the concrete BH rejection rule
      R_i(omega)=1{p_i(omega) <= q}, with a positive number of hypotheses,
      combine the leave-one-out/FDR decomposition and the Gaussian
      tail-ratio/common-factor excess bound to get
      FDR(BH_q) <= q * (1 + pi0 * ((1 - q) / 2 + u_q / sqrt(2*pi))).
    assumptions:
      - "This is the final Lei Theorem 3.1 app node."
      - "The positive-size regularity condition `hm : 0 < m` is explicit to match the leave-one-out app subnode generated by the same workspace run."
      - "The finite-measure condition is an explicit parameter `hmuFin : IsFiniteMeasure mu` to match the leave-one-out app subnode."
      - "The p-value measurability condition `hp_meas : forall i, Measurable fun omega => p omega i` is explicit because the app formalizer inserts it for the final BH/FDR endpoint."
      - "It must first derive `hfdr` by calling `app_lei31_leave_one_out_fdr`."
      - "It must then derive `hexcess` by calling `app_lei31_tail_ratio_excess`."
      - "The final display step must call `lei_theorem31_explicit_bh_fdr_app_display`."
    statement_hint: |
      Prove the final Lei Theorem 3.1 display by deriving the two intermediate
      inequalities from the previous two app nodes and passing them to the
      checked display endpoint.
    proof_block:
      theorem_shape: |
        import Mathlib
        import Statlib
        import ProverJobs.bh_showcase_workspace_seed_01.Main
        import ProverJobs.bh_showcase_workspace_seed_15.Main
        import ProverJobs.app_lei31_leave_one_out_fdr.Main
        import ProverJobs.app_lei31_tail_ratio_excess.Main

        open MeasureTheory

        namespace Statlib.MultipleTesting.Lei

        theorem app_lei31_theorem31_endpoint
            {Omega : Type*} [MeasurableSpace Omega]
            (mu : Measure Omega) (hmuFin : IsFiniteMeasure mu) {m : Nat} (hm : 0 < m)
            (isNull : Fin m -> Prop) [DecidablePred isNull]
            (q : Real) (p : Omega -> Fin m -> Real)
            (hp_meas : forall i, Measurable fun omega => p omega i)
            [forall omega : Omega,
              DecidablePred
                (fun i : Fin m => Statlib.MultipleTesting.bhReject (p omega) q i)]
            (tail : Real -> Real) (m0 : Nat)
            (pi0 u_q excess tailLoss scaleLoss : Real)
            (hqdomain : leiTheorem31QDomain tail q u_q)
            (hfrac : leiTheorem31NullFraction m m0 pi0)
            (hlo : leiBhLeaveOneOutFdrInputs mu isNull q p excess)
            (htailratio :
              leiTailRatioExcessComponents q pi0 u_q excess tailLoss scaleLoss) :
            Statlib.MultipleTesting.fdr mu isNull
              (fun omega i => Statlib.MultipleTesting.bhReject (p omega) q i) <=
              leiCommonFactorFdrRhs q pi0 u_q := by
          sorry

        end Statlib.MultipleTesting.Lei
    proof_body: |
      First derive the two intermediate inequalities, then call the display
      endpoint.

        letI : IsFiniteMeasure mu := hmuFin
        have hfdr :
            Statlib.MultipleTesting.fdr mu isNull
              (fun omega i => Statlib.MultipleTesting.bhReject (p omega) q i) <=
              q * (1 + excess) := by
          exact app_lei31_leave_one_out_fdr mu hmuFin hm isNull q p excess hlo
        have hexcess : excess <= leiCommonFactorExcessBudget q pi0 u_q := by
          exact app_lei31_tail_ratio_excess
            q pi0 u_q excess tailLoss scaleLoss htailratio
        exact lei_theorem31_explicit_bh_fdr_app_display
          mu isNull q p tail m0 pi0 u_q excess hqdomain hfrac hfdr hexcess
    acceptance:
      - lake build passes
      - theorem contains no sorry/admit/axiom
      - final proof references both Lei intermediate app nodes
      - final proof references the Lei 3.1 display workspace declaration
