      ##### Definitions and notation
      Let \((\X,\B)\) denote a Borel space. Here \(\X=\R^d\), and \(\|x\|\) denotes the Euclidean norm of \(x\in\X\). Let \(\mathfrak{L}(\cdot)\) be a distribution defined over \(\mathbb{Z}_+\), and let \(L\) denote the number of leapfrog steps, with \(L\sim\mathfrak{L}(\cdot)\).

      The Hamiltonian Monte Carlo method considered has fixed integration time \(T=L\e\), integrator step-size \(\e>0\), and number of leapfrog steps \(L\). Given the current state \(x_{i-1}\), the algorithm sets \(x_0\leftarrow x_{i-1}\), draws \(p_0\sim N(0,M)\), draws \(L\sim\mathfrak{L}(\cdot)\), and sets \(T\leftarrow L\e\). From that point on, \(M=I\) is assumed for ease of exposition but without loss of generality.

      For a differentiable potential \(U:\X\to[0,\infty)\), the leapfrog recursion is
      \[
      p_{t+\frac{\e}{2}} = p_t-\frac{\e}{2}\nabla U(x_t),\qquad
      x_{t+\e}=x_t+\e M^{-1}p_{t+\frac{\e}{2}},\qquad
      p_{t+\e}=p_{t+\frac{\e}{2}}-\frac{\e}{2}\nabla U(x_{t+\e}),
      \]
      and the resulting approximate flow map is
      \[
      \varphi_{L\e}(x_0,p_0):=(x_{L\e},p_{L\e}).
      \]
      Thus \(x_{L\e}\) is the position after \(L\) leapfrog steps from \((x_0,p_0)\). The symbols \(\mathbb{P}_{\mathfrak{L}}\) and \(\mathbb{E}_{\mathfrak{L}}\) denote probability and expectation with respect to \(L\sim\mathfrak{L}(\cdot)\).

      ##### Assumptions
      In this section the distribution \(\mathfrak{L}(\cdot)\) for the number of leapfrog steps \(L\) is assumed not to depend on the current position of the chain.

      ##### Statement
      **Assumption A1** (label `ass:A1`). The distribution \(\mathfrak{L}(\cdot)\) is such that
      \[
      \mathbb{P}_{\mathfrak{L}}[L=1]>0,
      \]
      and for any fixed \((x_0,p_0)\in\R^{2d}\) and \(\e>0\), there is an \(s<\infty\) such that
      \[
      \mathbb{E}_{\mathfrak{L}}\!\left[e^{s\|x_{L\e}\|}\right]<\infty.
      \]
