      Assume Conditions \ref{cond0-model-main}--\ref{cond1-well-condition-main} and \ref{cond-ident-main} hold. Then \(\bbeta^*\) is the unique minimizer of \(\mathsf{Q}(\bbeta;\gamma, \bomega)\) for large enough \(\gamma\): for any \(\epsilon \in (0, 1)\) and any \(\gamma\ge \epsilon^{-1} \gamma^*\) with
      \begin{align}
      \label{eq:thm1-gamma-star-main}
          \gamma^* = (\kappa_L)^{-3} \sup_{S: S\cap G \neq \emptyset} \left(\mathsf{b}_S/\bar{\mathsf{d}}_S\right),
      \end{align}
      where \(\mathsf{b}_S = \|\frac{1}{|\mathcal{E}|}\sum_{e\in \mathcal{E}} \mathbb{E} [\varepsilon^{(e)} \bx_S^{(e)}] \|^2_2\) and \(\bar{\mathsf{d}}_S = \sum_{e\in \mathcal{E}} \frac{1}{|\mathcal{E}|} \|\bbeta^{(e,S)} - \bar{\bbeta}^{(S)}\|_2^2\)
       with \(\bar{\bbeta}^{(S)}=\frac{1}{|\mathcal{E}|} \sum_{e'\in \mathcal{E}} \bbeta^{(e',S)}\), we have
      \begin{align}
      \label{eq:thm1-jsc-condition-main}
          \mathsf{Q}(\bbeta;\gamma, \bomega) - \mathsf{Q}(\bbeta^*;\gamma, \bomega) \ge (1-\epsilon) \|\bSigma^{1/2}(\bbeta - \bbeta^*)\|_2^2 + \kappa_L^2 (\gamma - \epsilon^{-1}\gamma^*) \bar{\mathsf{d}}_{\supp(\bbeta)}.
      \end{align}
    assumptions:
      - |-
        To simplify the presentation, we consider the case of balanced data with equal weights, that is, \(n^{(e)} \equiv n\) and \(\omega^{(e)} \equiv 1/|\mathcal{E}|\). We focus on the centered covariate case that \(\mathbb{E}[\bx^{(e)}] = \bm{0}\), and it can be easily generalized to the non-centered counterpart.

        \begin{condition}
        \label{cond0-model-main}
            For each \(e\in \mathcal{E}\),  \((\bx_1^{(e)}, y_1^{(e)}), \ldots, (\bx_{n}^{(e)}, y_{n}^{(e)})\) are i.i.d. copies of \((\bx^{(e)}, y^{(e)}) \sim \mu^{(e)}\), where \(\mu^{(e)}\) belongs to \(\mathcal{U}_{\bbeta^*, \sigma^2}\) for some \(\sigma^2\). The data from different environments are also independent.  We set \(\omega^{(e)} \equiv 1/|\mathcal{E}|\). 
        \end{condition}

        \begin{condition}
        \label{cond1-well-condition-main}
            There exists some universal constants \(\kappa_L \in (0,1]\) and \(\kappa_U \in [1,\infty)\) such that
            \begin{align}
                \forall e\in \mathcal{E}, ~~~~~~~~~~ \kappa_L \bI_p \preceq \bSigma^{(e)} \preceq \kappa_U \bI_p.
            \end{align}
        \end{condition}

        \begin{condition}[Identification]
        \label{cond-ident-main}
            For any \(S\subseteq [p]\) satisfying \(S \cap G \neq \emptyset\), there exists some \(e, e'\in \mathcal{E}\) such that \(\bbeta^{(e, S)} \neq \bbeta^{(e',S)}\), where \(\bbeta^{(e,S)}\) is defined in \eqref{eq:local-minimizer}.
        \end{condition}
    proof_body: |-
      ### Definitions and notation used in Proof
      For the proof, write
      \[
      \bar{\bu} = \sum_{e\in \mathcal{E}} \omega^{(e)} \mathbb{E}[\varepsilon^{(e)} \bx^{(e)}],
      \]
      as it appears in the calculation of \(\mathsf{T}_1\).

      ### Proof
      It follows from the definition of \(\mathsf{Q}(\bbeta; \gamma, \bomega)\) and Condition \ref{cond0-model-main} that
      \begin{align*}
      \mathsf{Q}(\bbeta; \gamma,\bomega) - \mathsf{Q}(\bbeta^*;\gamma, \bomega)
      = \mathsf{R}(\bbeta;\bomega) - \mathsf{R}(\bbeta^*; \bomega) + \gamma \mathsf{J}(\bbeta; \bomega)
      = \mathsf{T}_1(\bbeta) + \gamma \mathsf{T}_2(\bbeta).
      \end{align*}
      Denote \(\bDelta = \bbeta - \bbeta^*\), \(S=\supp(\bbeta)\), \(T=S^*\setminus S\), and \(\bar{S} = S\cup S^*\). It follows from the model \(y^{(e)} = (\bbeta^*)^\top \bx^{(e)} + \varepsilon^{(e)}\) that
      \begin{align*}
      \mathsf{T}_1(\bbeta)
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \left(\mathsf{R}^{(e)}(\bbeta) - \mathsf{R}^{(e)}(\bbeta^*)\right) \\
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \left(\mathbb{E} \left[|y^{(e)} - \bbeta^\top \bx^{(e)}|^2 \right]- \mathbb{E} \left[|y^{(e)} - (\bbeta^*)^\top \bx^{(e)}|^2 \right]\right) \\
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \left(\mathbb{E} \left[|(\bbeta^* - \bbeta)^\top \bx^{(e)} + \varepsilon^{(e)} |^2\right] - \mathbb{E}[|\varepsilon^{(e)}|^2 ]\right) \\
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \bDelta^\top \bSigma^{(e)} \bDelta - 2\bDelta^\top \mathbb{E}\left[\varepsilon^{(e)} \bx^{(e)} \right] \\
      &= \bDelta^\top \Bigg(\sum_{e\in \mathcal{E}} \omega^{(e)} \bSigma^{(e)} \Bigg) \bDelta - 2\bDelta^\top \Bigg(\sum_{e\in \mathcal{E}} \omega^{(e)} \mathbb{E}[\varepsilon^{(e)} \bx^{(e)}] \Bigg) \\
      &= \bDelta_{\bar{S}}^\top \bSigma_{\bar{S}} \bDelta_{\bar{S}} - 2 \bDelta^\top_{\bar{S}} \bar{\bu}_{\bar{S}}.
      \end{align*}
      It follows from the fact \(\bar{\bu}_T=\bm{0}\) and Cauchy-Schwarz inequality that
      \begin{align}
      \label{eq:proof-thm1-eq1}
      2\bDelta^\top_{\bar{S}} \bar{\bu}_{\bar{S}}
      = 2\left(\sqrt{\epsilon} \bDelta_{\bar{S}} \bSigma_{\bar{S}}^{1/2} \right) \left(\epsilon^{-1/2} \bSigma_{\bar{S}}^{-1/2} \bar{\bu}_{\bar{S}} \right)
      \le \epsilon \bDelta_{\bar{S}}^\top \bSigma_{\bar{S}} \bDelta_{\bar{S}} + \epsilon^{-1} \bar{\bu}_{\bar{S}}^\top \bSigma_{\bar{S}}^{-1} \bar{\bu}_{\bar{S}}.
      \end{align}
      Plugging this inequality back yields
      \begin{align}
      \label{eq:proof-thm1-t1-lb}
      \mathsf{T}_1(\bbeta) \ge (1-\epsilon) \bDelta_{\bar{S}}^\top \bSigma_{\bar{S}} \bDelta_{\bar{S}} - \epsilon^{-1} \bar{\bu}_{\bar{S}}^\top \bSigma_{\bar{S}}^{-1} \bar{\bu}_{\bar{S}}.
      \end{align}
      At the same time, we also have
      \begin{align*}
      \mathsf{T}_2(\bbeta)
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \left\|\mathbb{E} \left[(y^{(e)} - \bbeta^\top \bx^{(e)}) \bx_S^{(e)}\right]\right\|_2^2 \\
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \left\| \mathbb{E} \left[\varepsilon^{(e)} \bx_{\bar{S}}^{(e)} \right] + (\bbeta^*_S - \bbeta_S)^\top \mathbb{E} \left[\bx_S^{(e)} (\bx_S^{(e)})^\top\right] + (\bbeta_T^*)^\top \mathbb{E} \left[\bx_T^{(e)} (\bx_S^{(e)})^\top\right] \right\|^2 \\
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \left\| \bar{\bu}_{S} + \bSigma^{(e)}_{S,T} \bbeta_T^* - \bSigma^{(e)}_S \bDelta_S\right\|_2^2 \\
      &= \sum_{e\in \mathcal{E}} \omega^{(e)} \left\| \bSigma_S(\bbeta^{(e, S)} - \bbeta^* - \bDelta_S) \right\|^2.
      \end{align*}
      Putting these pieces together with Condition \ref{cond1-well-condition-main}, we have
      \begin{align}
      \mathsf{T}_1(\bbeta) + \gamma \mathsf{T}_2(\bbeta)
      &\ge (1-\epsilon)  \|\bSigma^{1/2}\bDelta_{\bar{S}}\|_2^2
      - \epsilon^{-1} \kappa_L^{-1} \|\bar{\bu}_{S}\|_2^2
      + \gamma \sum_{e\in \mathcal{E}} \omega^{(e)} \kappa_L^2 \| \bbeta^{(e,S)} - \bbeta^* - \bDelta_S\|^2_2 \nonumber \\
      &\ge (1-\epsilon) \|\bSigma^{1/2}\bDelta_{\bar{S}}\|_2^2
      - \epsilon^{-1} \kappa_L^{-1} \mathsf{b}_{S}
      + \inf_{\bv \in \mathbb{R}^{|S|}}\gamma \sum_{e\in \mathcal{E}} \omega^{(e)} \kappa_L^2 \| \bbeta^{(e,S)}_S - \bbeta^*_S - \bv\|^2_2.
      \label{eq:proof-thm1-mixed-lb}
      \end{align}
      Define
      \begin{align*}
      L(\bv) = \sum_{e\in \mathcal{E}} \omega^{(e)} \| \bbeta^{(e,S)}_S - \bbeta^*_S - \bv\|^2_2.
      \end{align*}
      It is obvious that \(L(\bv)\) is of a quadratic form and is strongly convex with curvature \(1\). So it has the unique global minimizer
      \begin{align*}
      \bv^*=\sum_{e\in \mathcal{E}}\omega^{(e)} \bbeta^{(e,S)} -\bbeta_S^*
      \end{align*}
      with minimum value
      \begin{align}
      \label{eq:j-to-bs}
      \inf_{\bv \in \mathbb{R}^{|S|}} L(\bv)
      = \sum_{e\in \mathcal{E}} \omega^{(e)} \|\bbeta_S^{(e,S)} - \bbeta_S^* - \bv^*\|_2^2
      = \bar{\mathsf{d}}_S.
      \end{align}
      Substituting this minimum value back into the preceding lower bound gives
      \begin{align}
      \label{eq:thm1-proof-decomp}
      \mathsf{T}_1(\bbeta) + \gamma \mathsf{T}_2(\bbeta)
      &\ge (1 - \epsilon) \|\bSigma^{1/2}\bDelta\|_2^2 - \epsilon^{-1} \kappa_L^{-1} \mathsf{b}_S + \gamma \kappa_L^2 \bar{\mathsf{d}}_{S} \\
      &= (1-\epsilon) \|\bSigma^{1/2}\bDelta\|_2^2 - \epsilon^{-1} \kappa_L^{-1} \mathsf{b}_S + \epsilon^{-1} \kappa_L^2 \bar{\mathsf{d}}_S \gamma^* +  (\gamma - \epsilon^{-1} \gamma^*) \kappa_L^2 \bar{\mathsf{d}}_S \nonumber \\
      &\ge (1-\epsilon) \|\bSigma^{1/2}\bDelta\|_2^2 + (\gamma - \epsilon^{-1} \gamma^*) \kappa_L^2 \bar{\mathsf{d}}_S. \nonumber
      \end{align}
      This completes the proof.
