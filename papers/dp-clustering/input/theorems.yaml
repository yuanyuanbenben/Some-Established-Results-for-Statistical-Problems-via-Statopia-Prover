      Source extraction. The result is Lemma \ref{lemma:ConvProbBound} in the supplied supplement file \texttt{supp.tex}, “Supplementary Materials for Clustering consistency with Dirichlet process mixtures” (Filippo Ascolani; Antonio Lijoi; Giovanni Rebaudo; Giacomo Zanella), in the proof of Theorem \ref{th:ConsBounded}. It supports the current target by justifying passage from convergence in \(P^{(\infty)}\)-probability of the indicator-weighted posterior ratio sum to unconditional convergence in probability. The specialization \(Z_n=\sum_{s=1}^{n-t}\operatorname{pr}(K_n=t+s\mid X_{1:n})/\operatorname{pr}(K_n=t\mid X_{1:n})\) and the specific event \(\Omega_n\) belong to the current proof, not to this lemma’s Statement.

      ##### Definitions and notation
      Let \(X_{1:n}=(X_1,\dots,X_n)\) be the first \(n\) coordinates of \(X_{1:\infty}\), and let \(P^{(\infty)}\) be the product probability measure induced on \(\mathbb{X}^\infty\) by the data-generating process. For a set \(A\), \(\mathbbm{1}_A\) denotes its indicator function. A sequence \(W_n\) converges to \(0\) in \(P^{(\infty)}\)-probability if for every \(\epsilon>0\),
      \[
      P^{(\infty)}(|W_n|>\epsilon)\to 0
      \]
      as \(n\to\infty\). The sets \(\Omega_n\) may depend on \(X_{1:n}\).

      ##### Assumptions
      No separately named assumption block is cited. The lemma’s hypotheses are stated inline in the Statement: \(P^{(\infty)}(\Omega_n)\to1\) and \(Z_n\mathbbm{1}_{\Omega_n}\to0\) in \(P^{(\infty)}\)-probability.

      ##### Statement
      Let \(\Omega_n\) be a sequence of sets depending on \(X_{1:n}\), and let \(Z_n\) be random variables on the same probability space such that \(P^{(\infty)}(\Omega_n) \to 1\) and
      \[
      Z_n \mathbbm{1}_{\Omega_n} \to 0
      \]
      in \(P^{(\infty)}\)-probability as \(n \to \infty\). Then \(Z_n \to 0\) in \(P^{(\infty)}\)-probability as \(n \to \infty\).
