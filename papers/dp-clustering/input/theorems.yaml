      ##### Lemma \ref{lemma:consGeneral}

      ###### Definitions and notation
      Consider the Dirichlet process mixture model
      \[
      X_i|\theta_i \simind k(\cdot|\theta_i), \qquad
      \theta_i \mid \tilde P \simiid \tilde P, \qquad
      \tilde P\mid \alpha \sim \operatorname{DP}(\alpha,Q_0), \qquad
      \alpha\sim\pi,
      \]
      where \(k(\cdot|\theta)\) is a density for every \(\theta\), \(\alpha>0\) is the concentration parameter, and \(Q_0\) is the baseline distribution on the sample space \((\mathbb X,\mathcal X)\). The prior density of \(\alpha\) is denoted by \(\pi\).

      For every natural numbers \((n,s)\) with \(s\le n\), let \(\tau_s(n)\) be the set of partitions of \(\{1,\dots,n\}\) into \(s\) nonempty subsets. The number of clusters in a sample of size \(n\) under the above model is denoted by \(K_n\), and
      \[
      \operatorname{pr}(K_n=s\mid X_{1:n})
      \]
      denotes the corresponding posterior probability.

      The data-generating mechanism is
      \[
      X_i\simiid P=\sum_{j=1}^t p_jR_j,\qquad i=1,2,\dots,
      \]
      where \(t\ge1\), the \(R_j\)'s are distinct probability measures on \(\mathbb X\), \(p_j\in(0,1)\) for every \(j\), and \(\sum_{j=1}^t p_j=1\). The product probability measures on \(\mathbb X^n\) and \(\mathbb X^\infty\) are denoted by \(P^{(n)}\) and \(P^{(\infty)}\), respectively, and \(X_{1:\infty}\sim P^{(\infty)}\).

      Let \(f_j(\cdot):=f(\cdot\mid\theta_j^*)=k(\cdot\mid\theta_j^*)\). Since \(k(x\mid\theta)=g(x-\theta)\), the density of \(P\) is
      \[
      f(x)=\sum_{j=1}^t p_jk(x\mid\theta_j^*)=\sum_{j=1}^t p_jg(x-\theta_j^*).
      \]
      The true parameter vector \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\) is completely separated:
      \[
      |\theta_j^*-\theta_k^*|>b-a\qquad (j\ne k).
      \]
      Each \(\theta_j^*\) belongs to the interior support of \(Q_0\).

      Define
      \[
      C_j=\left\{i\in\{1,\dots,n\}\,:\,x_i\in[\theta_j^*+a,\theta_j^*+b]\right\},
      \qquad n_j=|C_j|.
      \]
      For \(X_{C_j}\), let \(X^j_{(r)}\) denote the \(r\)-th order statistic, and define
      \[
      Y^j_{n_j}:=\min\left[1,\; n_j(\log n)^{\frac1{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}\right].
      \]
      For each \(j=1,\dots,t\), let \(N_j\) be the integer threshold furnished by Lemma \ref{denom}; equivalently, \(N_j\) is chosen so that the lower bound of Lemma \ref{denom} holds for every \(n_j\ge N_j\). Define
      \[
      \Omega_n=\left\{\text{for every }j=1,\dots,t:\ n_j\ge N_j,\; Y^j_{n_j}\in[1/2,1]\right\}.
      \]
      Also, after the linear rescaling used in the source proof, one may take \([a,b]=[-c,c]\).

      ###### Assumptions
      The prior \(\pi\) satisfies the following conditions.

      \begin{enumerate}
      \item[\(A1\)] \emph{Absolute continuity:} \(\pi\) is absolutely continuous with respect to the Lebesgue measure, and its density is still denoted by \(\pi\).
      \item[\(A2\)] \emph{Polynomial behaviour around the origin:} there exist \(\epsilon,\delta,\beta>0\) such that for every \(\alpha\in(0,\epsilon)\),
      \[
      \frac1\delta\,\alpha^\beta\le \pi(\alpha)\le \delta\,\alpha^\beta.
      \]
      \item[\(A3\)] \emph{Subfactorial moments:} there exist \(D,\nu,\rho>0\) such that for every \(s\ge1\),
      \[
      \int \alpha^s\pi(\alpha)\,d\alpha < D\rho^{-s}\Gamma(\nu+s+1).
      \]
      \end{enumerate}

      The kernel and base measure satisfy the following conditions. The kernel has the location form
      \[
      k(x\mid\theta)=g(x-\theta)\qquad (x\in\mathbb R),
      \]
      where \(g\) is a density function on the real line. After the linear rescaling that allows one to assume \([a,b]=[-c,c]\), the assumptions \(B1\)–\(B3\) on \(g\) and \(Q_0\) are rewritten in the source as:

      \begin{enumerate}
      \item[\(T1.\)] \(\exists\,m,M\) such that
      \[
      0<m\le g(x)\le M<\infty\qquad\text{for every }x\in[-c,c].
      \]
      \item[\(T2.\)] \(g\) is differentiable on \((-c,c)\) and \(\exists\,R\) such that
      \[
      \left|\frac{g'(x)}{g(x)}\right|\le R<\infty\qquad\text{for every }x\in(-c,c).
      \]
      \item[\(T3.\)] \(\exists\,U>0\) such that
      \[
      h(y)=q_0(y)+q_0(-y)\le U\qquad\text{for every }y\in[0,2c].
      \]
      \item[\(T4.\)] \(\exists\,L>0\) such that
      \[
      q_0(\theta)\ge L
      \]
      for every \(\theta\) in a neighborhood of \(\theta_j^*\), for every \(j\).
      \end{enumerate}

      The data satisfy
      \[
      X_i\simiid P=\sum_{j=1}^t p_jR_j,
      \]
      with \(t\in\{1,2,\dots\}\), \(p_j\in(0,1)\), \(\sum_{j=1}^t p_j=1\), the \(R_j\)'s distinct probability measures, \(f_j=k(\cdot|\theta_j^*)\), \(\theta^*\) completely separated, and \(\theta_j^*\) in the interior support of \(Q_0\) for every \(j\).

      ###### Statement
      Consider the setting of \eqref{eq:MixDPM} with \((f,k,q_0)\) as in Theorem \ref{th:ConsBounded}. Moreover, assume that \(\pi(\alpha)\) satisfies assumptions \(A1\), \(A2\), and \(A3\). Then, under \(X_{1:\infty}\sim P^{(\infty)}\),
      \[
      \mathbb E\left\{
      \mathbbm{1}_{\Omega_n}
      \sum_{s=1}^{n-t}
      \frac{\operatorname{pr}(K_n=t+s\mid X_{1:n})}
      {\operatorname{pr}(K_n=t\mid X_{1:n})}
      \right\}\to 0
      \]
      as \(n\to\infty\), with \(\Omega_n\) as defined above.

