    latex_statement: |-
      Reference-specific reading context (definitions, source clues and background; not a list of free hypotheses or an assumed theorem). Preserve original source conditions that explicitly govern this result, including section or appendix standing conditions, with their original scope even when its displayed statement does not repeat them:
      Deterministic product-ratio estimate comparing $\prod_{i\in C_j} g(x_i-\theta_j)/g(x_i)$ with an indicator describing the window $[x^j_{(n_j)}-c,\,x^j_{(1)}+c]$ together with the small interval $|\theta_j-\theta_j^*|\le 1/n_j$. The supplied statement is reproduced as printed with denominator $g(x_i)$; the source proof uses a without-loss-of-generality normalization $\theta_j^*=0$, in which case an unnormalized formulation restores the denominator as $g(x_i-\theta_j^*)$. This normalization issue is explicitly present in the supplied material and is not silently erased. The lemma uses T1–T2 only; it does not use the density bound T3 or the local lower bound T4. In the cited chain, only the first comparison with the indicator integral is Lemma \ref{denom1}; the final bound $Le^{-R}\min\{1/n_j,\,c-X^j_{(n_j)}\}$ uses T4 and belongs to the target proof. The selected proof also presents a stronger local product-ratio estimate $\prod_{i\in C_j} g(X_i-\theta)/g(X_i)\ge e^{-Rn_j|\theta|}$ for $\theta\in[-A,B]$, and hence Lebesgue-almost everywhere with the indicator $\mathbbm{1}_{[-A,B]}(\theta)$, yielding for $|\theta|\le1/n_j$ the consequence $\prod_{i\in C_j} g(X_i-\theta)/g(X_i)\ge e^{-R}\mathbbm{1}_{[-A,B]}(\theta)$; this stronger local derivation is generated proof work, while Lemma \ref{denom1} remains the independently sourced article/supplement result behind the cited product-ratio comparison.

      Parent-task shared reading context. References here to the selected target, its proof or its dependencies describe the parent consumer, not this fixed target. Do not automatically import the parent's hypotheses, dependency list or conclusions. Preserve relevant definitions and any original source conditions explicitly applying to this result, including conditions inherited by its own source section or appendix; distinguish those from assumptions used only by the parent:
      Let $t\ge1$. The data are $X_i\sim_{\mathrm{iid}} P=\sum_{j=1}^t p_jR_j$, $i=1,2,\dots$, where the $R_j$ are distinct probability measures on $\mathbb X$, $p_j\in(0,1)$, and $\sum_{j=1}^t p_j=1$. Let $k(x\mid\theta)=g(x-\theta)$ be the location kernel and $Q_0(d\theta)=q_0(\theta)\,d\theta$. The true component densities are $f_j(\cdot)=f(\cdot\mid\theta_j^*)=k(\cdot\mid\theta_j^*)$, and $\theta^*=(\theta_1^*,\dots,\theta_t^*)$ is completely separated: $|\theta_j^*-\theta_k^*|>b-a$ for $j\ne k$. After the linear rescaling used in the source, $[a,b]=[-c,c]$, so complete separation becomes $|\theta_j^*-\theta_k^*|>2c$. For every $n$, define $C_j=\{i\in\{1,\dots,n\}: X_i\in[\theta_j^*-c,\theta_j^*+c]\}$, $n_j=|C_j|$, let $X^j_{(r)}$ denote the $r$-th order statistic of $X_{C_j}$, and define $Y^j_{n_j}:=\min\{1,\; n_j(\log n)^{\frac1{2t}}(c+\theta_j^*-X^j_{(n_j)})\}$. The selected target is stated under the standing assumptions: (T1) there exist $m,M>0$ such that $0<m\le g(x)\le M<\infty$ for every $x\in[-c,c]$; (T2) $g$ is differentiable on $(-c,c)$, and there exists $R<\infty$ with $|g'(x)/g(x)|\le R$ for every $x\in(-c,c)$; (T3) there exists $U>0$ such that $h(y)=q_0(y)+q_0(-y)\le U$ for every $y\in[0,2c]$; (T4) there exists $L>0$ such that $q_0(\theta)\ge L$ in a neighborhood of $\theta_j^*$ for every $j=1,\dots,t$. The selected target uses T1–T4; the external lemma above uses only the product-ratio estimate under T1–T2, while the passage to the final target bound also uses $q_0$ through T4. The local Lemmas 2.1, 3.1, and 4.1 appearing in the selected proof are generated proof work, not independently sourced external results, and are therefore not entered as separate entries in this collection. The final materials note that the selected target cannot be read as a deterministic statement holding uniformly over every data set: in a one-component model with $C_j=\{1,\dots,n\}$, $n_j=n$, $X^j_{(1)}=X^j_{(n_j)}=-c$, one has $A=2c$, $B=0$, and $Y^j_{n_j}=\min\{1,\,2cn(\log n)^{1/2}\}=1$ for all sufficiently large $n$; taking $g(-c)=M$ and $q_0=m$ on $[-c,0]$ gives $I_j=(m/M)^n\int_{-2c}^0 q_0(\theta)\,d\theta=\frac12(m/M)^n$, which decays geometrically, so no fixed $K>0$ and threshold $N_j$ can make the target inequality hold for all large $n$ in every realization. Accordingly, the valid and used reading is almost sure: for every $j=1,\dots,t$ there exist $K>0$ and $N_j\in\mathbb N$ such that, for $P^{(\infty)}$-almost every realization, the target inequality holds for every $n$ with $n_j\ge N_j$. In the proof of Theorem \ref{th:ConsBounded} the bound is applied on the event $\Omega_n$, whose $P^{(\infty)}$-probability tends to one. If $g$ is continuous at $\pm c$, so that $g(\pm c)=e^{p(\pm c)}$ and the extension of Section 2 is the identity, the transfer step disappears and the bound holds for every data set with $n_j\ge N_j$.

      Formalization clarifications from source and proof:
      1. Constants and quantifier order. The intended reading of the selected lower-bound statement is: first fix \(t\ge1\), \(c>0\), the standing kernel/density objects \(g,q_0,Q_0\), the true weights \(p_j\), true locations \(\theta_j^*\), the complete-separation condition, and \(T1\)–\(T4\); then fix \(j\in\{1,\dots,t\}\); then choose \(N_j\) (and, in the proof, \(K\)); only afterwards quantify over \(n\) and the realization with \(n_j=|C_j|\ge N_j\). Thus \(K\) is not allowed to depend on \(n\), on \(C_j\), on the observations, or on \(Y^j_{n_j}\), and \(N_j\) is not an \(n\)-dependent threshold. The selected proof explicitly states that the same \(K\) works for all \(j\) when the \(T4\) lower bound uses one common \(L\), while only \(N_j\) depends on \(j\) through the \(T4\) neighborhood; the raw quantifier “for every \(j\) there exist \(K\) and \(N_j\)” could syntactically allow \(K\) to depend on \(j\), but the intended source proof constructs a global \(K\). The constants \(m,M,R,U,L\) belong to the fixed assumptions \(T1,T2,T3,T4\); they may depend on the fixed \(g,q_0,c,t\), but not on sample size, \(C_j\), \(n_j\), or \(X_i\). Do not confuse the \(T2\) constant \(R\) with the true component measures \(R_j\). The source’s printed proof of Lemma denom sets \(K=(2Le^{-R})^t\), while the selected repaired proof says the supported constant is \(K=(Le^{-R})^t\) and notes that the printed factor \(2\) cannot be obtained with the same \(L\); the expression \((2L_0e^{-R})^t\) is only a rewriting after replacing \(L\) by an admissible \(L_0=L/2\). The selected statement uses the power \(K^{1/t}\); an intermediate displayed equality in the extracted supplementary proof writing \(K^{1/(2t)}\) is inconsistent with the statement and surrounding algebra and should not be formalized as the target exponent. Complete separation is strict: \(|\theta_j^*-\theta_k^*|>b-a\); after rescaling \([a,b]=[-c,c]\), this becomes \(>2c\), not \(>c\), so do not replace \(b-a\) by \(c\). The main paper states only that each \(\theta_j^*\) belongs to the interior support of \(Q_0\), whereas the selected lower bound assumes the stronger \(T4\): \(q_0\ge L\) on a neighborhood of each \(\theta_j^*\). The source does not justify \(T4\) from mere support membership; for formalization, \(T4\) must be an explicit assumption. The exact shape/openness of the \(T4\) neighborhood is not specified; it is enough to choose \(\delta_j>0\) with \(q_0(\theta)\ge L\) for \(|\theta-\theta_j^*|\le\delta_j\), then choose \(1/N_j\le\delta_j\). If the source’s \(T4\) were interpreted with a different \(L_j\) for each \(j\), then \(K\) could become \(j\)-dependent; the printed \(T4\) text but not every proof detail is explicit on this uniformity.

      2. Norms and mathematical objects. Everything in the selected result is scalar on the real line: the parameter \(\theta\) and observations \(X_i\) are real-valued, and \(|\cdot|\) means ordinary absolute value, not a Euclidean vector norm, sup norm, operator norm, or Frobenius norm. The integral is over \(\mathbb R\) with Lebesgue measure, and \(Q_0(d\theta)=q_0(\theta)d\theta\). The kernel is exactly the location family \(k(x\mid\theta)=g(x-\theta)\); \(g\) is a probability density with the main paper’s support condition “strictly positive on some interval \([a,b]\) and \(0\) elsewhere,” while \(T1\) in the proof records only \(0<m\le g\le M\) on the rescaled interval \([-c,c]\). Do not infer support or nonnegativity outside \([-c,c]\) from \(T1\) alone; use the main \(B1\)-type support condition when needed. The target integral is \(\int_{\mathbb R}\prod_{i\in C_j}g(X_i-\theta_j)/g(X_i-\theta_j^*)\,q_0(\theta_j)\,d\theta_j\). Reference R1/Lemma denom1 prints the denominator as \(g(x_i)\) because its proof says “Without loss of generality assume \(\theta_j^*=0\)”; for general \(\theta_j^*\) the denominator must be restored to \(g(X_i-\theta_j^*)\). The corresponding indicator from R1 is exact: \(\mathbf 1_{[0,1/n_j]}(|\theta_j-\theta_j^*|)\,\mathbf 1_{[X^j_{(n_j)}-c,\,X^j_{(1)}+c]}(\theta_j-\theta_j^*)\) (with endpoint values immaterial almost everywhere). The sets are \(C_j=\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\}\), after rescaling \([\theta_j^*-c,\theta_j^*+c]\), and \(n_j=|C_j|\) is random. The order statistics \(X^j_{(1)},X^j_{(n_j)}\) are taken over \(X_{C_j}\) only, not over the full sample. The random variable is \(Y^j_{n_j}=\min\{1,\,n_j(\log n)^{1/(2t)}(c+\theta_j^*-X^j_{(n_j)})\}\); it uses the upper order statistic/right endpoint gap, the random count \(n_j\), and \(\log n\), not \(\log n_j\). Do not replace \(n_j\) by \(n\), and do not replace the cap \(\min\{1,\cdot\}\) by a max or by \(1\).

      3. Asymptotics. The selected lower-bound statement itself uses no \(O\), \(o\), or little-\(o\) notation. It is a finite-sample lower bound with existential constants and a threshold: for fixed \(j\), there exist \(K>0\) and \(N_j\in\mathbb N\) such that for all \(n\) with \(n_j\ge N_j\) the displayed inequality holds (with the endpoint caveat below). The limiting variable in the surrounding theorem is \(n\to\infty\), while \(n_j\) is a random function of the sample; the condition is on the realized \(n_j\), not a uniformity over all subsets of size \(n_j\). The source’s later use of \(Y^j_{n_j}\to1\) is “in \(P^{(\infty)}\)-probability” (source Lemma Max and the definition of \(\Omega_n\)), and the final consistency proof restricts to the event \(\Omega_n=\{n_j\ge N_j,\ Y^j_{n_j}\in[1/2,1]\ \forall j\}\) whose probability tends to one. Do not replace \(Y^j_{n_j}\) by \(1\) for all sufficiently large \(n\), and do not promote the lower bound to a pointwise statement for every data set unless endpoint continuity is separately imposed. The source does not state uniformity of the lower bound over all choices of \(g,q_0,p_j,\theta^*\) or over all \(j\); constants may depend on the fixed structural assumptions, and only \(N_j\) is explicitly allowed to vary with \(j\) in the proof.

      4. Omitted definitions and side conditions. Here \(t\) is a fixed positive integer, \(p_j\in(0,1)\), \(\sum_{j=1}^t p_j=1\), and the \(R_j\) in the data-generating mixture are distinct true component measures, not the \(T2\) constant \(R\). The true component densities are \(f_j(\cdot)=k(\cdot\mid\theta_j^*)=g(\cdot-\theta_j^*)\). Complete separation plus the bounded support is used in the proof of Theorem ConsBounded to assert that the \(C_j\) are disjoint and cover \(\{1,\dots,n\}\) with probability one; this is a proof-based consequence, not a new definition. The order statistics require \(n_j\ge1\); original \(N_j\in\mathbb N\) is not detailed, while the selected proof takes \(N_j\ge3\), so for Lean include a positive-size side condition or take the selected threshold. The \(T4\) neighborhood must contain the integration interval used near \(\theta_j^*\); under the normalization \(\theta_j^*=0\), the original proof uses a one-sided interval \([-1/n_j,0]\) and the selected proof uses \([-1/n_j,1/n_j]\), so \(N_j\) must satisfy \(1/n_j\le\delta_j\). The source leaves endpoint regularity of \(g\) under \(T1\)–\(T2\) ambiguous: \(B2\) only gives differentiability on the open support, and the values \(g(\pm c)\) need not equal the one-sided limits. The original Lemma denom1 proof writes \(p=\log g\) on \([-c,c]\), but the selected proof repairs this by redefining \(g\) at \(\pm c\) by continuous extension, showing the bound holds \(P^{(\infty)}\)-almost surely for the original kernel and may fail for arbitrary endpoint values on a null set. Thus, for a literal “every data set” formalization one needs an extra endpoint-continuity/endpoint-value hypothesis; the source-supported statement with only \(T1\)–\(T4\) is the almost-sure/on-\(\Omega_n\) version. Finally, \(q_0\) is only used as a density with pointwise lower bounds on specified neighborhoods; point values on Lebesgue-null sets should not be used, and \(q_0\ge L\) should not be extended beyond the \(T4\) neighborhood.

