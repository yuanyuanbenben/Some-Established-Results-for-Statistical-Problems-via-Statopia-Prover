      Work in the setting of the proof of Theorem \ref{th:ConsBounded} after the linear rescaling $[a,b]=[-c,c]$. The location kernel is $k(x\mid \theta)=g(x-\theta)$. For $j=1,\dots,t$, define $C_j=\{i\in\{1,\dots,n\}: x_i\in[\theta_j^*-c,\theta_j^*+c]\}$, $n_j=|C_j|$, and let $x^j_{(r)}$ denote the $r$-th order statistic of $x_{C_j}$, so that $x^j_{(1)}=\min_{i\in C_j}x_i$ and $x^j_{(n_j)}=\max_{i\in C_j}x_i$. Assume: (T1) there exist $m,M>0$ such that $0<m\le g(x)\le M<\infty$ for every $x\in[-c,c]$; (T2) $g$ is differentiable on $(-c,c)$, and there exists $R<\infty$ such that $|g'(x)/g(x)|\le R$ for every $x\in(-c,c)$. Then, for every $j=1,\dots,t$, $$\prod_{i\in C_j}\frac{g(x_i-\theta_j)}{g(x_i)}\ge e^{-R}\,\mathbbm{1}_{\left[0,\frac1{n_j}\right]}\bigl(|\theta_j-\theta_j^*|\bigr)\,\mathbbm{1}_{\left[x^j_{(n_j)}-c,\,x^j_{(1)}+c\right]}\bigl(\theta_j-\theta_j^*\bigr),$$ with $R$ the constant from T2. The display is meaningful under the usual requirement $n_j\ge1$ for the order statistics and the factor $1/n_j$.
