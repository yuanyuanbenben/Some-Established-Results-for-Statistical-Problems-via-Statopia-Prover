      ##### Example 6.20 (Ghosal–van der Vaart, 2017; source text unverified)
      ###### Definitions and notation
      Let \(\mathbb X\subseteq\mathbb R^q\) and \(\Theta\subseteq\mathbb R^p\), as in the shared reading context. Let \(\mu\) be Lebesgue or counting measure on \(\mathbb X\). For each \(\theta\in\Theta\), \(k(\cdot\mid\theta)\) is a density with respect to \(\mu\); \(k(\cdot\mid\theta)\mu(dx)\) denotes the corresponding probability measure.

      The Dirichlet process mixture model is
      \[
      X_i\mid\theta_i \simind k(\cdot\mid\theta_i),\qquad
      \theta_i\mid \tilde P \simiid \tilde P,\qquad
      \tilde P\mid\alpha \sim \operatorname{DP}(\alpha,Q_0),\qquad
      \alpha\sim\pi,
      \]
      where \(\pi\) is a prior on \(\alpha>0\). The random density is
      \[
      h(x)=\int k(x\mid\theta)\,\tilde P(d\theta).
      \]
      Posterior probabilities are denoted \(\operatorname{pr}(\cdot\mid X_{1:n})\).

      The laws of \(X_{1:n}\) and \(X_{1:\infty}\) under i.i.d. sampling from \(P\) are denoted \(P^{(n)}\) and \(P^{(\infty)}\), respectively.

      For \(s\ge1\), the set of exact \(s\)-component mixtures is
      \[
      \mathbb G_s
      =
      \left\{
      f=\sum_{j=1}^s q_j k(\cdot\mid\theta_j):
      q_j>0,\ \sum_{j=1}^s q_j=1,\ \theta_1,\dots,\theta_s
      \text{ distinct}
      \right\}.
      \]
      For \(P\in\mathbb G_t\) with weights \(p_j\) and parameters \(\theta_j^*\), its density is
      \[
      \sum_{j=1}^t p_j k(x\mid\theta_j^*).
      \]
      The notation \(\operatorname{supp}Q_0\) denotes the support of the base measure \(Q_0\).

      A weak neighborhood is a neighborhood in the weak topology on probability measures. Weak convergence of densities is understood via the corresponding probability measures.

      For \(P\in\mathbb G_t\) with weights \(\{p_j\}_{j=1}^t\) and parameters \(\{\theta_j^*\}_{j=1}^t\), the KL neighborhood is
      \[
      KL_\epsilon(P)
      =
      \left\{
      h\in\mathcal P(\mathbb X):
      \int
      \log\left\{
      \frac{\sum_{j=1}^{t} p_j k(x\mid\theta_j^*)}{h(x)}
      \right\}
      P(dx)
      <
      \epsilon
      \right\},
      \qquad \epsilon>0.
      \]

      Let \(\bar\Theta\) be the closure of \(\Theta\), and define
      \[
      \mathbb B
      :=
      \left\{
      \bar\theta\in\bar\Theta\setminus\Theta:
      \lim_{\theta\to\bar\theta}
      \left\{
      \sup_x k(x\mid\theta)
      \right\}
      =
      \infty
      \right\}.
      \]

      ###### Assumptions
      \(H1.\) For every \(\bar\theta\in\Theta\setminus\mathbb B\), for \(\mu\)-almost every \(x\in\mathbb X\), there exists a neighborhood \(A=A(\bar\theta,x)\subset\Theta\setminus\mathbb B\) of \(\bar\theta\) such that \(\theta\mapsto k(x\mid\theta)\) is continuous on \(A\). Moreover, \(\mathbb B\) is closed.

      \(H2.\) If \(\{\theta_i\}\subset\Theta\) and \(\|\theta_i\|\to\infty\), then for every compact \(K\subset\mathbb X\),
      \[
      \int_K k(x\mid\theta_i)\,\mu(dx)\to0.
      \]
      If \(\theta_i\to\bar\theta\in\mathbb B\), then there exists \(x^*\in\mathbb X\) such that
      \[
      k(\cdot\mid\theta_i)\to\delta_{x^*}
      \]
      weakly. The norm \(\|\theta_i\|\) is not specified in the supplied source.

      \(H3.\) If \(f\in\mathbb G_t\), then there is no \(f'\in\mathbb G_s\) with \(s<t\) such that \(f=f'\) \(\mu\)-almost everywhere.

      \(H4.\) For every \(P\in\mathbb G_t\), \(t\ge1\), with \(\theta_1^*,\dots,\theta_t^*\in\operatorname{supp}Q_0\),
      \[
      \operatorname{pr}\bigl(h\in KL_\epsilon(P)\bigr)>0
      \]
      for every \(\epsilon>0\), where \(h\) follows the Dirichlet process mixture prior.

      Additionally, the true law is a finite mixture: \(t\ge1\), \(P\in\mathbb G_t\) with weights \(p_j>0\), \(\sum_{j=1}^t p_j=1\), distinct parameters \(\theta_1^*,\dots,\theta_t^*\), and
      \[
      \theta_j^*\in\operatorname{supp}Q_0
      \quad\text{for every }j=1,\dots,t.
      \]

      ###### Statement
      Assume \(H1\)–\(H4\), and let \(t\ge1\), \(P\in\mathbb G_t\) have density
      \[
      \sum_{j=1}^t p_j k(x\mid\theta_j^*),
      \]
      where \(p_j>0\), \(\sum_{j=1}^t p_j=1\), the \(\theta_j^*\) are distinct, and \(\theta_j^*\in\operatorname{supp}Q_0\) for every \(j\). Then the posterior distribution of \(h\) is consistent at \(P\) under the weak topology: for every weak neighborhood \(\mathcal U\) of \(P\),
      \[
      \operatorname{pr}\bigl(h\in\mathcal U^c\mid X_{1:n}\bigr)\to0
      \]
      in \(P^{(\infty)}\)-probability as \(n\to\infty\).
