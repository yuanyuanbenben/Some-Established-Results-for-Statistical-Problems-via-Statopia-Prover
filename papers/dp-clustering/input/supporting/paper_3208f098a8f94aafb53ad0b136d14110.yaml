      ##### Lemma \ref{main}

      ###### Definitions and notation
      Let \(\pi\) be a prior probability density on \((0,\infty)\) with respect to Lebesgue measure. In the surrounding context, \(t\) is the fixed number of mixture components, and \(n,s\) are positive integers.

      For \(n\ge 1\), the rising factorial is
      \[
      \alpha^{(n)}=\alpha(\alpha+1)\cdots(\alpha+n-1),
      \]
      so \(\alpha^{(n)}\) is not an ordinary power and not a falling factorial.

      The lower incomplete Gamma function is the unnormalized function
      \[
      \gamma(x,y)=\int_0^y z^{x-1}e^{-z}\,\mathrm{d}z.
      \]

      All integrals in the statement are over the indicated subsets of \((0,\infty)\) with respect to Lebesgue measure.

      ###### Assumptions
      A1: \(\pi\) is absolutely continuous with respect to Lebesgue measure, with density still denoted by \(\pi\).

      A2: there exist \(\epsilon,\delta,\beta>0\) such that, for every \(\alpha\in(0,\epsilon)\),
      \[
      \frac{1}{\delta}\alpha^{\beta}\le \pi(\alpha)\le \delta\alpha^{\beta}.
      \]

      Lemma \ref{main} is stated under A1 and A2. No \(A3\)-type moment condition is part of its statement.

      ###### Statement
      Under assumptions A1 and A2, for every \(n-t>s\ge 1\), it holds
      \[
      \frac{\gamma(t+s+\beta,\epsilon\{\log(n)+1\})}{\delta^2\gamma(t+\beta,\epsilon\{\log(n)+1\})}\{\log(n)+1\}^{-s}
      \leq
      \frac{\int_0^\epsilon \frac{\alpha^{t+s}}{\alpha^{(n)}}\pi(\alpha)\, \mathrm{d}\alpha}{\int_0^\epsilon \frac{\alpha^t}{\alpha^{(n)}}\pi(\alpha) \, \mathrm{d}\alpha} 
      \leq
      \frac{\delta^2 \gamma(t+s+\beta,\epsilon\log(n))}{\gamma(t+\beta,\epsilon\log(n))}\{\log(n)/(1+\epsilon)\}^{-s},
      \]
      where \(\gamma(x,y)\) is the lower incomplete Gamma function, and \(\epsilon,\delta,\beta>0\) are such that for every \(\alpha\in(0,\epsilon)\),
      \[
      \frac{1}{\delta}\alpha^\beta \leq \pi(\alpha) \leq \delta \alpha^\beta.
      \]

