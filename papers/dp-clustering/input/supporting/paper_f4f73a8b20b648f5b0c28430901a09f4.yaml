      Let $t\in\mathbb N$, $P=\sum_{j=1}^t p_jR_j$ with $p_j\in(0,1)$, $\sum_j p_j=1$, $k(x\mid\theta)=g(x-\theta)$, and $Q_0(d\theta)=q_0(\theta)d\theta$. After the linear rescaling used in the source, take $[a,b]=[-c,c]$. Assume $X_{1:\infty}\sim P^{(\infty)}$, the true parameter vector is completely separated, $|\theta_j^*-\theta_k^*|>b-a$ $(j\ne k)$, and the working conditions T1–T4 hold. Define $C_j=\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\}$, $n_j=|C_j|$, $C^{(n)}=\{n_j>0\text{ for every }j\}$. For $A_j\in\tau_{s_j}(n_j)$, write $A_j=(A^j_1,\dots,A^j_{s_j})$, $a^j_k=|A^j_k|$. For a fixed $s>t$, set $\mathbf S_s=\{(s_1,\dots,s_t):1\le s_j\le n_j\ \forall j,\ \sum_{j=1}^t s_j=s\}$. Let $X^j_{(r)}$ denote the $r$-th order statistic of $X_{C_j}$, let $N_j$ and $K$ be the threshold and positive constant furnished by Lemma \ref{denom}, and define $Y^j_{n_j}:=\min[1,\ n_j(\log n)^{\frac1{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}]$, $\Omega_n=\{\text{for every }j=1,\dots,t:\ n_j\ge N_j,\ Y^j_{n_j}\in[1/2,1]\}$. Consider
      \[
      \Sigma_{n,s}:=
      \sum_{\mathbf s\in\mathbf S_s}
      \prod_{j=1}^t
      \sum_{A_j\in\tau_{s_j}(n_j)}
      \frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}\,
      \frac{
      \prod_{k=1}^{s_j}\int_{\mathbb R}\prod_{i\in A^j_k}\dfrac{g(X_i-\theta_k)}{p_jg(X_i-\theta_j^*)}\,Q_0(d\theta_k)}
      {\int_{\mathbb R}\prod_{i\in C_j}\dfrac{g(X_i-\theta_j)}{p_jg(X_i-\theta_j^*)}\,Q_0(d\theta_j)}
      \,\mathbbm 1_{C^{(n)}}.
      \]
      Then, with $\Omega_n$ in place of $C^{(n)}$, this object is bounded above by
      \[
      T^{(n)}:=
      \frac{2^t\sqrt{\log n}}{K}
      \sum_{\mathbf s\in\mathbf S_s}
      \prod_{j=1}^t
      \sum_{A_j\in\tau_{s_j}(n_j)}
      n_j
      \frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}
      \prod_{h=1}^{s_j}
      \int_{\mathbb R}\prod_{i\in A^j_h}\frac{g(X_i-\theta_h)}{g(X_i-\theta_j^*)}\,Q_0(d\theta_h)
      \,\mathbbm 1_{\Omega_n}.
      \]
      Thus the corresponding posterior-ratio contribution with $\Omega_n$ is controlled by $T^{(n)}$.
    assumptions:
      - |-
        Assume $t\in\mathbb N$ and $P=\sum_{j=1}^t p_jR_j$ with $p_j\in(0,1)$, $\sum_{j=1}^t p_j=1$, where $R_j$ are distinct probability measures. Assume $X_{1:\infty}\sim P^{(\infty)}$. The true parameter vector $\theta^*=(\theta_1^*,\dots,\theta_t^*)$ is completely separated:
        \[
        |\theta_j^*-\theta_k^*|>b-a\qquad(j\ne k),
        \]
        and after rescaling $[a,b]=[-c,c]$ this means $|\theta_j^*-\theta_k^*|>2c$.

        The working conditions T1–T4 hold:
        \begin{enumerate}
        \item[(T1)] There exist $m,M$ with
        \[
        0<m\le g(x)\le M<\infty\qquad(x\in[-c,c]).
        \]
        \item[(T2)] $g$ is differentiable on $(-c,c)$ and there exists $R$ with
        \[
        \left|\frac{g'(x)}{g(x)}\right|\le R<\infty\qquad(x\in(-c,c)).
        \]
        \item[(T3)] There exists $U>0$ with
        \[
        h(y)=q_0(y)+q_0(-y)\le U\qquad(y\in[0,2c]).
        \]
        \item[(T4)] There exists $L>0$ such that
        \[
        q_0(\theta)\ge L
        \]
        for every $\theta$ in a neighborhood of $\theta_j^*$, for every $j=1,\dots,t$.
        \end{enumerate}
        The constants $m,M,R,U,L$ are existential for the fixed rescaled data-generating/kernel setup.
    proof_body: |-
      ### Definitions and notation used in Proof
      Let $\Sigma_{n,s}(\Omega_n)$ denote the expression for $\Sigma_{n,s}$ with $\mathbbm 1_{\Omega_n}$ in place of $\mathbbm 1_{C^{(n)}}$.

      ### Proof
      We show \(\Sigma_{n,s}(\Omega_n)\le T^{(n)}\).

      For each group \(j\), the factors \(p_j^{-a^j_k}\) in the numerator product over the blocks \(A^j_1,\dots,A^j_{s_j}\) multiply to \(p_j^{-n_j}\), because \(\sum_{k=1}^{s_j}a^j_k=n_j\). These cancel the factor \(p_j^{-n_j}\) in the denominator. Thus it suffices to apply [ref:R1] to the denominator without the \(p_j\)-factors. On \(\Omega_n\), we have \(n_j\ge N_j\) and \(Y^j_{n_j}\ge 1/2\). Hence [ref:R1] gives
      \[
      \frac{1}{\displaystyle \int_{\mathbb R}\prod_{i\in C_j}\frac{g(X_i-\theta_j)}{g(X_i-\theta_j^*)}\,Q_0(d\theta_j)}
      \le \frac{2n_j(\log n)^{\frac1{2t}}}{K^{1/t}}.
      \]
      Therefore, for each \(\mathbf s=(s_1,\dots,s_t)\in\mathbf S_s\) and each \(A_j\in\tau_{s_j}(n_j)\),
      \[
      \begin{aligned}
      &\frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}
      \frac{\prod_{k=1}^{s_j}\int_{\mathbb R}\prod_{i\in A^j_k}\frac{g(X_i-\theta_k)}{p_jg(X_i-\theta_j^*)}\,Q_0(d\theta_k)}
      {\int_{\mathbb R}\prod_{i\in C_j}\frac{g(X_i-\theta_j)}{p_jg(X_i-\theta_j^*)}\,Q_0(d\theta_j)}
      \\
      &\qquad\le
      n_j\frac{2(\log n)^{\frac1{2t}}}{K^{1/t}}
      \frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}
      \prod_{k=1}^{s_j}\int_{\mathbb R}\prod_{i\in A^j_k}\frac{g(X_i-\theta_k)}{g(X_i-\theta_j^*)}\,Q_0(d\theta_k).
      \end{aligned}
      \]
      Multiplying over \(j=1,\dots,t\) gives
      \[
      \prod_{j=1}^t\frac{2n_j(\log n)^{\frac1{2t}}}{K^{1/t}}
      =
      \frac{2^t(\log n)^{1/2}}{K}\prod_{j=1}^t n_j.
      \]
      Summing over \(\mathbf s\) and over the partitions \(A_j\in\tau_{s_j}(n_j)\), and including the indicator \(\mathbbm 1_{\Omega_n}\), we obtain
      \[
      \Sigma_{n,s}(\Omega_n)\le T^{(n)}
      :=
      \frac{2^t\sqrt{\log n}}{K}
      \sum_{\mathbf s\in\mathbf S_s}
      \prod_{j=1}^t
      \sum_{A_j\in\tau_{s_j}(n_j)}
      n_j
      \frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}
      \prod_{h=1}^{s_j}
      \int_{\mathbb R}\prod_{i\in A^j_h}\frac{g(X_i-\theta_h)}{g(X_i-\theta_j^*)}\,Q_0(d\theta_h)
      \mathbbm 1_{\Omega_n}.
      \]
      Thus the posterior-ratio contribution with \(\Omega_n\) in place of \(C^{(n)}\) is controlled by \(T^{(n)}\).

      ### References
      #### Reference R1
      Target: Lemma \ref{denom}

      Citation: For every \(j = 1, \dots, t\) there exists \(K>0\) and \(N_j \in \mathbb{N}\) such that for all \(n_j\geq N_j\) it holds
      \[
      \int_\R \prod_{i \in C_j}\frac{g(X_i - \theta_j)}{g(X_i-\theta_j^*)}q_0(\theta_j) \, \mathrm{d}\theta_j 
      \geq \frac{K^{\frac{1}{t}} Y^j_{n_j} }{n_j(\log(n))^{\frac{1}{2t}}},
      \]
      with \(Y^j_{n_j}\) defined in Lemma \ref{lemma:Max}. Define the event
      \[
      \Omega_n = \left\{\text{for every $j = 1, \dots, t$ it holds: } n_j \geq N_j, Y^j_{n_j} \in [1/2, 1] \right\}.
      \]
      Thus, an upper bound of \eqref{object} with \(\Omega_n\) in place of \(C^{(n)}\) is given by
      \[
      T^{(n)} := \frac{2^t\sqrt{\log(n)}}{K}\sum_{\textbf{s}}\prod_{j = 1}^t\sum_{A_j \in \tau_{s_j}(n_j)}n_j\frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}\prod_{h = 1}^{s_j}\int_{\mathbb{R}}\prod_{i \in A^j_h}\frac{g(X_i - \theta_h)}{g(X_i-\theta_j^*)} \, Q_0(\d \theta_h)\mathbbm{1}_{\Omega_n},
      \]
      for \(s > t\).

