      The observations and parameters are real-valued in the rescaled location-family setting. Let $t\in\mathbb N$ and let $P=\sum_{j=1}^t p_jR_j$ with $p_j\in(0,1)$, $\sum_{j=1}^t p_j=1$, and $R_j$ distinct probability measures. Let $X_{1:\infty}\sim P^{(\infty)}$, with product laws $P^{(n)}$ on $\mathbb R^n$ and $P^{(\infty)}$ on $\mathbb R^\infty$. The kernel is of location type, $k(x\mid\theta)=g(x-\theta)$, and the baseline is $Q_0(d\theta)=q_0(\theta)d\theta$. After the linear rescaling used in the source, take $[a,b]=[-c,c]$. The support interval comes from B1; the supplied pages do not expand B1–B3.

      For $n$ and $j=1,\dots,t$, define
      \[
      C_j=\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\},
      \qquad n_j=|C_j|,
      \]
      which after rescaling is $C_j=\{i:X_i\in[\theta_j^*-c,\theta_j^*+c]\}$. Let
      \[
      C^{(n)}=\{n_j>0\text{ for every }j\}.
      \]
      The sets $C_j$ are local blocks determined by the rescaled support interval; under complete separation they are disjoint and partition $\{1,\dots,n\}$ almost surely under the mixture. The symbol $C^{(n)}$ denotes the event $\{n_j>0\ \forall j\}$, not the prior-integral factor $C(n,t,t+s)$ and not the sets $C_j$.

      For $s\le n$, $\tau_s(n)$ is the set of partitions of $\{1,\dots,n\}$ into $s$ nonempty subsets. In the grouped step, $\tau_{s_j}(n_j)$ partitions $C_j$ identified with $\{1,\dots,n_j\}$. For $A_j\in\tau_{s_j}(n_j)$, write $A_j=(A^j_1,\dots,A^j_{s_j})$ and $a^j_k=|A^j_k|$. For fixed $s>t$, set
      \[
      \mathbf S_s=\{(s_1,\dots,s_t):1\le s_j\le n_j\ \forall j,\ \sum_{j=1}^t s_j=s\}.
      \]
      The integer $s$ is fixed before the bound; dependence on $s$ is in $\mathbf S_s$.

      Let $X^j_{(r)}$ denote the $r$-th order statistic of $X_{C_j}$, and define
      \[
      Y^j_{n_j}:=\min\left[1,\ n_j(\log n)^{\frac1{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}\right].
      \]
      The logarithm base is not stated; any fixed base changes only constants and no uniformity in the base is claimed. The exponent $1/(2t)$ and constants such as $2^t$ and $K$ depend on the fixed $t$.

      Let $N_j$ be the fixed integer threshold and $K>0$ the positive constant furnished by Lemma \ref{denom}. The exact dependence and values of $N_j$ are not supplied; only the existence of a positive constant $K$ as asserted in Lemma \ref{denom} is used here. Define
      \[
      \Omega_n=\left\{\text{for every }j=1,\dots,t:\ n_j\ge N_j,\ Y^j_{n_j}\in[1/2,1]\right\}.
      \]
      Distances are ordinary absolute value on $\mathbb R$; cardinalities such as $|C_j|$ and $|A^j_k|$ are set sizes.

      <!-- formalization-clarifications:v1:5ea906a659ff5ce4e3213ee80542749356ea4bc6457395824e803babb622b228 -->
      Formalization clarifications from source and proof:
      1. Constants and quantifier order. The intended order is: first fix the finite integer \(t\), the weights \(p_j\), the true separated locations \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\), the rescaled location kernel \(g\) with support scale \(c\), and the baseline density \(q_0\), all satisfying the chosen conditions T1–T4; then choose/exist constants \(m,M,R,U,L\) for that fixed rescaled setup (Definitions and notation: “The constants \(m,M,R,U,L\) are existential for the fixed rescaled data-generating/kernel setup”). Also fix \(s>t\) before the upper-bound expression; \(2^t\), the exponent \(1/(2t)\), and \(K\) may depend on the fixed \(t\), but the target uses one positive \(K\) for all \(j\), not a separate \(K_j\) per group. Lemma denom’s statement is worded “For every \(j\) ... there exists \(K>0\) and \(N_j\)”, which is ambiguous; the target’s single factor \(2^t\sqrt{\log n}/K\) and the product over \(j\) show that the intended use is a common admissible \(K\), while \(N_j\) may depend on \(j\). The proof of Lemma denom suggests the admissible choice \(K=(2Le^{-R})^t\), hence proof-based dependence on \(L,R,t\); the statement itself only asserts existence. The source leaves exact \(N_j\) values and dependence unspecified; they are thresholds from T4/q0 near \(\theta_j^*\), not functions of \(n\) or the data. Lemma denom states \(K^{1/t}\) in its display but the final displayed line of its proof has \(K^{1/(2t)}\); the lemma statement is authoritative, and the target uses the statement’s version. Do not make \(K,m,M,R,U,L,N_j\) uniform over distributions, true locations, sample size \(n\), random data, partitions \(A_j\), or the fixed \(s\) unless separately proved; a Lean parameter that is implicit does not turn a parameter-dependent constant into a uniform one. There is no varying dimension here; \(t\) is finite and fixed.

      2. Norms and mathematical objects. The only norm-like operations are ordinary absolute value on \(\mathbb R\) in \(|\theta_j^*-\theta_k^*|\) and cardinalities such as \(|C_j|\) and \(|A^j_k|\) (Definitions and notation: “Distances are ordinary absolute value on \(\mathbb R\); cardinalities ... are set sizes”). Complete separation is the strict inequality \(|\theta_j^*-\theta_k^*|>b-a\), rescaled to \(>2c\). There is no Euclidean \(l^2\), sup, operator, Frobenius, or normalized norm in the target. The ambient spaces are \(\mathbb R\), \(\mathbb R^n\), and \(\mathbb R^\infty\), with measures \(P^{(n)}\), \(P^{(\infty)}\), and baseline \(Q_0(\mathrm d\theta)\); under B3, \(Q_0\) is absolutely continuous with density \(q_0\), but the source writes both \(Q_0(\mathrm d\theta)\) and \(q_0(\theta)\,\mathrm d\theta\), so in Lean they should be linked by the density assumption rather than silently identified in all contexts. The objects \(C_j\), \(C^{(n)}\), \(\tau_s(n)\), \(\tau_{s_j}(n_j)\), \(A_j=(A^j_1,\dots,A^j_{s_j})\), \(a^j_k=|A^j_k|\), and \(\mathbf S_s\) must be kept distinct: \(C^{(n)}\) is the event \(\{n_j>0\ \forall j\}\), not the prior integral \(C(n,t,t+s)\). In the block integrals, the integration variable \(\theta_h\) in \(\int_{\mathbb R}\prod_{i\in A^j_h}\cdots Q_0(\mathrm d\theta_h)\) is a fresh block variable; it must not be confused with the true parameter \(\theta_j^*\) or with the denominator integration variable \(\theta_j\). The quantity \(X^j_{(n_j)}\) is the maximum order statistic of \(X_{C_j}\); it is defined only when \(n_j>0\), which is why the indicator \(C^{(n)}\), and later \(\Omega_n\), matters. The source leaves the logarithm base unspecified; a fixed base changes only constants and no uniformity in the base is claimed. The selected statement’s \(P=\sum_j p_jR_j\) alone does not by itself imply the source’s partition claim \(C_i\cap C_j=\varnothing\), \(\{1,\dots,n\}=\cup_j C_j\), \(\sum_j n_j=n\); the paired main theorem supplies the well-specified true mixture \(f_j=k(\cdot|\theta_j^*)\), and the proof of Theorem th:ConsBounded explicitly uses this together with B1 support to get the partition almost surely.

      3. Asymptotics. The selected upper-bound result itself contains no \(O\), \(o\), or asymptotic equality; \(T^{(n)}= \frac{2^t\sqrt{\log n}}{K}\cdots \mathbbm 1_{\Omega_n}\) is a random eventwise bound for the fixed \(s>t\), not a claim that \(T^{(n)}\) or the posterior ratio tends to a limit. The asymptotic statements belong to Lemma lemma:Max: for each fixed \(j=1,\dots,t\), \(Y^j_{n_j}\to1\) in \(P^{(\infty)}\)-probability as \(n\to\infty\). In that limit the logarithm is \(\log n\) with the outer sample size \(n\), not \(\log n_j\), while \(n_j=n_j(n)\) is random and grows because \(p_j>0\); do not replace \(\log n\) by \(\log n_j\). Lemma denom is a threshold statement “for all \(n_j\ge N_j\)”, and \(\Omega_n\) records \(n_j\ge N_j\) and \(Y^j_{n_j}\in[1/2,1]\) for every \(j\). The source after defining \(\Omega_n\) says \(P^{(n)}(\Omega_n)\to1\) “thanks to Lemma lemma:Max and Lemma denom”; that probability assertion is not part of the displayed upper-bound conclusion and should not be promoted to a hypothesis of the algebraic bound. The source’s notation between \(P^{(n)}\) and \(P^{(\infty)}\) in that sentence is not fully stable; the surrounding probability statements are on \(P^{(\infty)}\), and the content-basis note records the probability claim separately. No uniformity over \(s\) is asserted in the selected target; later consistency proofs sum over \(s\), but that is outside this selected upper-bound statement.

      4. Potentially omitted definitions and side conditions. The paired main source defines B1 as \(g>0\) on \([a,b]\) and \(0\) elsewhere, B2 as differentiability with bounded derivative on \((a,b)\), and B3 as absolute continuity of \(Q_0\) with bounded density \(q_0\); however, the selected proof uses the explicit working conditions T1–T4, namely \(0<m\le g(x)\le M\) on \([-c,c]\), \(|g'(x)/g(x)|\le R\) on \((-c,c)\), \(q_0(y)+q_0(-y)\le U\) on \([0,2c]\), and \(q_0(\theta)\ge L\) near each \(\theta_j^*\). Use T1–T4 as stated for the target rather than replacing them by weaker or merely related support assumptions. The proof-based partition inference should be derived from complete separation, the true mixture identification \(f_j=k(\cdot|\theta_j^*)\), and B1 support; it should not be inserted as an unrelated extra hypothesis if the source setup can derive it. On \(C^{(n)}\) and hence on \(\Omega_n\), the order statistics are defined; outside those events the displayed formulae involve an indicator and should not be read as asserting meaningful order statistics when \(n_j=0\). The sets \(\tau_{s_j}(n_j)\) require \(1\le s_j\le n_j\), and \(\mathbf S_s\) is data-dependent through the random \(n_j\) even though \(s>t\) is fixed. The source leaves the log base, exact \(N_j\), exact neighborhood shape in T4, and the precise relation between \(Q_0(\mathrm d\theta)\) and \(q_0(\theta)\mathrm d\theta\) unspecified beyond B3; it also does not explicitly restate \(s\le n\), but \(\mathbf S_s\) is empty when no such composition exists. Finally, the only cited results relevant to the selected block are the supplement’s Lemma denom for the denominator lower bound and Lemma lemma:Max for the definition and convergence of \(Y^j_{n_j}\); the target’s application does not change their universal quantified content. Other external references in the supplement occur in unrelated proofs and should not be imported into this target’s hypotheses.
