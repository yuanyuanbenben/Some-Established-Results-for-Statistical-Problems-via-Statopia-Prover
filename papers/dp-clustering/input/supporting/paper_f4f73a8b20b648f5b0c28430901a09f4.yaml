      ##### Content basis
      Source extraction from D1, the supplement file `supp.tex`, “Supplementary Materials for Clustering consistency with Dirichlet process mixtures” by Ascolani, Lijoi, Rebaudo and Zanella. The named result is Lemma \ref{denom}, located in the proof of Theorem \ref{th:ConsBounded}; it supports the denominator lower-bound step in the current target. The same source passage cites Lemma \ref{lemma:Max} for the definition of \(Y^j_{n_j}\), so that result is organized separately because \(Y^j_{n_j}\) appears both in Lemma \ref{denom} and in \(\Omega_n\). The displayed inequality labelled \eqref{upper_bound_ratios} in the same source proof is also organized separately because it is exactly the \(T^{(n)}\)-upper-bound conclusion of the current target. The source also records \(P^{(n)}(\Omega_n)\to1\) “thanks to Lemma \ref{lemma:Max} and Lemma \ref{denom}”; that probability statement is not part of the displayed upper-bound conclusion and is not added as a separate result here. Proof-dependency results such as Lemma \ref{denom1} are not copied because they are used only in the proof of Lemma \ref{denom}. The source prints Lemma \ref{denom} with \(K^{1/t}\), while the final displayed line of its proof prints \(K^{1/(2t)}\); the lemma statement is retained as printed. The lemma display uses \(q_0(\theta_j)\,\mathrm d\theta_j\), while the subsequent upper-bound display uses \(Q_0(\d\theta_h)\); both notations are retained as they occur in the source.

      ##### Lemma \ref{denom}
      ###### Definitions and notation
      In the proof of Theorem \ref{th:ConsBounded}, through a linear rescaling one may assume \([a,b]=[-c,c]\). The data-generating density is
      \[
      f(x)=\sum_{j=1}^t p_j k(x\mid \theta_j^*),\qquad t\in\mathbb N,\quad p_j\in(0,1),\quad \sum_{j=1}^t p_j=1,
      \]
      for \(P=\sum_{j=1}^t p_jR_j\), and \(X_{1:\infty}\sim P^{(\infty)}\). The kernel is of location type, \(k(x\mid\theta)=g(x-\theta)\). The baseline is written \(Q_0(\mathrm{d}\theta)\) in the surrounding marginal integrals and as \(q_0(\theta_j)\,\mathrm{d}\theta_j\) in the displayed lemma.

      For \(j=1,\dots,t\), define
      \[
      C_j=\left\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\right\},
      \qquad n_j=|C_j|.
      \]
      Under complete separation, the source states
      \[
      C_i\cap C_j=\varnothing\quad(i\ne j),
      \qquad
      \{1,\dots,n\}=\bigcup_{j=1}^t C_j,
      \qquad
      \sum_{j=1}^t n_j=n.
      \]
      Also
      \[
      C^{(n)}=\{n_j>0\text{ for every }j\}.
      \]
      For a nonempty block \(C_j\), the marginal likelihood is
      \[
      m(X_{C_j})
      =
      \int_{\mathbb R}\prod_{i\in C_j}k(X_i\mid\theta_j)\,Q_0(\mathrm{d}\theta_j)
      =
      \int_{\mathbb R}\prod_{i\in C_j}g(X_i-\theta_j)\,Q_0(\mathrm{d}\theta_j).
      \]
      \(X^j_{(r)}\) denotes the \(r\)-th order statistic of \(X_{C_j}\). The quantity \(Y^j_{n_j}\) appearing in the lemma is
      \[
      Y^j_{n_j}
      :=
      \min\left[1,\ n_j(\log(n))^{\frac1{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}\right],
      \]
      the definition recalled from Lemma \ref{lemma:Max}.

      ###### Assumptions
      The following are the rescaled conditions in force in the source proof of Theorem \ref{th:ConsBounded}.

      \begin{enumerate}
      \item[(T1)] There exist \(m,M\) such that
      \[
      0<m\le g(x)\le M<\infty
      \qquad\text{for every }x\in[-c,c].
      \]

      \item[(T2)] \(g\) is differentiable on \((-c,c)\) and there exists \(R\) such that
      \[
      \left|\frac{g'(x)}{g(x)}\right|\le R<\infty
      \qquad\text{for every }x\in(-c,c).
      \]

      \item[(T3)] There exists \(U>0\) such that
      \[
      h(y)=q_0(y)+q_0(-y)\le U
      \qquad\text{for every }y\in[0,2c].
      \]

      \item[(T4)] There exists \(L>0\) such that
      \[
      q_0(\theta)\ge L
      \]
      for every \(\theta\) in a neighborhood of \(\theta_j^*\), for every \(j=1,\dots,t\).
      \end{enumerate}

      The true parameter vector \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\) is completely separated:
      \[
      |\theta_j^*-\theta_k^*|>b-a\qquad(j\ne k),
      \]
      and after the source rescaling \(|\theta_j^*-\theta_k^*|>2c\). The sets \(C_j\) and integers \(n_j=|C_j|\) are those defined above. The lemma is stated for every \(j=1,\dots,t\) and for all \(n_j\ge N_j\).

      ###### Statement
      For every \(j = 1, \dots, t\) there exists \(K>0\) and \(N_j \in \mathbb{N}\) such that for all \(n_j\geq N_j\) it holds
      \[
      \int_\R \prod_{i \in C_j}\frac{g(X_i - \theta_j)}{g(X_i-\theta_j^*)}q_0(\theta_j) \, \mathrm{d}\theta_j 
      \geq \frac{K^{\frac{1}{t}} Y^j_{n_j} }{n_j(\log(n))^{\frac{1}{2t}}},
      \]
      with \(Y^j_{n_j}\) defined in Lemma \ref{lemma:Max}.

      ##### Lemma \ref{lemma:Max}
      ###### Definitions and notation
      The notation is that of the proof of Theorem \ref{th:ConsBounded}: \(C_j\) is the local block
      \[
      C_j=\left\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\right\},
      \qquad n_j=|C_j|,
      \]
      and \(X^j_{(r)}\) denotes the \(r\)-th order statistic of \(X_{C_j}\). The variable \(Y^j_{n_j}\) is
      \[
      Y^j_{n_j}
      :=
      \min\left[1,\ n_j(\log(n))^{\frac{1}{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}\right].
      \]

      ###### Assumptions
      The same section-level rescaled setup applies: \(t\in\mathbb N\), \(P=\sum_{j=1}^t p_jR_j\) with \(p_j\in(0,1)\), \(\sum_j p_j=1\), \(X_{1:\infty}\sim P^{(\infty)}\), \(k(x\mid\theta)=g(x-\theta)\), and \(Q_0(\mathrm d\theta)\) is written in density form as \(q_0(\theta)\,\mathrm d\theta\) where the source uses \(q_0\). The true vector \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\) is completely separated, \(|\theta_j^*-\theta_k^*|>b-a\) for \(j\ne k\), and after rescaling \([a,b]=[-c,c]\). Conditions T1–T4 hold:
      \[
      0<m\le g(x)\le M<\infty\quad(x\in[-c,c]),
      \]
      \[
      \left|\frac{g'(x)}{g(x)}\right|\le R<\infty\quad(x\in(-c,c)),
      \]
      \[
      h(y)=q_0(y)+q_0(-y)\le U\quad(y\in[0,2c]),
      \]
      and
      \[
      q_0(\theta)\ge L
      \]
      for every \(\theta\) in a neighborhood of \(\theta_j^*\), for every \(j=1,\dots,t\).

      ###### Statement
      For every \(j = 1, \dots , t\) it holds
      \[
      Y^j_{n_j} := \min \left[ 1, n_j(\log(n))^{\frac{1}{2t}}\{c+\theta_j^*-X^j_{(n_j)}\} \right] \to 1
      \]
      in \(P^{(\infty)}\)-probability as \(n \to \infty\).

      ##### Upper bound \eqref{upper_bound_ratios}
      ###### Definitions and notation
      The source’s equation \eqref{object} is the sum
      \[
      \sum_{\textbf{s}}\prod_{j = 1}^t\sum_{A_j \in \tau_{s_j}(n_j)}
      \frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}
      \frac{
      \prod_{k = 1}^{s_j}\int_{\mathbb{R}}\prod_{i \in A^j_k}\frac{g(X_i - \theta_k)}{p_jg(X_i-\theta_j^*)} \, Q_0(\d \theta_k)}
      {\int_{\mathbb{R}}\prod_{i \in C_j}\frac{g(X_i - \theta_j)}{p_jg(X_i-\theta_j^*)} \, Q_0(\d \theta_j)}
      \mathbbm{1}_{C^{(n)}},
      \qquad s>t.
      \]
      Here the sum is over
      \[
      \textbf{S}
      =
      \left\{(s_1, \dots, s_t) \, : \, 1 \leq s_j \leq n_j, \, \forall j, \text{ and } \sum_{j = 1}^ts_j = s \right\}.
      \]
      For \(A_j\in\tau_{s_j}(n_j)\), the source writes
      \[
      A_j=(A^j_1,\dots,A^j_{s_j}),
      \qquad
      a^j_k=|A^j_k|.
      \]
      The marginal integrals are
      \[
      m(X_{C_j})
      =
      \int_{\mathbb{R}}\prod_{i \in C_j}k(X_i \mid \theta_j) \, Q_0(\d \theta_j)
      =
      \int_{\mathbb{R}}\prod_{i \in C_j}g(X_i - \theta_j) \, Q_0(\d \theta_j),
      \]
      and, for \(h=1,\dots,s_j\),
      \[
      m(X_{A^j_h})
      =
      \int_{\mathbb{R}}\prod_{i \in A^j_h}k(X_i \mid \theta_h) \, Q_0(\d \theta_h)
      =
      \int_{\mathbb{R}}\prod_{i \in A^j_h}g(X_i - \theta_h) \, Q_0(\d \theta_h).
      \]
      The event is
      \[
      \Omega_n
      =
      \left\{\text{for every }j=1,\dots,t:\ n_j\ge N_j,\ Y^j_{n_j}\in[1/2,1]\right\},
      \]
      with \(N_j\) and \(K>0\) as furnished by Lemma \ref{denom}, and with \(Y^j_{n_j}\) as in Lemma \ref{lemma:Max}.

      ###### Assumptions
      The same rescaled setup and section-level conditions apply: \(t\in\mathbb N\), \(P=\sum_{j=1}^t p_jR_j\), \(p_j\in(0,1)\), \(\sum_j p_j=1\), \(X_{1:\infty}\sim P^{(\infty)}\), \(k(x\mid\theta)=g(x-\theta)\), \(Q_0(\d\theta)\) with density notation \(q_0\) in the lemma display, and \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\) completely separated with \(|\theta_j^*-\theta_k^*|>b-a\) for \(j\ne k\), after rescaling \([a,b]=[-c,c]\). Conditions T1–T4 hold:
      \[
      0<m\le g(x)\le M<\infty\quad(x\in[-c,c]),
      \]
      \[
      \left|\frac{g'(x)}{g(x)}\right|\le R<\infty\quad(x\in(-c,c)),
      \]
      \[
      h(y)=q_0(y)+q_0(-y)\le U\quad(y\in[0,2c]),
      \]
      and
      \[
      q_0(\theta)\ge L
      \]
      for every \(\theta\) in a neighborhood of \(\theta_j^*\), for every \(j=1,\dots,t\). The sets \(C_j\), the counts \(n_j=|C_j|\), the event \(C^{(n)}\), the partitions \(\tau_{s_j}(n_j)\) and the index \(\mathbf s\in\textbf S\) are as defined above. The result is stated for fixed \(s>t\). \(K>0\) and the thresholds \(N_j\in\mathbb N\) are those from Lemma \ref{denom}, and \(\Omega_n\) is the event displayed above.

      ###### Statement
      Thus, an upper bound of \eqref{object} with \(\Omega_n\) in place of \(C^{(n)}\) is given by
      \[
      T^{(n)} := \frac{2^t\sqrt{\log(n)}}{K}\sum_{\textbf{s}}\prod_{j = 1}^t\sum_{A_j \in \tau_{s_j}(n_j)}n_j\frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}\prod_{h = 1}^{s_j}\int_{\mathbb{R}}\prod_{i \in A^j_h}\frac{g(X_i - \theta_h)}{g(X_i-\theta_j^*)} \, Q_0(\d \theta_h)\mathbbm{1}_{\Omega_n},
      \]
      for \(s > t\).
