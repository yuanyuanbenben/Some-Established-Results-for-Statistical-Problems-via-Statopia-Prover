    latex_statement: |-
      \(X_{1:n}=(X_1,\dots,X_n)\) denotes the first \(n\) coordinates of \(X_{1:\infty}\); \(P^{(\infty)}\) is the product probability measure induced on \(\mathbb X^\infty\) by the data-generating process; \(\mathbbm{1}_A\) denotes the indicator function of a set \(A\); \(W_n\to0\) in \(P^{(\infty)}\)-probability means that for every \(\epsilon>0\), \(P^{(\infty)}(|W_n|>\epsilon)\to0\).

      <!-- formalization-clarifications:v1:9e7e1cbba188483daf845a4e0b92c2ba87d5db4970b62c61a4831a8400eac739 -->
      Formalization clarifications from source and proof:
      1. Ownership and quantifier order. These notes concern the target Lemma ConvProbBound, stated and proved under “Proof of Theorem \ref{th:ConsBounded}” in supp.tex; the selected target theorem has no references. The uniform theorem is not restricted by the later application to sums of posterior ratios. The source’s intended order is: fix the ambient probability space and \(P^{(\infty)}\), take sequences \(\Omega_n\) and \(Z_n\) on that space, assume \(P^{(\infty)}(\Omega_n)\to1\) and \(Z_n\mathbbm{1}_{\Omega_n}\to0\) in \(P^{(\infty)}\)-probability, and conclude \(Z_n\to0\) in \(P^{(\infty)}\)-probability. The probability convergence hypotheses are themselves quantified as “for every \(\epsilon>0\), \(P^{(\infty)}(\cdots>\epsilon)\to0\)” (selected “Definitions and notation”: “\(W_n\to0\) in \(P^{(\infty)}\)-probability means that for every \(\epsilon>0\), \(P^{(\infty)}(|W_n|>\epsilon)\to0\)”). Thus \(\epsilon\) is fixed before taking the \(n\to\infty\) limit; there is no uniformity in \(\epsilon\), no rate, and no constant depending on dimension/distribution/vectors. The source gives no dimension parameter and no extra constants for this lemma. Any threshold \(N\) arising from the two limits may depend on the fixed \(\epsilon\) and the chosen tolerance, and on the sequences/measure, but not on \(n\). The lemma is universal in the sequences satisfying the hypotheses; the later use with \(Z_n\) as a nonnegative posterior-ratio sum does not add a nonnegativity condition to the lemma.

      2. Norms, objects, and ambient space. The only “norm” in the target is scalar absolute value \(|\cdot|\) on real-valued random variables; the source does not mention Euclidean \(\ell_2\), sup, operator, Frobenius, or normalized/unscaled norms. The notation \(Z_n\mathbbm{1}_{\Omega_n}\) is a pointwise product by the \(0\)-\(1\) indicator, not a conditional expectation or a conditional probability, and \(\Omega_n^c\) is the complement in the ambient probability space. The target uses \(P^{(\infty)}\) on the infinite product space, not the finite product measure \(P^{(n)}\); the paired main source defines \(X_{1:n}\) as the first \(n\) coordinates of \(X_{1:\infty}\), with \(P^{(n)}\) and \(P^{(\infty)}\) the product measures on \(\mathbb X^n\) and \(\mathbb X^\infty\) (“We will let \(P^{(n)}\) and \(P^{(\infty)}\) be the product probability measures induced on \(\mathbb X^n\) and \(\mathbb X^\infty\)”). Replacements by posterior probabilities, conditional probabilities, or \(P^{(n)}\) are not supported. The source does not explicitly specify the codomain of \(Z_n\) or the structure/dimension of \(\mathbb X\); the absolute value and inequalities force the natural interpretation of \(Z_n\) as real-valued (or at least scalar-valued with a real norm), but any other codomain/norm would be an extra assumption.

      3. Asymptotics and probability variants. The limiting variable is \(n\to\infty\); no \(O\), \(o\), almost-sure, \(L^1\), or convergence-in-distribution statement occurs in the target. The assumptions are ordinary probability limits: \(P^{(\infty)}(\Omega_n)\to1\) and, for every fixed \(\epsilon>0\), \(P^{(\infty)}(|Z_n|\mathbbm{1}_{\Omega_n}>\epsilon)\to0\). The proof uses the elementary bound quoted as
      \(P^{(\infty)}(|Z_n|>\epsilon)\le P^{(\infty)}(\{|Z_n|>\epsilon\}\cap\Omega_n)+P^{(\infty)}(\Omega_n^c)\)
      and then compares the first term with \(P^{(\infty)}(|Z_n|\mathbbm{1}_{\Omega_n}>\epsilon)\); this is proof-based and uses only probability monotonicity/subadditivity, not independence. There is no uniform range in \(\epsilon\) or \(n\), and no rate is supplied. One source-fidelity warning: the selected target statement/definitions and selected proof use \(|\cdot|\), whereas the original supp.tex proof excerpt for Lemma ConvProbBound writes \(Z_n>\epsilon\) in a non-absolute form. The absolute-value formulation is the one explicitly in the selected definitions; the un-absolute line should not be promoted to a claim that \(Z_n\ge0\) or to an equivalent general statement.

      4. Omitted definitions and side conditions. The source phrase “\(\Omega_n\) … depending on \(X_{1:n}\)” is not formalized as an exact cylinder condition; the proof only uses that each \(\Omega_n\) is an event with \(P^{(\infty)}(\Omega_n)\to1\) and uses \(\Omega_n^c\). For Lean, measurability of each \(\Omega_n\) and of each \(Z_n\mathbbm{1}_{\Omega_n}\) is needed, although the source does not spell out the \(\sigma\)-algebra. No nesting/monotonicity of \(\Omega_n\), no independence from \(Z_n\), no positivity of \(P^{(\infty)}(\Omega_n)\), and no integrability/expectation assumption is used. \(P^{(\infty)}(\Omega_n)\to1\) implies \(P^{(\infty)}(\Omega_n^c)\to0\) because \(P^{(\infty)}\) is a probability measure; this is a proof-level consequence, not an extra hypothesis. The source does not specify the starting index of \(n\); only the limit at infinity matters. Finally, the target lemma cites no external result; external references elsewhere in supp.tex, such as Cai2020 or Ghosal–van der Vaart, belong to other arguments and should not be imported as assumptions or conclusions for Lemma ConvProbBound.
      <!-- /formalization-clarifications -->

      Let \(\Omega_n\) be a sequence of sets depending on \(X_{1:n}\), and let \(Z_n\) be random variables on the same probability space such that \(P^{(\infty)}(\Omega_n)\to1\) and \(Z_n\mathbbm{1}_{\Omega_n}\to0\) in \(P^{(\infty)}\)-probability as \(n\to\infty\). Then \(Z_n\to0\) in \(P^{(\infty)}\)-probability as \(n\to\infty\).
    assumptions: []
    proof_body: |-
      Let \(\epsilon>0\). By assumption \(Z_n\mathbbm{1}_{\Omega_n}\to0\) in \(P^{(\infty)}\)-probability, so
      \[
      P^{(\infty)}\bigl(|Z_n|\mathbbm{1}_{\Omega_n}>\epsilon\bigr)\to0
      \]
      as \(n\to\infty\). Therefore,
      \[
      \begin{aligned}
      P^{(\infty)}(|Z_n|>\epsilon)
      &\le P^{(\infty)}\bigl(\{|Z_n|>\epsilon\}\cap \Omega_n\bigr)+P^{(\infty)}(\Omega_n^c)\\
      &\le P^{(\infty)}\bigl(|Z_n|\mathbbm{1}_{\Omega_n}>\epsilon\bigr)+P^{(\infty)}(\Omega_n^c)\to0,
      \end{aligned}
      \]
      because \(P^{(\infty)}(\Omega_n)\to1\). Hence \(Z_n\to0\) in \(P^{(\infty)}\)-probability as \(n\to\infty\).
