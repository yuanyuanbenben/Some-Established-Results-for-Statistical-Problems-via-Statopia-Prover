      ##### Lemma 4.1 in \cite{Cai2020}
      ###### Definitions and notation
      The spaces \(\mathbb X\) and \(\Theta\) are Polish spaces, endowed with their Borel \(\sigma\)-algebras. For a topological space \((\cdot)\), \(\mathscr P(\cdot)\) denotes the set of Borel probability measures on \((\cdot)\), equipped with the weak topology. A Polish space is understood in the standard sense of a separable completely metrizable topological space.

      Weak convergence notation: for \(f_i,f\in \mathscr P(\cdot)\),
      \[
      f_i\Rightarrow f
      \]
      means
      \[
      \lim_{i\to\infty} d(f_i,f)=0,
      \]
      where \(d\) is the Lévy–Prokhorov metric.

      **Definition A.1** (Lévy–Prokhorov metric). For \(f,g\in\mathscr P(\mathbb X)\),
      \[
      d(f,g)=\inf\{\epsilon>0:\ f(A)<g(A^\epsilon)+\epsilon,\quad g(A)<f(A^\epsilon)+\epsilon\},
      \]
      where
      \[
      A^\epsilon:=\{y:\rho(x,y)<\epsilon \text{ for some }x\in A\}.
      \]

      In the printed lemma, \(\operatorname{supp}\phi\) denotes the support of \(\phi\), and \(|\operatorname{supp}\phi|\) denotes its cardinality. Support and cardinality are used with their standard meanings.

      ###### Assumptions
      - \(\phi\) and \((\phi_i)_{i\in\mathbb N}\) are Borel probability measures on a Polish space.
      - \(\phi_i\Rightarrow \phi\) weakly; equivalently, in the source notation, \(\lim_{i\to\infty}d(\phi_i,\phi)=0\).
      - There is \(k\in\mathbb N\) such that
        \[
        \sup_i |\operatorname{supp}\phi_i|\le k.
        \]

      No mixture-specific hypotheses such as continuity, mixture-identifiability, or degenerate limits are part of the printed statement of Lemma 4.1.

      ###### Statement
      **Lemma 4.1.** *Suppose \(\phi,(\phi_i)_{i\in\mathbb N}\) are Borel probability measures on a Polish space such that \(\phi_i\Rightarrow\phi\) and \(\sup_i |\operatorname{supp}\phi_i|\le k\in\mathbb N\). Then \(|\operatorname{supp}\phi|\le k\).*

