      ##### Theorem 2.1 in Cai, Campbell, and Broderick (2021)

      ###### Definitions and notation
      Let \(\mathbb X\) and \(\Theta\) be Polish spaces, with Borel \(\sigma\)-algebras. Let \(\mathscr P(\cdot)\) denote probability measures with the weak topology metrized by the Lévy–Prokhorov distance \(d\). Write \(f_i\Rightarrow f\) when \(d(f_i,f)\to0\), and write \(f_i\leftrightarrow f_i'\) when \(d(f_i,f_i')\to0\) (matching weak limits).

      Let \(\Psi=\{\psi_\theta:\theta\in\Theta\}\) be a family of component distributions dominated by a \(\sigma\)-finite measure \(\mu\), so that \(\psi_\theta\ll\mu\) for all \(\theta\in\Theta\), and \(\psi_\theta(A)\) is measurable in \(\theta\) for measurable \(A\subseteq\mathbb X\). Define
      \[
      F(g)=\int_\Theta \psi_\theta\, dg(\theta)
      \]
      for mixing measures \(g\in\mathscr P(\Theta)\). Let \(\mathbb G\) be the set of atomic probability measures on \(\Theta\) with finitely many atoms, and let \(\mathbb F\) be the set of finite mixtures of \(\Psi\). A finite mixture has the form
      \[
      f=F(g)=\sum_{j=1}^k p_j\psi_{\theta_j},
      \]
      where \(g=\sum_{j=1}^k p_j\delta_{\theta_j}\), \(p_j\in[0,1]\), and \(\sum_j p_j=1\).

      In the Bayesian finite mixture model, \(g\sim\Pi\) for a prior \(\Pi\) on \(\mathbb G\), and \(f=F(g)\) is the likelihood distribution. The posterior on mixing measures is, for measurable \(A\subseteq\mathbb G\),
      \[
      \Pi(A\mid X_{1:N})
      =
      \frac{\int_A \prod_{n=1}^N \frac{df}{d\mu}(X_n)\, d\Pi(g)}
      {\int_{\mathbb G} \prod_{n=1}^N \frac{df}{d\mu}(X_n)\, d\Pi(g)},
      \]
