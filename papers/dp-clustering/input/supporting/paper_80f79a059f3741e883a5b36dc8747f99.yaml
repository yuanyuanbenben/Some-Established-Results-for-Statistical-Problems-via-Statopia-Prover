      ##### Lemma \ref{lemma_weak_convergence}

      ###### Definitions and notation
      Let
      \[
      \Psi=\left\{k(\cdot\mid\theta):\theta\in\Theta\subseteq\mathbb R^p\right\}
      \]
      be the family of kernels, dominated by \(\mu\), where \(\mu\) is either Lebesgue or counting measure, and with common domain \(\mathbb X\subseteq\mathbb R^q\). For \(s\ge1\), let \(\mathbb G_s\) be the set of mixtures of exactly \(s\) elements of \(\Psi\), that is,
      \[
      f\in\mathbb G_s
      \quad\Longleftrightarrow\quad
      f=\sum_{j=1}^s q_jk(\cdot\mid\theta_j),
      \]
      with \(q_j>0\) for every \(j\), \(\sum_{j=1}^s q_j=1\), and \(\theta_i\ne\theta_h\) for every \(i\ne h\).

      Let \(\mathcal P(G)\) denote the set of probability measures on a generic space \(G\). As in the source, we write \(f\in\mathcal P(G)\) when \(f\) is the density of a probability measure \(P\in\mathcal P(G)\); thus \(P\in\mathbb G_t\) means that \(P\) has a density \(f\in\mathbb G_t\). For \(P\in\mathbb G_t\), write its weights as \(\{p_j\}_{j=1}^t\) and its parameters as \(\{\theta_j^*\}_{j=1}^t\).

      For \(\epsilon>0\), the Kullback–Leibler neighborhoods of \(P\) are defined in the source by
      \[
      KL_\epsilon(P)
      :=
      \left\{
      h\in\mathcal P(\mathbb X):
      \int
      \log\left\{
      \frac{\sum_{j=1}^{t}p_jk(x\mid\theta_j^*)}{h(x)}
      \right\}
      P(\mathrm dx)
      <\epsilon
      \right\}.
      \]
      In assumption \(H4\) the source writes \(K_\epsilon(P)\) for these Kullback–Leibler neighborhoods.

      The notation \(\operatorname{supp}Q_0\) denotes the support of the baseline probability measure \(Q_0\) on \(\mathbb X\). A weak neighborhood of \(P\) means a neighborhood of \(P\) in the weak topology on the space of probability measures on \(\mathbb X\), i.e. the topology of weak convergence.

      The source refers to the prior distribution in equation \eqref{eq:MixDPM}. In the supplied model context, this is the Dirichlet process mixture model
      \[
      X_i\mid\theta_i\simind k(\cdot\mid\theta_i),
      \qquad
      \theta_i\mid\tilde P\simiid\tilde P,
      \qquad
      \tilde P\mid\alpha\sim\operatorname{DP}(\alpha,Q_0),
      \qquad
      \alpha\sim\pi,
      \]
      where \(k\) is the kernel, \(Q_0\) is the baseline distribution, and \(\pi\) is a prior on the concentration parameter \(\alpha>0\). The random density \(h\) in \(H4\) follows the prior induced by this Dirichlet process mixture. In this model, \(K_n\) is the number of clusters, equivalently the number of distinct latent parameters, in the first \(n\) observations, and \(\operatorname{pr}(K_n<t\mid X_{1:n})\) is the corresponding posterior probability. The product law of the iid data generated by \(P\) is denoted \(P^{(\infty)}\) on \(\mathbb X^\infty\), so that convergence “in \(P^{(\infty)}\)-probability” means convergence in probability when \(X_{1:\infty}\sim P^{(\infty)}\).

      ###### Assumptions
      The lemma assumes \(H4\):

      \(H4.\) For every \(P\in\mathbb G_t\), \(t\ge1\), with parameters \(\theta_1^*,\dots,\theta_t^*\) belonging to the support of \(Q_0\), one has
      \[
      \operatorname{pr}\bigl(h\in KL_\epsilon(P)\bigr)>0
      \]
      for every \(\epsilon>0\), where \(h\) follows the prior distribution in \eqref{eq:MixDPM}.

      The lemma does not invoke \(H1\)–\(H3\) in its displayed statement.

      ###### Statement
      Let assumption \(H4\) be satisfied and let \(P\in\mathbb G_t\) with parameters \(\theta_1^*,\dots,\theta_t^*\) belonging to the support of \(Q_0\). Assume there exists a weak neighborhood \(\mathcal U\) of \(P\) such that
      \[
      \mathcal U\cap\mathbb G_s=\varnothing
      \qquad\text{for every }s<t.
      \]
      Then
      \[
      \operatorname{pr}\bigl(K_n<t\mid X_{1:n}\bigr)\longrightarrow0,
      \]
      in \(P^{(\infty)}\)-probability as \(n\to\infty\).

