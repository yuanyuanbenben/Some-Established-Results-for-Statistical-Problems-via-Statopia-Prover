      ##### Content basis
      Source extraction from D1, *Supplementary Materials for Clustering consistency with Dirichlet process mixtures*, Section “Proof of Proposition \ref{undersmoothing},” Lemma \ref{th:WeakConsDens} and its proof. The displayed source statement is: “Suppose the kernel \(k(x \mid \theta)\) satisfies assumptions \(B1-B3\). Then \(H1-H4\) are fulfilled.” The proof attributes \(H3\) to \(B1\) and the data-generating setup, \(H1\) to \(B2\) and the interval support of \(k(x\mid\theta)=g(x-\theta)\), \(H2\) to \(\theta\) being a location parameter, and \(H4\) to a construction using \(T1\)–\(T4\). The exact statements of \(B1\)–\(B3\) are not printed in D1; D1 records that \(B1\)–\(B3\) can be rewritten as \(T1\)–\(T4\) in the proof of Theorem \ref{th:ConsBounded}, and those rewritten conditions are supplied below from the reading context. No additional independent source result is organized under this item; the later underclustering convergence is the content of the separately cited Lemma \ref{lemma_weak_convergence} and auxiliary lemmas.

      ##### Lemma \ref{th:WeakConsDens}
      ###### Definitions and notation
      Let \(\mathbb X\subseteq\mathbb R^q\) and \(\Theta\subseteq\mathbb R^p\). The family of kernels is
      \[
      \Psi=\{k(\cdot\mid\theta):\theta\in\Theta\},
      \]
      dominated by \(\mu\), where \(\mu\) is either Lebesgue or counting measure, with common domain \(\mathbb X\). Let \(\bar\Theta\) be the closure of \(\Theta\), and define the boundary set of singular kernels
      \[
      \mathbb B:=\left\{\bar\theta\in\bar\Theta\setminus\Theta:
      \lim_{\theta\to\bar\theta}\left\{\sup_x k(x\mid\theta)\right\}=\infty\right\}.
      \]
      Let \(\mathbb G_s\) be the set of mixtures of exactly \(s\) elements of \(\Psi\):
      \[
      f\in\mathbb G_s
      \quad\Longleftrightarrow\quad
      f=\sum_{j=1}^s q_j k(\cdot\mid\theta_j),
      \]
      with \(q_j>0\) for every \(j\), \(\sum_{j=1}^s q_j=1\), and \(\theta_i\ne\theta_h\) for every \(i\ne h\). Let \(\mathcal P(G)\) denote the set of probability measures on a generic space \(G\); write \(f\in\mathcal P(G)\) when \(f\) is the density of a probability measure \(P\in\mathcal P(G)\). For \(P\in\mathbb G_t\), with weights \(\{p_j\}_{j=1}^t\) and parameters \(\{\theta_j^*\}_{j=1}^t\), the Kullback–Leibler neighborhoods of \(P\) are
      \[
      KL_\epsilon(P)
      :=
      \left\{
      h\in\mathcal P(\mathbb X):
      \int
      \log\left\{
      \frac{\sum_{j=1}^{t} p_j k(x\mid\theta_j^*)}{h(x)}
      \right\}
      P(\mathrm dx)
      <\epsilon
      \right\},
      \qquad \epsilon>0.
      \]
      In the \(B1\)–\(B3\) branch the kernel is a location kernel,
      \[
      k(x\mid\theta)=g(x-\theta),
      \]
      with baseline \(Q_0(\mathrm d\theta)=q_0(\theta)\,\mathrm d\theta\) on the parameter space, and
      \[
      h(y)=q_0(y)+q_0(-y).
      \]
      After the linear rescaling used in the source, the support interval is \([a,b]=[-c,c]\).

      ###### Assumptions
      The lemma assumes that the kernel \(k(x\mid\theta)\) satisfies assumptions \(B1\)–\(B3\). The obtained supplement D1 does not print the statements of \(B1\)–\(B3\). It states that, through the linear rescaling \([a,b]=[-c,c]\), the assumptions on \(g\) and \(Q_0\) can be rewritten as \(T1\)–\(T4\). The rewritten conditions available are:
      \[
      \begin{array}{ll}
      T1. & \exists\,m,M \text{ such that } 0<m\le g(x)\le M<\infty
      \text{ for every }x\in[-c,c];\\[2mm]
      T2. & g\text{ is differentiable on }(-c,c)\text{ and }\exists\,R
      \text{ such that }\left|\dfrac{g'(x)}{g(x)}\right|\le R<\infty
      \text{ for every }x\in(-c,c);\\[2mm]
      T3. & \exists\,U>0\text{ such that }
      h(y)=q_0(y)+q_0(-y)\le U
      \text{ for every }y\in[0,2c];\\[2mm]
      T4. & \exists\,L>0\text{ such that }q_0(\theta)\ge L
      \text{ for every }\theta\text{ in a neighborhood of }\theta_j^*,
      \text{ for every }j.
      \end{array}
      \]
      The proof of \(H1\) also uses the interval support of \(k(x\mid\theta)=g(x-\theta)\): for \(x>\theta+b\) or \(x<\theta+a\), the kernel is \(0\), and \(g\) is continuous on \((a,b)\) by \(B2\). The exact original wording of \(B1\)–\(B3\) remains unavailable in D1.

      ###### Statement
      Suppose the kernel \(k(x\mid\theta)\) satisfies assumptions \(B1\)–\(B3\). Then \(H1\)–\(H4\) are fulfilled, namely:

      \(H1.\) For every \(\bar\theta\in\Theta\setminus\mathbb B\), for \(\mu\)-almost every \(x\in\mathbb X\), there exists \(A:=A(\bar\theta,x)\subset\Theta\setminus\mathbb B\), a neighborhood of \(\bar\theta\), such that the mapping
      \[
      \theta\in A\longmapsto k(x\mid\theta)
      \]
      is continuous. Moreover, \(\mathbb B\) is closed.

      \(H2.\) Let \(\{\theta_i\}_{i=1}^\infty\subset\Theta\). If \(\|\theta_i\|\to\infty\) as \(i\to\infty\), then for every compact set \(K\subset\mathbb X\),
      \[
      \int_K k(x\mid\theta_i)\,\mu(\mathrm dx)\to0
      \qquad\text{as }i\to\infty.
      \]
      If \(\theta_i\to\bar\theta\in\mathbb B\), then there exists \(x^*\in\mathbb X\) such that
      \[
      k(\cdot\mid\theta_i)\to\delta_{x^*}(\cdot)
      \]
      weakly as \(i\to\infty\).

      \(H3.\) If \(f\in\mathbb G_t\), then there exist no \(f'\in\mathbb G_s\), with \(s<t\), such that
      \[
      f(x)=f'(x)\qquad\text{for }\mu\text{-almost every }x\in\mathbb X.
      \]

      \(H4.\) For every \(P\in\mathbb G_t\), \(t\ge1\), with \(\theta_1^*,\dots,\theta_t^*\) belonging to the support of \(Q_0\), one has
      \[
      \operatorname{pr}\bigl(h\in KL_\epsilon(P)\bigr)>0
      \qquad\text{for every }\epsilon>0,
      \]
      where \(h\) follows the prior distribution in \(\eqref{eq:MixDPM}\). In the shared model this is the Dirichlet process mixture prior:
      \[
      h(x)=\int k(x\mid\theta)\,\tilde P(\mathrm d\theta),
      \qquad
      \tilde P\mid\alpha\sim\mathrm{DP}(\alpha,Q_0),
      \qquad
      \alpha\sim\pi.
      \]

