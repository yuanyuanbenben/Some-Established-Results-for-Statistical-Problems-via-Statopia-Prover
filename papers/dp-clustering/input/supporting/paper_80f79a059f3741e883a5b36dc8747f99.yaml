      ##### Theorem 6.16 (Schwartz theorem, Ghosal–van der Vaart 2017)
      ###### Definitions and notation
      Let \((\mathbb X,d)\) be a metric space with Borel \(\sigma\)-field, and let \(\mu\) be a dominating measure on \(\mathbb X\). Let \(P\) be a probability measure on \(\mathbb X\) with density \(p_0=dP/d\mu\). Let \(\Pi\) be a prior distribution on probability densities on \(\mathbb X\), and let \(X_1,\dots,X_n\) be i.i.d. observations. The posterior distribution is
      \[
      \Pi(A\mid X_{1:n})
      =
      \frac{\int_A \prod_{i=1}^n h(X_i)\,d\Pi(h)}
      {\int \prod_{i=1}^n h(X_i)\,d\Pi(h)},
      \]
      whenever the denominator is positive.

      The weak topology on probability measures is the topology of weak convergence: a sequence \(Q_n\) converges weakly to \(Q\) if
      \[
      \int f\,dQ_n\to \int f\,dQ
      \]
      for every bounded continuous function \(f\). A weak neighborhood of \(P\) is a set containing a set of the form
      \[
      \left\{Q:\ \left|\int f_j\,dQ-\int f_j\,dP\right|<\varepsilon,\ j=1,\dots,k\right\}
      \]
      for some \(k\ge1\), bounded continuous functions \(f_1,\dots,f_k\), and \(\varepsilon>0\).

      The Kullback–Leibler divergence is
      \[
      K(P,Q)=\int p_0\log\frac{p_0}{q}\,d\mu
      \]
      when \(Q\) has density \(q=dQ/d\mu\) and the integral is defined, and \(K(P,Q)=\infty\) otherwise. For \(\varepsilon>0\), the Kullback–Leibler neighborhood of \(P\) is
      \[
      K_\varepsilon(P)=\{Q:\ K(P,Q)<\varepsilon\}.
      \]
      The prior \(\Pi\) has Kullback–Leibler support at \(P\) if
      \[
      \Pi\bigl(K_\varepsilon(P)\bigr)>0
      \]
      for every \(\varepsilon>0\).

      For a weak neighborhood \(U\) of \(P\), a sequence of tests is a sequence of measurable functions \(\varphi_n:\mathbb X^n\to[0,1]\). Such tests are exponentially consistent for \(U^c\) against \(P\) if there exist constants \(C>0\) and \(c>0\) such that, for all sufficiently large \(n\),
      \[
      \mathbb E_{P}^{\otimes n}\varphi_n
      \le C e^{-cn},
      \qquad
      \sup_{Q\in U^c}\mathbb E_{Q}^{\otimes n}(1-\varphi_n)
      \le C e^{-cn}.
      \]

      The posterior is weakly consistent at \(P\) if, for every weak neighborhood \(U\) of \(P\),
      \[
      \Pi(U^c\mid X_{1:n})\to0
      \]
      in \(P^{(\infty)}\)-probability as \(n\to\infty\).

      ###### Assumptions
      1. \(X_1,X_2,\dots\) are i.i.d. with law \(P\), where \(P\) has density \(p_0\) with respect to a dominating measure \(\mu\).
      2. The prior \(\Pi\) is a probability distribution on probability densities, and the posterior \(\Pi(\cdot\mid X_{1:n})\) is well defined \(P^{(\infty)}\)-almost surely.
      3. The prior has Kullback–Leibler support at \(P\): for every \(\varepsilon>0\),
         \[
         \Pi\bigl(K_\varepsilon(P)\bigr)>0.
         \]
      4. For every weak neighborhood \(U\) of \(P\), there exist exponentially consistent tests for \(U^c\) against \(P\), i.e. there exist tests \(\varphi_n\) and constants \(C,c>0\) such that
         \[
         \mathbb E_{P}^{\otimes n}\varphi_n\le C e^{-cn},
         \qquad
         \sup_{Q\in U^c}\mathbb E_{Q}^{\otimes n}(1-\varphi_n)\le C e^{-cn}
         \]
         for all sufficiently large \(n\).

      Source-specific caveat: the citation uses an assumption denoted \(H4\) to conclude that the posterior is weakly consistent at \(P\). The supplied material does not contain the exact printed definition of \(H4\). It therefore cannot be determined from the supplied text whether \(H4\) is precisely the Kullback–Leibler prior-support condition, a separately stated testing condition, or a combined source assumption. The theorem above is stated with the standard Schwartz hypotheses explicitly, but it is not asserted to be the exact wording or exact hypothesis packaging of the cited \(H4\).

      ###### Statement
      Under the assumptions above, the posterior distribution is weakly consistent at \(P\): for every weak neighborhood \(U\) of \(P\),
      \[
      \Pi(U^c\mid X_{1:n})\to0
      \]
      in \(P^{(\infty)}\)-probability as \(n\to\infty\). Equivalently, for the random posterior density \(h\),
      \[
      \operatorname{pr}\bigl(h\in U^c\mid X_{1:n}\bigr)\to0
      \]
      in \(P^{(\infty)}\)-probability for every weak neighborhood \(U\) of \(P\).

