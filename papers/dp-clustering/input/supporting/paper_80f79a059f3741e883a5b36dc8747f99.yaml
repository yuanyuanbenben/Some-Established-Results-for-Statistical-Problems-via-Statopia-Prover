      \infty, & \text{otherwise}.
      \end{cases}
      \]
      The family \(\Psi\) is continuous if the map \(\theta\mapsto\psi_\theta\) is continuous. It is mixture-identifiable if \(F:\mathbb G\to\mathbb F\) is a bijection. A sequence \((\psi_i)_{i=1}^\infty\) is \(\mu\)-wide if for every closed \(C\) with \(\mu(C)=0\) and every sequence \((\phi_i)_{i=1}^\infty\) with \(\psi_i\leftrightarrow\phi_i\),
