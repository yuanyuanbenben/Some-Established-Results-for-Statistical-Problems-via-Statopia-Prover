    latex_statement: |-
      **Dirichlet process mixture model.** The model is
      \[
      X_i\mid\theta_i \simind k(\cdot\mid\theta_i),\qquad
      \theta_i\mid \tilde P \simiid \tilde P,\qquad
      \tilde P\mid \alpha \sim \operatorname{DP}(\alpha,Q_0),\qquad
      \alpha\sim\pi,
      \]
      where \(k(\cdot\mid\theta)\) is a density for every \(\theta\), \(\alpha>0\) is the concentration parameter, and \(Q_0\) is the baseline distribution on \((\mathbb X,\mathcal X)\). The number of clusters in a sample of size \(n\) is \(K_n\); equivalently, \(K_n\) is the number of distinct latent parameters among \(\theta_1,\dots,\theta_n\). The posterior probability under this model is denoted \(\operatorname{pr}(\cdot\mid X_{1:n})\). Define
      \[
      \underline{\Pi}_n:=\operatorname{pr}(K_n<t\mid X_{1:n}).
      \]

      **Data-generating mechanism.** The data are
      \[
      X_i\simiid P=\sum_{j=1}^t p_jR_j,\qquad i=1,2,\dots,
      \]
      where \(t\ge1\), the \(R_j\) are distinct probability measures on \(\mathbb X\), \(p_j\in(0,1)\), and \(\sum_{j=1}^t p_j=1\). The product laws are \(P^{(n)}\) on \(\mathbb X^n\) and \(P^{(\infty)}\) on \(\mathbb X^\infty\). Posterior probabilities are computed under the mixture model, while convergence in probability is with respect to \(X_{1:\infty}\sim P^{(\infty)}\). The support of the baseline probability measure \(Q_0\) is denoted \(\operatorname{supp}Q_0\).

      **Kernel and baseline conditions \(B1\)–\(B3\).** In the \(B1\)–\(B3\) branch the kernel is a location kernel
      \[
      k(x\mid\theta)=g(x-\theta),
      \]
      and the baseline is \(Q_0(d\theta)=q_0(\theta)\,d\theta\). After the linear rescaling used in the source, one may take \([a,b]=[-c,c]\). The supplied working form of \(B1\)–\(B3\) after this rescaling is \(T1\)–\(T4\):
      \[
      \begin{array}{ll}
      T1. & \exists\,m,M \text{ such that } 0<m\le g(x)\le M<\infty
      \text{ for every }x\in[-c,c];\\[2mm]
      T2. & g\text{ is differentiable on }(-c,c),\text{ and }\exists\,R
      \text{ such that }\left|\dfrac{g'(x)}{g(x)}\right|\le R<\infty
      \text{ for every }x\in(-c,c);\\[2mm]
      T3. & \exists\,U>0\text{ such that }
      h(y)=q_0(y)+q_0(-y)\le U
      \text{ for every }y\in[0,2c];\\[2mm]
      T4. & \exists\,L>0\text{ such that }q_0(\theta)\ge L
      \text{ for every }\theta\text{ in a neighborhood of }\theta_j^*,
      \text{ for every }j.
      \end{array}
      \]
      The original wording of \(B1\)–\(B3\) is not printed in the supplied material; the above is the rescaled working form.

      **Conditions \(H1\)–\(H4\).** Let \(\mathbb X\subseteq\mathbb R^q\) and \(\Theta\subseteq\mathbb R^p\). The family of kernels is
      \[
      \Psi=\{k(\cdot\mid\theta):\theta\in\Theta\},
      \]
      dominated by \(\mu\), where \(\mu\) is either Lebesgue or counting measure, with common domain \(\mathbb X\). Let \(\bar\Theta\) be the closure of \(\Theta\), and define the boundary set of singular kernels
      \[
      \mathbb B:=\left\{\bar\theta\in\bar\Theta\setminus\Theta:
      \lim_{\theta\to\bar\theta}\left\{\sup_x k(x\mid\theta)\right\}=\infty\right\}.
      \]
      For \(s\ge1\), let \(\mathbb G_s\) be the set of mixtures of exactly \(s\) elements of \(\Psi\):
      \[
      f\in\mathbb G_s
      \quad\Longleftrightarrow\quad
      f=\sum_{j=1}^s q_j k(\cdot\mid\theta_j),
      \]
      with \(q_j>0\) for every \(j\), \(\sum_{j=1}^s q_j=1\), and \(\theta_i\ne\theta_h\) for every \(i\ne h\).
      Let \(\mathcal P(G)\) denote the set of probability measures on a generic space \(G\); write \(f\in\mathcal P(G)\) when \(f\) is the density of a probability measure \(P\in\mathcal P(G)\). For \(P\in\mathbb G_t\), with weights \(\{p_j\}_{j=1}^t\) and parameters \(\{\theta_j^*\}_{j=1}^t\), the Kullback–Leibler neighborhoods of \(P\) are
      \[
      KL_\epsilon(P)
      :=
      \left\{
      h\in\mathcal P(\mathbb X):
      \int
      \log\left\{
      \frac{\sum_{j=1}^{t} p_j k(x\mid\theta_j^*)}{h(x)}
      \right\}
      P(dx)
      <\epsilon
      \right\},
      \qquad \epsilon>0.
      \]
      A weak neighborhood of \(P\) means a neighborhood of \(P\) in the weak topology on the space of probability measures on \(\mathbb X\).

      The conditions \(H1\)–\(H4\) are:

      \(H1.\) For every \(\bar\theta\in\Theta\setminus\mathbb B\), for \(\mu\)-almost every \(x\in\mathbb X\), there exists \(A:=A(\bar\theta,x)\subset\Theta\setminus\mathbb B\), a neighborhood of \(\bar\theta\), such that the mapping
      \[
      \theta\in A\longmapsto k(x\mid\theta)
      \]
      is continuous. Moreover, \(\mathbb B\) is closed.

      \(H2.\) Let \(\{\theta_i\}_{i=1}^\infty\subset\Theta\). If \(\|\theta_i\|\to\infty\) as \(i\to\infty\), then for every compact set \(K\subset\mathbb X\),
      \[
      \int_K k(x\mid\theta_i)\,\mu(dx)\to0
      \qquad\text{as }i\to\infty.
      \]
      If \(\theta_i\to\bar\theta\in\mathbb B\), then there exists \(x^*\in\mathbb X\) such that
      \[
      k(\cdot\mid\theta_i)\to\delta_{x^*}(\cdot)
      \]
      weakly as \(i\to\infty\).

      \(H3.\) If \(f\in\mathbb G_t\), then there exist no \(f'\in\mathbb G_s\), with \(s<t\), such that
      \[
      f(x)=f'(x)\qquad\text{for }\mu\text{-almost every }x\in\mathbb X.
      \]

      \(H4.\) For every \(P\in\mathbb G_t\), \(t\ge1\), with \(\theta_1^*,\dots,\theta_t^*\) belonging to the support of \(Q_0\), one has
      \[
      \operatorname{pr}\bigl(h\in KL_\epsilon(P)\bigr)>0
      \qquad\text{for every }\epsilon>0,
      \]
      where \(h\) follows the prior distribution in the Dirichlet process mixture model above.

      <!-- formalization-clarifications:v1:c2e4949f8c9b637e8d1286c87e323242f047735ab34954848ed43b4be15a44ae -->
      Formalization clarifications from source and proof:
      1. Constants and quantifier order. In Prop. undersmoothing (main.tex), the intended reading is pointwise in the fixed objects: fix the data-generating finite mixture \(P=\sum_{j=1}^t p_jR_j\) with finite \(t\ge1\), fixed distinct \(R_j\), fixed weights \(p_j\in(0,1)\), fixed true parameters \(\theta_j^*\) with \(\theta_j^*\in\operatorname{supp}Q_0\), fixed kernel \(k\), baseline \(Q_0\), and concentration prior \(\pi\); then let \(n\to\infty\). The statement “with no condition imposed on \(\pi\), \(t\), or the \(p_j\)” means no additional assumptions such as \(A1\)–\(A3\), separation, moment bounds, or growth restrictions are imposed beyond those displayed. It does not mean uniformity in \(t\), \(p_j\), \(\theta_j^*\), \(\pi\), kernel, baseline, or dimension, and it does not allow constants or objects to depend on \(n\). In the \(H1\)–\(H4\) alternative, \(H4\) itself is universally quantified over every \(P\in\mathbb G_t\), every \(t\ge1\), every such \(\theta^*\), and every \(\epsilon>0\) (“For every \(P\in\mathbb G_t\), \(t\ge1\), ... \(\operatorname{pr}(h\in KL_\epsilon(P))>0\)”); the final undersmoothing conclusion is nevertheless stated for the fixed \(P,t\) of the proposition, not uniformly in them.

      In the \(B1\)–\(B3\)/\(T1\)–\(T4\) branch, \(c>0\) is fixed by the rescaled support interval \([-c,c]\). \(T1\) has constants \(m,M\) depending on \(g\) and \(c\) in the displayed order \(0<m\le g(x)\le M<\infty\) for all \(x\in[-c,c]\). \(T2\) has \(R\) with \(|g'(x)/g(x)|\le R\) for all \(x\in(-c,c)\). \(T3\) has \(U\) with \(q_0(y)+q_0(-y)\le U\) for all \(y\in[0,2c]\). \(T4\) is displayed as \(\exists L>0\) such that \(q_0(\theta)\ge L\) for every \(\theta\) in a neighborhood of \(\theta_j^*\), for every \(j\); the proof uses one common \(L\) and possibly \(j\)-dependent neighborhoods, but the source leaves the exact dependency of the neighborhoods and of \(L\) on \(j,Q_0,\theta_j^*\) only implicit. \(H1\)’s neighborhood \(A(\bar\theta,x)\) may depend on both \(\bar\theta\) and \(x\). In \(H2\), \(x^*\) may depend on the sequence and its limit \(\bar\theta\). The cited Lemma weak_convergence has no numerical constants; the auxiliaries first_auxiliary and second_auxiliary only select subsequences and limiting positive weights. Cai Lemma 4.1 has a fixed integer bound \(k\) in \(\sup_i|\operatorname{supp}\phi_i|\le k\).

      2. Norms and mathematical objects. The only norm-like symbol in the target assumptions is \(\|\theta_i\|\) in \(H2\) (“If \(\|\theta_i\|\to\infty\) ...”), where the ambient spaces are \(\mathbb X\subseteq\mathbb R^q\) and \(\Theta\subseteq\mathbb R^p\). The supplied source does not define whether this is Euclidean \(\ell_2\), sup, or another norm; the proof also uses closed balls \(B_x(\epsilon)\) without specifying the metric. Do not silently replace this by a convenient norm. In the \(B1\)–\(B3\) location branch the objects are real: \(x,\theta\in\mathbb R\), \(k(x\mid\theta)=g(x-\theta)\), and the relevant absolute values are the usual real absolute value, e.g. \(|g'(x)/g(x)|\), \(|\theta_j^*-\theta_k^*|\), \(|\theta|\) in the proof. Kernels \(k(\cdot\mid\theta)\) are densities with respect to \(\mu\), where \(\mu\) is explicitly either Lebesgue or counting measure in the \(H\)-framework; in the \(B\)-branch \(Q_0(d\theta)=q_0(\theta)d\theta\). The baseline \(Q_0\) is the Dirichlet-process base on the latent parameter space in the DPM model and in the support condition \(\theta_j^*\in\operatorname{supp}Q_0\); the generic introductory phrase saying the baseline is on \((\mathbb X,\mathcal X)\) conflicts with the latent-parameter use and should not be copied into the \(H\)-formalization.

      The sets \(\mathbb G_s\) are exact \(s\)-component mixtures: \(q_j>0\), \(\sum q_j=1\), and distinct parameters. Do not replace \(\mathbb G_s\) by “at most \(s\) components”; Lemmas first_auxiliary and second_auxiliary reduce a sequence to some exact \(s'\), but the final neighborhood must satisfy \(\mathcal U\cap\mathbb G_s=\varnothing\) for every \(s<t\). The notation \(f\in\mathcal P(G)\) in the source means that \(f\) is a density of a probability measure, not that \(f\) itself is an abstract measure; weak convergence is for the corresponding probability measures. The KL neighborhood is exactly
      \[
      KL_\epsilon(P)=\{h:\int \log\{(\sum_j p_jk(x\mid\theta_j^*))/h(x)\}P(dx)<\epsilon\},
      \]
      with \(P\) the true probability and \(h\) the prior random density; it is not a weak neighborhood and the direction must not be reversed. A weak neighborhood is a neighborhood in the weak topology on probability measures.

      An important implicit side condition: \(H4\) and the displayed \(KL_\epsilon(P)\) are stated for \(P\in\mathbb G_t\), and the proof of Prop. undersmoothing explicitly works “Let \(P\in\mathbb G_t\) with parameters \(\theta_1^*,\dots,\theta_t^*\).” The proposition’s displayed sentence only says “with true parameters”; it does not spell out \(R_j=k(\cdot\mid\theta_j^*)\). The reduction via \(H4\) requires the true \(P\) to have density \(\sum_j p_jk(\cdot\mid\theta_j^*)\) (well-specified finite mixture) or an equivalent source statement. This is an implicit/unresolved side condition, not a consequence of merely having \(\theta_j^*\in\operatorname{supp}Q_0\).

      Cai Lemma 4.1, as extracted, only gives \(|\operatorname{supp}\phi|\le k\) for a weak limit of measures with supports of size at most \(k\). The proof of Prop. undersmoothing uses it to obtain an exact \(s\)-atom decomposition in \(\mathbb D_s\) with positive weights; that exact decomposition is not stated by Lemma 4.1 alone and is an unresolved citation-context step.

      3. Asymptotics. The final convergence is \(n\to\infty\), in probability under the data law. Main.tex defines convergence in \(P^{(\infty)}\)-probability for \(X_{1:\infty}\sim P^{(\infty)}\); the selected target statement uses \(P^{(n)}\)-probability. Since the event \(\{K_n<t\}\) depends only on \(X_{1:n}\), \(P^{(n)}\)- and \(P^{(\infty)}\)-probabilities of that event coincide, but this equivalence is a standard inference, not printed in the selected statement. The source notes in main.tex that, for probabilities bounded in \([0,1]\), convergence in \(P^{(\infty)}\)-probability is equivalent to \(L^1\) convergence. There is no Big-\(O\), little-\(o\), or rate assertion in Prop. undersmoothing; the only asymptotic assertions are convergence in probability for the posterior probability, limits \(i\to\infty\) inside \(H1\)–\(H2\), and weak convergence in the auxiliary lemmas. Lemma weak_convergence concludes \(\operatorname{pr}(K_n<t\mid X_{1:n})\to0\) in \(P^{(\infty)}\)-probability under the displayed weak-neighborhood hypothesis; the existence of \(\mathcal U\) is a hypothesis of that lemma, not its conclusion. The auxiliary lemmas first_auxiliary and second_auxiliary are deterministic weak-convergence statements about sequences of mixtures, with no probability-in-data parameter.

      The proof invokes Schwartz posterior consistency via Ghosal–van der Vaart Theorem 6.16 and Example 6.20 (“By assumption \(H4\), the posterior distribution is consistent ... in virtue of Schwartz theorem”). The selected Reference R7 states that the exact book text of Theorem 6.16/Example 6.20 was not retrieved; the provided theorem statement includes standard Schwartz testing hypotheses, whereas the displayed \(H4\) is only a KL prior-support condition. The source’s assertion that \(H4\) suffices is therefore a proof-based citation step; the missing testing/Example 6.20 content is unresolved. Do not add a testing hypothesis to \(H4\) in the target statement, and do not discard the external theorem’s own hypotheses if formalizing the cited Schwartz result itself.

      4. Omitted definitions, events, and side conditions. \(K_n\) is explicitly the number of distinct latent parameters among \(\theta_1,\dots,\theta_n\), equivalently the number of clusters in the sample, not the number of atoms of the random DP mixture density \(h\) globally. The event \(K_n<t\) means \(K_n\in\{1,\dots,t-1\}\) for \(n\ge1\); the posterior probability is under the DPM model with \(\alpha\sim\pi\), while the convergence is over data generated by \(P\). The prior \(\pi\) must be a probability distribution on \(\alpha>0\) for the model, but Prop. undersmoothing imposes no \(A1\)–\(A3\), moment, support, or regularity condition on \(\pi\); any additional regularity needed by the Schwartz theorem is not displayed. The support condition in the proposition is \(\operatorname{supp}Q_0\), not “interior support” (the latter is used in Theorem th:ConsBounded). The \(T4\) lower bound \(q_0\ge L\) near the \(\theta_j^*\) is stronger than mere support and is not part of the printed main.tex \(B3\), which only says \(Q_0\) is absolutely continuous with bounded density. This matters: Lemma th:WeakConsDens claims \(B1\)–\(B3\) imply \(H1\)–\(H4\), but its proof uses \(T1\)–\(T4\), and \(T4\) is not a literal consequence of the printed \(B1\)–\(B3\). The proof of Theorem th:ConsBounded says “Through a linear rescaling ... We rewrite the assumptions on \(g\) and \(Q_0\) as \(T1\)–\(T4\),” so \(T1\)–\(T4\) should be treated as the source’s working rescaled assumptions in that proof, not automatically as an equivalent restatement of the main \(B1\)–\(B3\). This is one of the clearest unresolved source ambiguities affecting formalization.

      Finally, the proof of Lemma weak_convergence uses the intermediate claim that “conditional on \(K_n<t\), the domain of the posterior distribution is a subset of \(\cup_{s<t}\mathbb G_s\),” and hence \(\operatorname{pr}(h\in\mathcal U^c\mid X_{1:n},K_n<t)=1\). The displayed definitions define \(K_n\) through distinct latent parameters and \(h\) as a DP mixture random density; they do not separately define a posterior on \(h\) conditional on \(K_n<t\) as a finite mixture in \(\mathbb G_s\). That conditional-support statement is a proof-based inference, not a definition or hypothesis. Use the stated Lemma weak_convergence as the source result rather than promoting that intermediate conditional identification into the target assumptions.
      <!-- /formalization-clarifications -->

      Let \(X_i\simiid P=\sum_{j=1}^t p_jR_j\) be as in the data-generating mechanism described in Definitions and notation, with finite \(t\ge1\), distinct \(R_j\), and \(p_j\in(0,1)\). Let the true parameters \(\theta_1^*,\dots,\theta_t^*\) be such that \(\theta_j^*\in\operatorname{supp}Q_0\) for every \(j\). If the kernel \(k\) satisfies assumptions \(B1\)–\(B3\) (or \(H1\)–\(H4\) of the supplement), then, under the Dirichlet process mixture posterior, and with no condition imposed on the prior \(\pi\) on \(\alpha\), nor on \(t\), nor on the weights \(p_j\),
      \[
      \underline{\Pi}_n=\operatorname{pr}(K_n<t\mid X_{1:n})\longrightarrow 0
      \]
      in \(P^{(n)}\)-probability as \(n\to\infty\).
    assumptions: []
    proof_body: |-
      We follow the proof of Proposition \ref{undersmoothing} in the supplement. Define
      \[
      \Psi = \{k(\cdot \mid \theta):\theta\in\Theta\subseteq\mathbb R^p\}
      \]
      and, for \(s\ge1\), let \(\mathbb G_s\) be the set of finite mixtures of exactly \(s\) elements of \(\Psi\) with positive weights and distinct parameters. Let \(\mathbb B\subseteq\bar\Theta\setminus\Theta\) be the boundary set of singular kernels, as in the source. Assume the hypotheses \(H1\)–\(H4\) as stated in the proof. The source first proves [ref:R1]: under \(B1\)–\(B3\), assumptions \(H1\)–\(H4\) are fulfilled. Its proof verifies \(H3\) from \(B1\), obtains \(H1\) from \(B2\) and the interval support of \(k(x\mid\theta)=g(x-\theta)\), obtains \(H2\) because \(\theta\) is a location parameter, and proves \(H4\) by constructing the sets \(\mathbb F(\delta,r)\) and showing that, using \(T1\)–\(T4\) (the rewritten \(B1\)–\(B3\)), these sets are contained in Kullback–Leibler neighborhoods \(KL_\epsilon(P)\) with positive prior probability. Therefore, for the \(B1\)–\(B3\) branch we may replace \(B1\)–\(B3\) by \(H1\)–\(H4\); for the stated \(H1\)–\(H4\) branch we argue directly under \(H1\)–\(H4\).

      It remains to show that there exists a weak neighborhood \(\mathcal U\) of \(P\) such that
      \[
      \mathcal U\cap \mathbb G_s=\varnothing
      \qquad\text{for every }s<t.
      \]
      Suppose not. Then there is a sequence
      \[
      f_i\in\bigcup_{s<t}\mathbb G_s
      \]
      converging weakly to \(f\), the density of \(P\). By [ref:R3], passing to a subsequence if necessary, we may suppose that \(f_i\in\mathbb G_s\) for some fixed \(s<t\). By [ref:R4], passing again to a subsequence and removing any weights with limiting mass \(0\) if necessary, we may write
      \[
      f_i=\sum_{j=1}^{s}q_{j,i}k(\cdot\mid \theta_{j,i}),
      \qquad
      \liminf_i q_{j,i}>0
      \quad (j=1,\dots,s).
      \]
      We now consider the three cases from the source.

      In case (i), some sequence \(\theta_{l,i}\) has \(\limsup_i\|\theta_{l,i}\|=\infty\) along a subsequence. Fix
      \[
      0<\epsilon<\liminf_i q_{l,i}
      \]
      and choose a compact set \(K\subset\mathbb X\) with \(P(K)>1-\epsilon/4\). By \(H2\), for large \(i\),
      \[
      \int_{K^c}f_{r(i)}(x)\,\mu(dx)
      >
      q_{l,r(i)}\int_{K^c}k(x\mid\theta_{l,r(i)})\,\mu(dx)
      >
      \frac{\epsilon}{2},
      \]
      contradicting weak convergence of \(f_i\) to \(P\).

      In case (ii), all parameters \(\theta_{j,i}\) eventually lie in a compact set \(C\subset\Theta\setminus \mathbb B\). Passing to a subsequence, the empirical mixing measures
      \[
      \nu_i=\sum_{j=1}^{s}q_{j,i}\delta_{\theta_{j,i}}
      \]
      converge weakly to some \(\nu\in\mathcal P(\Theta)\). By [ref:R6], \(\nu\in\mathbb D_s\), so
      \[
      \nu=\sum_{j=1}^{s}\tilde q_j\delta_{\tilde\theta_j}
      \]
      with \(\tilde q_j>0\) and \(\tilde\theta_j\in C\). By \(H1\), continuity on neighborhoods of the \(\tilde\theta_j\), and compactness, for \(\mu\)-almost every \(x\),
      \[
      \sum_{j=1}^{s}q_{j,i}k(x\mid\theta_{j,i})
      \longrightarrow
      \sum_{j=1}^{s}\tilde q_j k(x\mid\tilde\theta_j).
      \]
      Hence \(f_i\) converges weakly to the \(s\)-component mixture
      \[
      \tilde f=\sum_{j=1}^{s}\tilde q_j k(\cdot\mid\tilde\theta_j).
      \]
      By uniqueness of the weak limit, \(\tilde f=f\) \(\mu\)-almost surely. Since \(s<t\), this contradicts \(H3\).

      In case (iii), all parameters lie in a compact set \(C\subset\Theta\), but some \(\theta_{l,i}\) approaches the boundary set \(\mathbb B\). Passing to a subsequence,
      \[
      \theta_{l,r(i)}\to\bar\theta\in\mathbb B.
      \]
      If \(\mu\) is counting measure this is impossible because \(k(x\mid\theta)\le1\). If \(\mu\) is Lebesgue measure, choose \(\epsilon>0\) such that
      \[
      P(B_{x^*}(\epsilon))<\frac{\liminf_i q_{l,i}}{4},
      \]
      where \(x^*\) is given by \(H2\). Then for large \(i\),
      \[
      \int_{B_{x^*}(\epsilon)}f_{r(i)}(x)\,\mu(dx)
      >
      q_{l,r(i)}
      \int_{B_{x^*}(\epsilon)}k(x\mid\theta_{l,r(i)})\,\mu(dx)
      >
      \frac{\liminf_i q_{l,i}}{2},
      \]
      again contradicting weak convergence to \(P\). Thus no such sequence exists, and the required weak neighborhood \(\mathcal U\) of \(P\), disjoint from \(\bigcup_{s<t}\mathbb G_s\), exists.

      Now apply [ref:R2]. Since \(H4\) holds and the parameters \(\theta_1^*,\dots,\theta_t^*\) belong to \(\operatorname{supp}Q_0\), and since we have found a weak neighborhood \(\mathcal U\) of \(P\) with \(\mathcal U\cap\mathbb G_s=\varnothing\) for every \(s<t\), we get
      \[
      \operatorname{pr}(K_n<t\mid X_{1:n})\to0
      \]
      in \(P^{(\infty)}\)-probability as \(n\to\infty\). More explicitly, by \(H4\) and [ref:R7], the posterior is weakly consistent at \(P\), so
      \[
      \operatorname{pr}(h\in\mathcal U^c\mid X_{1:n})\to0.
      \]
      But conditionally on \(K_n<t\), the posterior support lies in \(\bigcup_{s<t}\mathbb G_s\subseteq\mathcal U^c\), hence
      \[
      \operatorname{pr}(h\in\mathcal U^c\mid X_{1:n})
      \ge
      \operatorname{pr}(K_n<t\mid X_{1:n}).
      \]
      Therefore \(\operatorname{pr}(K_n<t\mid X_{1:n})\to0\), which proves Proposition \ref{undersmoothing}. The same conclusion applies under the \(B1\)–\(B3\) branch by the initial reduction to \(H1\)–\(H4\).

