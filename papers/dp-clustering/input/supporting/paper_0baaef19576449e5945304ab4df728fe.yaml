      ##### Fundamental Theorem of Integral Calculus (Newton–Leibniz formula)
      ###### Content basis
      The current proof cites this result as “the Fundamental Theorem of Integral Calculus” in the line beginning “By \(T2\) and …”. No bibliography entry, theorem number, page, edition, or uploaded original source is available; the supplied source-read results are empty. The statement below is therefore a standard, source-unconfirmed restatement of the Newton–Leibniz/FTC second part, not a retrieved quotation. It supports the equality
      \[
      p(y)-p(x)=\int_x^y p'(t)\,dt,
      \]
      hence also the absolute-value equality in the citation. It does not by itself supply the later absolute-value and monotonicity inequalities; those are recorded separately below. The current hypothesis \(T2\) is not a hypothesis of the FTC and is not asserted here to discharge the FTC’s regularity conditions. The exact version used by the unavailable original source — continuous derivative, Riemann-integrable derivative, or Lebesgue/absolute-continuity form — is not confirmed.

      ###### Definitions and notation
      Let \(\mathbb R\) be the real line, \(I\subseteq\mathbb R\) an interval, and \(f:I\to\mathbb R\). At points where it exists, \(f'\) denotes the ordinary derivative of \(f\). For \(x,y\in I\), \(\int_x^y f'(t)\,dt\) denotes the definite integral of \(f'\) over the interval from \(x\) to \(y\); in the cited use \(x\le y\). In the cited application, \(I=(-c,c)\), \(f=p\), \(p(t)=\log g(t)\), and \(p'(t)=g'(t)/g(t)\), where \(g>0\) and \(g\) is differentiable. This identification is expository notation for the application, not an additional hypothesis of the FTC.

      ###### Assumptions
      Let \(I\subseteq\mathbb R\) be an interval, let \(f:I\to\mathbb R\), and let \(x,y\in I\) with \(x\le y\). Assume:
      1. \(f\) is differentiable on an open interval containing \([x,y]\);
      2. \(f'\) is Riemann integrable on \([x,y]\).

      Source-verification note: the exact original version is unavailable. A common Lebesgue formulation replaces condition 2 by absolute continuity of \(f\) on \([x,y]\) and Lebesgue integrability of \(f'\). No condition on \(g,c\), or \(T2\) is part of the FTC itself.

      ###### Statement
      Under the above assumptions,
      \[
      \int_x^y f'(t)\,dt=f(y)-f(x).
      \]
      Equivalently, on the interval \([x,y]\), the definite integral of the derivative equals the increment of the function.

      ##### Displayed integral estimate (absolute value and monotonicity)
      ###### Content basis
      The same citation displays the chain
      \[
      \left|\int_x^y p'(t)\,dt\right|
      \le \int_x^y \left|\frac{g'(t)}{g(t)}\right|\,dt
      \le R|y-x|.
      \]
      No separate theorem name, source location, or bibliographic attribution for this estimate is supplied. It is an elementary, source-unconfirmed integral estimate, included because the named FTC covers only the equality step. In the current proof it is applied with \(f=p'=g'/g\) and with the bound \(R\) coming from \(T2\); \(T2\) is not an assumption of this estimate, and no claim is made here that the original source stated it as a separately named theorem.

      ###### Definitions and notation
      Let \(x\le y\) be real numbers, let \(f\) be a real-valued function on \([x,y]\), and let \(R\ge0\). The integrals \(\int_x^y f(t)\,dt\) and \(\int_x^y |f(t)|\,dt\) are definite integrals, and \(|\cdot|\) is ordinary absolute value.

      ###### Assumptions
      Assume:
      1. \(x\le y\);
      2. \(f\) and \(|f|\) are integrable on \([x,y]\);
      3. \(R\in[0,\infty)\) satisfies
      \[
      |f(t)|\le R\qquad\text{for all }t\in[x,y].
      \]

      ###### Statement
      Under the above assumptions,
      \[
      \left|\int_x^y f(t)\,dt\right|
      \le \int_x^y |f(t)|\,dt
      \le R(y-x)=R|y-x|.
      \]
