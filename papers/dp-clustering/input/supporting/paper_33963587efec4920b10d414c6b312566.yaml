      ##### Proposition 3 (Proposition \ref{prop:Prior})

      ###### Definitions and notation
      Let \(\alpha>0\), and let \(\pi\) be a prior density for the Dirichlet process concentration parameter. Let
      \[
      \alpha^{(n)}=\alpha(\alpha+1)\cdots(\alpha+n-1)
      \]
      be the rising factorial. For fixed \(t\) and positive integers \(n,s\), the factor \(C(n,t,t+s)\) denotes the ratio of prior integrals
      \[
      C(n,t,t+s)
      =
      \frac{\int_0^\infty \frac{\alpha^{t+s}}{\alpha^{(n)}}\,\pi(\alpha)\,d\alpha}
      {\int_0^\infty \frac{\alpha^{t}}{\alpha^{(n)}}\,\pi(\alpha)\,d\alpha}.
      \]
      In the main-text equation (11), the same prior-dependent factor is written \(C(n,t,s)\) when comparing \(K_n=s\) with \(K_n=t\), with numerator exponent \(\alpha^s\) and denominator exponent \(\alpha^t\); thus \(C(n,t,t+s)\) in the supplement is the same prior-ratio factor with the numerator exponent \(t+s\).

      The symbol
      \[
      \gamma(x,y)=\int_0^y z^{x-1}e^{-z}\,dz
      \]
      denotes the lower incomplete Gamma function, and \(\Gamma\) denotes the usual Gamma function. The source writes
      \[
      E(\alpha^{r})=\int \alpha^{r}\pi(\alpha)\,d\alpha,
      \]
      the expectation with respect to the prior \(\pi\). The proposition asserts existence of constants \(F,G>0\). In the proof of Proposition 3, after the reduction \(\epsilon<1\), the displayed choice is
      \[
      G=\frac{4\delta^{2}}{\epsilon^{t+\beta}\gamma(t+\beta,\epsilon\log 2)}.
      \]
      The source’s upper-bound factor \(\{\log n/(1+\epsilon)\}^{s}\) is evaluated in the proof as
      \[
      \{\log(cn)\}^{-s}
      =
      \{\log(n/(1+\epsilon))\}^{-s},
      \qquad c=(1+\epsilon)^{-1}.
      \]

      ###### Assumptions
      A1: \(\pi\) is absolutely continuous with respect to Lebesgue measure, and its density is still denoted by \(\pi\).

      A2: There exist \(\epsilon,\delta,\beta>0\) such that for every \(\alpha\in(0,\epsilon)\),
      \[
      \frac{1}{\delta}\alpha^{\beta}\le \pi(\alpha)\le \delta\alpha^{\beta}.
      \]

      No further moment condition A3 is assumed for this proposition.

      ###### Statement
      Suppose \(\pi\) satisfies A1 and A2. Then there exist \(F,G>0\) such that for every \(0<s\le n-t\),
      \[
      F\frac{\gamma\{t+s+\beta,\epsilon\log(n)\}}{\{\log(n)+1\}^{s}}
      \le
      C(n,t,t+s)
      \le
      \frac{Gs}{\epsilon^{s}}E(\alpha^{t+s-1})
      \frac{\gamma\{t+s+\beta,\epsilon\log(n)\}}{\{\log(n/(1+\epsilon))\}^{s}},
      \]
      where \(\gamma(x,y)\) is the lower incomplete Gamma function and
      \[
      E(\alpha^{r})=\int \alpha^{r}\pi(\alpha)\,d\alpha
      \]
      denotes expectation with respect to \(\pi\).
