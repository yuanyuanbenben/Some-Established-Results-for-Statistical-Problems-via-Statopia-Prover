      ##### Lemma \ref{denom1}
      ###### Definitions and notation
      Work in the setting of the proof of Theorem \ref{th:ConsBounded}, after the linear rescaling \([a,b]=[-c,c]\). The location kernel is \(k(x\mid\theta)=g(x-\theta)\). For \(j=1,\dots,t\), set
      \[
      C_j=\left\{i\in\{1,\dots,n\}:x_i\in[\theta_j^*+a,\theta_j^*+b]\right\},
      \qquad n_j=|C_j|.
      \]
      After rescaling, \([\theta_j^*+a,\theta_j^*+b]=[\theta_j^*-c,\theta_j^*+c]\).

      For \(x_{C_j}\), let \(x^j_{(r)}\) denote the \(r\)-th order statistic, so that \(x^j_{(1)}=\min_{i\in C_j}x_i\) and \(x^j_{(n_j)}=\max_{i\in C_j}x_i\). For a set \(A\), \(\mathbbm{1}_A\) denotes its indicator function.

      The constant \(R\) is the one appearing in condition \(T2\) below.

      ###### Assumptions
      The result is stated in the setting of the proof of Theorem \ref{th:ConsBounded}, with \(g\) satisfying the standing section conditions relevant to the lemma:
      - \(T1\): there exist \(m,M>0\) such that
        \[
        0<m\le g(x)\le M<\infty
        \qquad\text{for every }x\in[-c,c].
        \]
        In the source proof this positivity is used when writing \(p(x)=\log g(x)\) on \([-c,c]\).
      - \(T2\): \(g\) is differentiable on \((-c,c)\), and there exists \(R<\infty\) such that
        \[
        \left|\frac{g'(x)}{g(x)}\right|\le R
        \qquad\text{for every }x\in(-c,c).
        \]

      The lemma is asserted for every \(j=1,\dots,t\).

      ###### Statement
      For every \(j=1,\dots,t\) it holds
      \[
      \prod_{i\in C_j}\frac{g(x_i-\theta_j)}{g(x_i)}
      \ge
      e^{-R}\mathbbm{1}_{\left[0,\frac1{n_j}\right]}\bigl(|\theta_j-\theta_j^*|\bigr)
      \mathbbm{1}_{\left[x^j_{(n_j)}-c,\,x^j_{(1)}+c\right]}\bigl(\theta_j-\theta_j^*\bigr),
      \]
      with \(R\) defined in \(T2\), where \(x^j_{(r)}\) denotes the \(r\)-th order statistic of \(x_{C_j}\).
