      ##### Corollary \ref{cor_C}

      ###### Definitions and notation
      Let \(\alpha>0\), let \(\pi\) be the prior density for \(\alpha\), and let
      \[
      \alpha^{(n)}=\alpha(\alpha+1)\cdots(\alpha+n-1).
      \]
      For fixed \(t\ge 1\), integers \(n>s\ge1\), define the prior-integral factor
      \[
      C(n,t,t+s)
      :=
      \frac{\displaystyle\int_0^\infty \frac{\alpha^{t+s}}{\alpha^{(n)}}\,\pi(\alpha)\,d\alpha}
      {\displaystyle\int_0^\infty \frac{\alpha^{t}}{\alpha^{(n)}}\,\pi(\alpha)\,d\alpha}.
      \]
      This is the factor denoted \(C(n,t,t+s)\) in the source; in \eqref{ratios_for_inconsistency} the same prior-dependent factor is denoted \(C(n,t,s)\). It is not the data-dependent set \(C_j\) nor the event \(C^{(n)}\).

      Here \(E(\cdot)\) denotes expectation with respect to \(\pi\), so that
      \[
      E(\alpha^{t+s-1})=\int_0^\infty \alpha^{t+s-1}\,\pi(\alpha)\,d\alpha.
      \]
      \(\Gamma\) denotes the Gamma function, and
      \[
      \gamma(x,y)=\int_0^y z^{x-1}e^{-z}\,dz
      \]
      is the lower incomplete Gamma function.

      The positive constant \(G\) is the one “as in Proposition \ref{prop:Prior}.” In the supplied proof of Proposition \ref{prop:Prior}, after the harmless reduction \(\epsilon<1\) permitted by \(A2\), it is chosen as
      \[
      G=\frac{4\delta^2}{\epsilon^{t+\beta}\gamma(t+\beta,\epsilon\log 2)}.
      \]

      ###### Assumptions
      \(\pi\) satisfies assumptions \(A1\) and \(A2\).

      - \(A1\): \(\pi\) is absolutely continuous with respect to Lebesgue measure, with density still denoted by \(\pi\).
      - \(A2\): there exist \(\epsilon,\delta,\beta>0\) such that for every \(\alpha\in(0,\epsilon)\),
        \[
        \frac1\delta\,\alpha^\beta \le \pi(\alpha)\le \delta\,\alpha^\beta.
        \]

      These are the hypotheses displayed for Corollary \ref{cor_C}. Assumption \(A3\) is not assumed by the corollary; it is used only afterward in the parent proof.

      ###### Statement
      Suppose \(\pi\) satisfies assumptions \(A1\) and \(A2\). Then \(G>0\) as in Proposition \ref{prop:Prior} is such that for every \(0<s<n\) and \(n\ge4\),
