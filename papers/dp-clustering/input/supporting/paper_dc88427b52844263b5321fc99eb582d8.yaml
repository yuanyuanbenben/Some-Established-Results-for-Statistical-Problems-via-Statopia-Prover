      ##### Lemma \ref{bound_sum}
      ###### Definitions and notation
      Let \(t\in\mathbb N\). Let \(p_1,\dots,p_t\) be the finite-mixture weights fixed in the surrounding theorem, with \(p_j\in(0,1)\) for every \(j=1,\dots,t\) and \(\sum_{j=1}^t p_j=1\), and set
      \[
      p^*=\min_{j\in\{1,\dots,t\}}p_j\in(0,1).
      \]
      For \(j=1,\dots,t\), let \(n_j=|C_j|\), where, in the notation of the surrounding proof,
      \[
      C_j=\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\}.
      \]
      The lemma uses the integers \(n_j\) through the set \(\mathbf S\). For a tuple \(\mathbf s=(s_1,\dots,s_t)\) and \(s=\sum_{j=1}^t s_j\), define
      \[
      \mathbf S=\left\{(s_1,\dots,s_t):s_j\le n_j\ \text{and}\ \sum_{j=1}^t s_j=s\right\}.
      \]
      The multinomial coefficient is
      \[
      \binom{s}{s_1,\dots,s_t}=\frac{s!}{\prod_{j=1}^t s_j!}.
      \]

      ###### Assumptions
      Assume \(t\ge1\) is finite, \(p_j\in(0,1)\) for every \(j=1,\dots,t\), and \(\sum_{j=1}^t p_j=1\). Thus \(p^*=\min_{j\in\{1,\dots,t\}}p_j\in(0,1)\). Let \(n_j\) be the integers appearing in the summation set \(\mathbf S\), as in the surrounding proof. The summation is over the set \(\mathbf S\) defined above.

      ###### Statement
      Let \(p^* = \min_{j \in \{1, \dots, t\}} p_j \in (0,1)\). It holds
      \[
      \sum_{\mathbf{s} \in \mathbf{S}}\frac{s!}{\prod_{j = 1}^t s_j!}
      = \sum_{\mathbf{s}}\binom{s}{s_1, \dots, s_t}
      \leq (p^*)^{-s},
      \]
      where
      \[
      \mathbf{S} = \left\{(s_1, \dots, s_t) \, : \, s_j \leq n_j \text{ and } \sum_{j = 1}^t s_j = s \right\}.
      \]
