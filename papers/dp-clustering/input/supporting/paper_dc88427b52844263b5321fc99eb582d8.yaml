      ##### Content basis
      Source extraction from D1, the supplement “Supplementary Materials for Clustering consistency with Dirichlet process mixtures” by Ascolani, Lijoi, Rebaudo, and Zanella. The named result is Lemma \ref{numerator}, located in the section “Proof of Theorem \ref{th:ConsBounded}”. It supplies the per-block expectation bound used in the target proof when Lemma \ref{numerator} is applied to bound \(E\{T^{(n)}\}\). The additional displayed result \eqref{upper_bound_ratios}, immediately preceding Lemma \ref{numerator} in the same source section, defines the quantity \(T^{(n)}\) as an upper bound of the posterior-ratio object with \(\Omega_n\) in place of \(C^{(n)}\); it supports the interpretation of the \(T^{(n)}\) to which Lemma \ref{numerator} is applied. This is a displayed source inequality/definition, not a separately named lemma. The statement of Lemma \ref{numerator} is reproduced as printed in the source, including the inner integration domains \(\mathbb R^{s_j}\). The source text is supplied material; no external original or page verification is claimed.

      ##### Lemma \ref{numerator}
      ###### Definitions and notation
      Let \(t\in\mathbb N\), \(p_j\in(0,1)\) with \(\sum_{j=1}^t p_j=1\), and let
      \[
      P=\sum_{j=1}^t p_jR_j
      \]
      be the data-generating distribution with density
      \[
      f(x)=\sum_{j=1}^t p_jk(x\mid \theta_j^*),
      \]
      where \(k(x\mid\theta)=g(x-\theta)\) and \(Q_0(\mathrm d\theta)=q_0(\theta)\,\mathrm d\theta\). Let \(P^{(n)}\) denote the \(n\)-fold product law, and let \(X_{1:n}\sim P^{(n)}\). The true parameters are \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\). After the linear rescaling one takes \([a,b]=[-c,c]\). For \(j=1,\dots,t\), define
      \[
      C_j=\{i\in\{1,\dots,n\}: x_i\in[\theta_j^*+a,\theta_j^*+b]\},\qquad n_j=|C_j|.
      \]
      For \(s_j\ge1\), \(\tau_{s_j}(n_j)\) denotes the partitions of \(C_j\), identified with \(\{1,\dots,n_j\}\), into \(s_j\) nonempty blocks. A generic block is written
      \[
      A_j=(A^j_1,\dots,A^j_{s_j})\in\tau_{s_j}(n_j),
      \]
