    latex_statement: |-
      The Dirichlet process mixture model is
      \[
      X_i\mid\theta_i \simind k(\cdot\mid\theta_i),\qquad
      \theta_i\mid \tilde P \simiid \tilde P,\qquad
      \tilde P\mid \alpha \sim \operatorname{DP}(\alpha,Q_0),\qquad
      \alpha\sim\pi,
      \]
      where \(k(\cdot\mid\theta)\) is a density for every \(\theta\), \(\alpha>0\) is the concentration parameter, and \(Q_0\) is the baseline distribution on \((\mathbb X,\mathcal X)\). For every \(n,s\in\mathbb N\) with \(s\le n\), let \(\tau_s(n)\) be the set of partitions of \(\{1,\dots,n\}\) into \(s\) nonempty subsets. Conditionally on \(\alpha\), the induced prior on partitions is
      \[
      \operatorname{pr}(A\mid\alpha)
      =\frac{\alpha^s}{\alpha^{(n)}}\prod_{j=1}^s(a_j-1)!,
      \qquad
      A=\{A_1,\dots,A_s\}\in\tau_s(n),
      \]
      where \(\alpha^{(n)}=\alpha(\alpha+1)\cdots(\alpha+n-1)\) and \(a_j=|A_j|\). The number of clusters in a sample of size \(n\) is \(K_n\), and \(\operatorname{pr}(K_n=s\mid X_{1:n})\) denotes the posterior probability under this model. For a set \(B\subseteq\mathbb N\), write \(\Pi_n(B):=\operatorname{pr}(K_n\in B\mid X_{1:n})\); in particular \(\Pi_n(t):=\operatorname{pr}(K_n=t\mid X_{1:n})\). The marginal likelihood for a nonempty block \(A\) is
      \[
      m(x_A)=\int\prod_{i\in A}k(x_i\mid\theta)\,Q_0(d\theta)
      =\int_{\mathbb R}\prod_{i\in A}g(x_i-\theta)q_0(\theta)\,d\theta,
      \]
      under the location kernel \(k(x\mid\theta)=g(x-\theta)\) and \(Q_0(d\theta)=q_0(\theta)d\theta\).

      The data-generating mechanism is \(X_i\simiid P=\sum_{j=1}^t p_jR_j\), \(i=1,2,\dots\), where \(t\ge1\), the \(R_j\) are distinct probability measures on \(\mathbb X\), \(p_j\in(0,1)\), and \(\sum_{j=1}^t p_j=1\). The product laws are \(P^{(n)}\) on \(\mathbb X^n\) and \(P^{(\infty)}\) on \(\mathbb X^\infty\). Posterior probabilities are computed under the mixture model, while convergence in probability is with respect to \(X_{1:\infty}\sim P^{(\infty)}\). The true component densities are \(f_j(\cdot)=f(\cdot\mid\theta_j^*)=k(\cdot\mid\theta_j^*)\), and \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\) is completely separated:
      \[
      |\theta_j^*-\theta_k^*|>b-a\qquad(j\ne k).
      \]
      Each \(\theta_j^*\) belongs to the interior support of \(Q_0\). After the linear rescaling used in the source, one may take \([a,b]=[-c,c]\). The support interval \([a,b]\) is from \(B1\); the supplied pages do not expand \(B1\)–\(B3\) (or \(H1\)–\(H4\)). The conditions \(T1\)–\(T4\) are the rescaled working conditions used in the source proof and in this result.

      Ratios
      \[
      \frac{\operatorname{pr}(K_n=t+s\mid X_{1:n})}{\operatorname{pr}(K_n=t\mid X_{1:n})}
      \]
      are read with convention \(0\) when the denominator posterior probability is \(0\). The two conventions differ only on \(\{\Pi_n(t)=0\}\), a set of \(P^{(n)}\)-probability tending to zero.

      Define
      \[
      C_j=\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\},\qquad n_j=|C_j|.
      \]
      For \(X_{C_j}\), let \(X^j_{(r)}\) denote the \(r\)-th order statistic, and define
      \[
      Y^j_{n_j}:=\min[1,\; n_j(\log n)^{\frac1{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}].
      \]
      Let \(N_j\) be the fixed integer threshold furnished by Lemma \ref{denom}, and define
      \[
      \Omega_n=\{\text{for every }j=1,\dots,t:\ n_j\ge N_j,\; Y^j_{n_j}\in[1/2,1]\}.
      \]
      The selected source does not print the exact constants or dependence of \(N_j\) beyond the condition \(n_j\ge N_j\) and \(Y^j_{n_j}\in[1/2,1]\). The base of \(\log\) in \(Y^j_{n_j}\) is not stated; any fixed base changes only constants.

