      Consider the Dirichlet process mixture model described in Definitions and notation. Let \(X_i \simiid P=\sum_{j=1}^t p_jR_j\), \(i=1,2,\dots\), where \(t\ge1\), the \(R_j\) are distinct probability measures on \(\mathbb X\), \(p_j\in(0,1)\) for every \(j\), and \(\sum_{j=1}^t p_j=1\). Let \(P^{(n)}\) and \(P^{(\infty)}\) be the product probability measures on \(\mathbb X^n\) and \(\mathbb X^\infty\), respectively, and assume \(X_{1:\infty}\sim P^{(\infty)}\). Put \(f_j(\cdot):=f(\cdot\mid\theta_j^*)=k(\cdot\mid\theta_j^*)\). Assume \(k(x\mid\theta)=g(x-\theta)\), and that the true parameter vector \(\theta^*=(\theta_1^*,\dots,\theta_t^*)\) is completely separated: \(|\theta_j^*-\theta_k^*|>b-a\) \((j\ne k)\), and each \(\theta_j^*\) belongs to the interior support of \(Q_0\). After the linear rescaling used in the source proof, one may take \([a,b]=[-c,c]\). Let the prior \(\pi\) satisfy assumptions A1, A2, and A3 with \(\rho\) high enough, as in Assumptions, and let \(g,q_0\) satisfy the working conditions T1–T4, all as in Definitions and notation and Assumptions. Define \(C_j=\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\}\), \(n_j=|C_j|\). For \(X_{C_j}\), let \(X^j_{(r)}\) denote the \(r\)-th order statistic, and define
      \[
      Y^j_{n_j}:=\min[1,\; n_j(\log n)^{\frac1{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}].
      \]
      Let \(N_j\) be the fixed integer threshold furnished by Lemma \ref{denom}, and define
      \[
      \Omega_n=\{\text{for every }j=1,\dots,t:\ n_j\ge N_j,\; Y^j_{n_j}\in[1/2,1]\}.
      \]
      Then, under \(X_{1:\infty}\sim P^{(\infty)}\),
      \[
      \mathbb E\left\{\mathbbm{1}_{\Omega_n}\sum_{s=1}^{n-t}\frac{\operatorname{pr}(K_n=t+s\mid X_{1:n})}{\operatorname{pr}(K_n=t\mid X_{1:n})}\right\}\to 0
      \qquad\text{as }n\to\infty.
      \]
    assumptions:
      - |-
        The model and data-generating mechanism are as in Definitions and notation. The prior \(\pi\) satisfies:

        A1: \(\pi\) is absolutely continuous with respect to Lebesgue measure, with density still denoted by \(\pi\).

        A2: there exist \(\epsilon,\delta,\beta>0\) such that for every \(\alpha\in(0,\epsilon)\),
        \[
        \frac1\delta\alpha^\beta\le \pi(\alpha)\le \delta\alpha^\beta.
        \]

        A3: there exist \(D,\nu,\rho>0\) such that for every \(s\ge1\),
        \[
        \int \alpha^s\pi(\alpha)\,d\alpha < D\rho^{-s}\Gamma(\nu+s+1).
        \]
        Here A2’s \(\epsilon,\delta,\beta\) and A3’s \(D,\nu,\rho\) are existential constants for the fixed prior \(\pi\); A3 is required for every \(s\ge1\), and \(\rho\) is the quantity required to be high enough.

        The source condition is that \(\pi\) satisfies A1–A3 with \(\rho\) high enough. The source records that the expectation bound used in the proof tends to \(0\) once
        \[
        \rho>\frac{2CUp^{*}}{m},
        \]
        where \(m,M\) come from T1, \(U\) from T3, \(C=2^2\zeta(2)<7\), and \(p^{*}=\min_j p_j\). The exact threshold and exact dependency order are left unspecified; the minimum value of \(\rho\) needed depends on the specific function \(g\) and prior distribution \(Q_0\), and earlier on the specific choice of \(P\) in the data-generating mechanism and \(k\). It is not a single \(\rho\) uniform over \(P,t,\theta^*,k,q_0,\pi\).

        After the rescaling \([a,b]=[-c,c]\), the working conditions are:

        T1: there exist \(m,M\) such that
        \[
        0<m\le g(x)\le M<\infty
        \]
        for every \(x\in[-c,c]\).

        T2: \(g\) is differentiable on \((-c,c)\), and there exists \(R\) such that
        \[
        \left|\frac{g'(x)}{g(x)}\right|\le R<\infty
        \]
        for every \(x\in(-c,c)\).

        T3: there exists \(U>0\) such that
        \[
        h(y)=q_0(y)+q_0(-y)\le U
        \]
        for every \(y\in[0,2c]\).

        T4: there exists \(L>0\) such that \(q_0(\theta)\ge L\) for every \(\theta\) in a neighborhood of \(\theta_j^*\), for every \(j\).

        The supplied pages do not show the derivation of T1–T4 from B1–B3; accordingly, T1–T4 are the operative rescaled assumptions used here.
    proof_body: |-
      ### Definitions and notation used in Proof
      Let \(C^{(n)}=\{n_j>0\text{ for every }j\}\). Let \(K>0\) be the constant furnished by Lemma \ref{denom}. For \(A_j\in\tau_{s_j}(n_j)\), write \(A_j=(A^j_1,\dots,A^j_{s_j})\) and \(a^j_k=|A^j_k|\). Set
      \[
      \mathbf S=\left\{(s_1,\dots,s_t):1\le s_j\le n_j\ \forall j,\ \sum_{j=1}^t s_j=s\right\}.
      \]
      Define
      \[
      \begin{aligned}
      T^{(n)} :={}& \frac{2^t\sqrt{\log(n)}}{K}\sum_{\mathbf s}\prod_{j=1}^t
      \sum_{A_j\in\tau_{s_j}(n_j)}
      n_j\frac{\prod_{k=1}^{s_j}(a^j_k-1)!}{(n_j-1)!}
      \prod_{h=1}^{s_j}\int_{\mathbb R}\prod_{i\in A^j_h}
      \frac{g(X_i-\theta_h)}{g(X_i-\theta_j^*)}\,Q_0(\mathrm d\theta_h)\mathbbm 1_{\Omega_n}.
      \end{aligned}
      \]
      Define the prior-integral factor
      \[
      C(n,t,t+s)
      :=
      \frac{\displaystyle\int_0^\infty \frac{\alpha^{t+s}}{\alpha^{(n)}}\,\pi(\alpha)\,d\alpha}
      {\displaystyle\int_0^\infty \frac{\alpha^{t}}{\alpha^{(n)}}\,\pi(\alpha)\,d\alpha}.
      \]
      This factor is denoted \(C(n,t,t+s)\) in the source; it is not the data-dependent set \(C_j\) nor the event \(C^{(n)}\). Let \(\tilde{\tau}_s(n)\) denote the partitions of \(\{1,\dots,n\}\) whose every block is contained in one of the \(C_j\). The symbol \(R(n,t,t+s)\) in the final display is the data-dependent summand appearing in the source; its explicit displayed definition is not reproduced in the supplied excerpt.

      Write
      \[
      \underline{\Pi}_n:=\Pi_n(K_n<t),\qquad
      \overline{\Pi}_n:=\Pi_n(K_n>t),\qquad
      Z_n:=\sum_{s=1}^{n-t}\frac{\Pi_n(t+s)}{\Pi_n(t)}.
      \]
      On the event \(\Pi_n(t)>0\),
      \[
      \Pi_n(t)=\left(1+\sum_{s\ne t}\frac{\Pi_n(s)}{\Pi_n(t)}\right)^{-1}.
      \]

      ### Proof
      From the upper bound established immediately before Lemma \ref{lemma:consGeneral} (equation (upper_bound_ratios)), for each fixed \(s\) the corresponding posterior-ratio term is bounded by \(\mathbb E\{T^{(n)}\}\). Applying [ref:R1] we can upper bound this expectation as follows
      \[
      \begin{aligned}
      \mathbb E\{T^{(n)}\}
      &\leq \frac{2^t\sqrt{\log(n)}}{K}\left(\frac{U}{m}\right)^s
      \sum_{\mathbf{s}}\prod_{j=1}^t
      \sum_{A_j\in\tau_{s_j}(n_j)}
      \frac{n_j}{(n_j-1)!\prod_{k=1}^{s_j}(a_k^j+1)}\\
      &\leq \frac{2^t\sqrt{\log(n)}}{K}\left(\frac{U}{m}\right)^s
      \sum_{\mathbf{s}}\prod_{j=1}^t\frac{1}{s_j!}
      \sum_{\mathbf{a}_j\in\mathcal F_{s_j}(n_j)}
      \left(\frac{n_j}{\prod_{k=1}^{s_j}a_k^j}\right)^2,
      \end{aligned}
      \]
      where the last inequality follows from [ref:R2]. Moreover, from [ref:R3] we have
      \[
      \sum_{\mathbf{a}_j\in\mathcal F_{s_j}(n_j)}
      \left(\frac{n_j}{\prod_{k=1}^{s_j}a_k^j}\right)^2 < C^{s_j},
      \]
      with constant \(C<7\). Thus
      \[
      \mathbb E\{T^{(n)}\}
      \leq \frac{2^t\sqrt{\log(n)}}{K}\left(\frac{UC}{m}\right)^s
      \sum_{\mathbf{s}}\prod_{j=1}^t\frac{1}{s_j!}.
      \]
      Moreover, from [ref:R4] and \(A3\) we have
      \[
      \begin{aligned}
      C(n,t,t+s)
      &\leq \frac{G\Gamma(t+\beta+1)2^ss}{\epsilon}
      E(\alpha^{t+s-1})\log\{n/(1+\epsilon)\}^{-1}\\
      &\leq \frac{DG\Gamma(t+\beta+1)2^ss}{\epsilon}
      \rho^{-(t+s-1)}\Gamma(\nu+t+s)\log\{n/(1+\epsilon)\}^{-1},
      \end{aligned}
      \]
      for \(n\geq4\). By the preceding bound, combined with [ref:R5], and the last display we finally have
      \[
      \begin{aligned}
      E\biggl\{\mathbbm 1_{\Omega_n}
      &\sum_{s=1}^{n-t}\frac{\operatorname{pr}(K_n=s+t\mid X_{1:n})}{\operatorname{pr}(K_n=t\mid X_{1:n})}\biggr\}
      = \sum_{s=1}^{n-t} C(n,t,t+s)
      E\{\mathbbm 1_{\Omega_n}R(n,t,t+s)\}\\
      &\leq \frac{2^t\rho^{1-t}(U/m)^tDG\Gamma(t+\beta+1)\sqrt{\log(n)}}{K\epsilon\log\{n/(1+\epsilon)\}}
      \underbrace{\sum_{s=1}^{n-1}\frac{s(2CUp^*/m)^s\rho^{-s}\Gamma(\nu+t+s)}{(s+1)!}}_{<\infty}
      \to 0,
      \end{aligned}
      \]
      as \(n\to\infty\), where finiteness follows by taking \(\rho\) sufficiently large (the high-enough \(\rho\) condition recorded in Assumptions).

      ### References
      #### Reference R1
      Target: Lemma \ref{numerator}
      Citation: Applying Lemma \ref{numerator} we can upper bound the expected value of \(T^{(n)}\) in \eqref{upper_bound_ratios} as follows
