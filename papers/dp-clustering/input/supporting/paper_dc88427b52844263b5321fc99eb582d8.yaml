      ##### Lemma \ref{suff_expectation} (Lemma 3 in the main document)
      ###### Definitions and notation
      Let \((X_1,X_2,\ldots)\) be an exchangeable sequence, and write \(X_{1:n}=(X_1,\ldots,X_n)\). The expectation \(E\) is taken with respect to the law of this exchangeable sequence, equivalently the data-generating distribution.

      For integers \(1\le s\le n\), let \(\tau_s(n)\) denote the set of partitions of \(\{1,\ldots,n\}\) into \(s\) nonempty subsets. For
      \[
      A=\{A_1,\ldots,A_s\}\in\tau_s(n),
      \]
      write
      \[
      a_j=|A_j|,\qquad j=1,\ldots,s.
      \]

      Define
      \[
      \mathcal F_s(n)=\left\{\bm a=(a_1,\ldots,a_s)\in\{1,\ldots,n\}^s:\sum_{j=1}^s a_j=n\right\}.
      \]
      For \(\bm a\in\mathcal F_s(n)\), let \(A^{\bm a}\) be an arbitrary partition in \(\tau_s(n)\) such that
      \[
      |A^{\bm a}_j|=a_j,\qquad j=1,\ldots,s.
      \]

      In the mixture setting, for a nonempty block \(A\),
      \[
      m(X_A)=\int\prod_{i\in A}k(X_i\mid\theta)\,Q_0(\mathrm d\theta)
      =\int\prod_{i\in A}k(X_i\mid\theta)\,q_0(\theta)\,\mathrm d\theta,
      \]
      when \(Q_0(\mathrm d\theta)=q_0(\theta)\mathrm d\theta\), and \(m(X_{1:n})=m(X_{\{1,\ldots,n\}})\).

      ###### Assumptions
      The sequence \((X_1,X_2,\ldots)\) is exchangeable. The equality is stated for every \(n\), with \(1\le s\le n\) so that \(\tau_s(n)\) is defined. No further hypotheses are printed in the supplied statement.

      ###### Statement
      Under the exchangeability assumption, for every \(n\) and \(1\le s\le n\),
      \[
      \begin{aligned}
      E\left\{\sum_{A\in\tau_s(n)}
      \frac{\prod_{j=1}^s(a_j-1)!}{(n-1)!}
      \frac{\prod_{j=1}^s m(X_{A_j})}{m(X_{1:n})}
      \right\}
      &=
      \sum_{\bm a\in\mathcal F_s(n)}
      \frac{n}{s!\prod_{j=1}^s a_j}
      E\left\{
      \frac{\prod_{j=1}^s m(X_{A^{\bm a}_j})}{m(X_{1:n})}
      \right\},
      \end{aligned}
      \]
      where the sum on the right runs over
      \[
      \mathcal F_s(n)=\left\{\bm a\in\{1,\ldots,n\}^s:\sum_{j=1}^s a_j=n\right\}
      \]
      and \(A^{\bm a}\) is an arbitrary partition in \(\tau_s(n)\) with \(|A^{\bm a}_j|=a_j\) for \(j=1,\ldots,s\).

