      Let \(t\in\mathbb N\). Let \(p_1,\dots,p_t\) be positive weights with \(p_j\in(0,1)\) for every \(j\) and \(\sum_{j=1}^t p_j=1\), and set \(p^*=\min_{j\in\{1,\dots,t\}}p_j\in(0,1)\). For \(j=1,\dots,t\), let \(n_j\) be the integers appearing in the surrounding proof, and for a tuple \(\mathbf s=(s_1,\dots,s_t)\) with \(s=\sum_{j=1}^t s_j\), define \(\mathbf S=\{(s_1,\dots,s_t):s_j\le n_j\ \text{and}\ \sum_{j=1}^t s_j=s\}\). Then
      \[
      \sum_{\mathbf s\in\mathbf S}\frac{s!}{\prod_{j=1}^t s_j!}
      =\sum_{\mathbf s\in\mathbf S}\binom{s}{s_1,\dots,s_t}
      \le(p^*)^{-s}.
      \]
    assumptions: []
    proof_body: |-
      The result follows immediately from
      \[
      \begin{aligned}
      \sum_{\mathbf s \in \mathbf S}\binom{s}{s_1, \dots, s_t}
      &\leq (p^*)^{-s}\sum_{\mathbf s \in \mathbf S}\binom{s}{s_1, \dots, s_t}\prod_{j = 1}^t p_j^{s_j}\\
      & \leq (p^*)^{-s}\sum_{\mathbf s \in R_t}\binom{s}{s_1, \dots, s_t}\prod_{j = 1}^t p_j^{s_j}
      = (p^*)^{-s},
      \end{aligned}
      \]
      where \(R_t = \left\{(s_1, \dots, s_t) \, : \, \sum_{j = 1}^t s_j = s \right\}\), since the sum on the right-hand side is the sum of the probabilities over all the possible values of a multinomial distribution with parameters \((s, p_1, \dots, p_t)\).
