      The lemma statement as supplied displays only $s_j\le n_j$; the surrounding proof’s set $\mathbf S$ has the additional lower bound $1\le s_j\le n_j$. The source proof later displays a factor $(2CUp^*/m)^s$, which for $0<p^*<1$ has the opposite $p^*$-direction from the lemma’s $(p^*)^{-s}$; this is a source ambiguity/possible typo, and the lemma statement itself is as recorded.

      Parent-task shared reading context. References here to the selected target, its proof or its dependencies describe the parent consumer, not this fixed target. Do not automatically import the parent's hypotheses, dependency list or conclusions. Preserve relevant definitions and any original source conditions explicitly applying to this result, including conditions inherited by its own source section or appendix; distinguish those from assumptions used only by the parent:
      Dirichlet process mixture model: $X_i\mid\theta_i\simind k(\cdot\mid\theta_i)$, $\theta_i\mid\widetilde P\simiid\widetilde P$, $\widetilde P\mid\alpha\sim\operatorname{DP}(\alpha,Q_0)$, $\alpha\sim\pi$, with $k(\cdot\mid\theta)$ a density and $Q_0$ a baseline on $(\mathbb X,\mathcal X)$. For $n,s\in\mathbb N$ with $s\le n$, $\tau_s(n)$ is the set of partitions of $\{1,\dots,n\}$ into $s$ nonempty subsets; conditionally on $\alpha$, $\operatorname{pr}(A\mid\alpha)=\frac{\alpha^s}{\alpha^{(n)}}\prod_{j=1}^s(a_j-1)!$ for $A=\{A_1,\dots,A_s\}\in\tau_s(n)$, with $\alpha^{(n)}=\alpha(\alpha+1)\cdots(\alpha+n-1)$, $a_j=|A_j|$. $K_n$ is the number of clusters, $\Pi_n(B)=\operatorname{pr}(K_n\in B\mid X_{1:n})$, $\Pi_n(t)=\operatorname{pr}(K_n=t\mid X_{1:n})$. Marginal likelihood for a nonempty block: $m(X_A)=\int\prod_{i\in A}k(X_i\mid\theta)\,Q_0(d\theta)=\int_{\mathbb R}\prod_{i\in A}g(X_i-\theta)q_0(\theta)\,d\theta$ under $k(x\mid\theta)=g(x-\theta)$, $Q_0(d\theta)=q_0(\theta)d\theta$.

      Data-generating mechanism: $X_i\simiid P=\sum_{j=1}^t p_jR_j$, $i=1,2,\dots$, $t\ge1$, $R_j$ distinct probability measures, $p_j\in(0,1)$, $\sum_j p_j=1$; product laws $P^{(n)}$ on $\mathbb X^n$ and $P^{(\infty)}$ on $\mathbb X^\infty$, $X_{1:\infty}\sim P^{(\infty)}$. True component densities $f_j(\cdot)=f(\cdot\mid\theta_j^*)=k(\cdot\mid\theta_j^*)$. True parameter vector $\theta^*=(\theta_1^*,\dots,\theta_t^*)$ completely separated: $|\theta_j^*-\theta_k^*|>b-a$ $(j\ne k)$, each $\theta_j^*$ in the interior support of $Q_0$; after linear rescaling take $[a,b]=[-c,c]$, so complete separation means $|\theta_j^*-\theta_k^*|>2c$. The support interval comes from B1; the supplied pages do not expand B1–B3.

      Prior assumptions: A1 $\pi$ absolutely continuous with density $\pi$. A2 there exist $\epsilon,\delta,\beta>0$ with $\frac1\delta\alpha^\beta\le\pi(\alpha)\le\delta\alpha^\beta$ for every $\alpha\in(0,\epsilon)$. A3 there exist $D,\nu,\rho>0$ with $\int\alpha^s\pi(\alpha)\,d\alpha<D\rho^{-s}\Gamma(\nu+s+1)$ for every $s\ge1$. The source requires $\pi$ to satisfy A1–A3 with $\rho$ “high enough”; the exact threshold is not specified. A supplied sufficient condition has the form $\rho>\frac{2CUp^*}{m}$, with $m,M$ from T1, $U$ from T3, $C=2^2\zeta(2)<7$, $p^*=\min_j p_j$; because the selected proof’s final display writes the opposite $p^*$-direction in $(2CUp^*/m)^s$, the exact quantitative threshold is not settled by the excerpt. The constants $\epsilon,\delta,\beta,D,\nu,\rho$ are existential for the fixed prior and not uniform over $P,t,\theta^*,g,q_0,\pi$.

      Working conditions after rescaling $[a,b]=[-c,c]$: T1 there exist $m,M$ with $0<m\le g(x)\le M<\infty$ for every $x\in[-c,c]$. T2 $g$ differentiable on $(-c,c)$ and there exists $R$ with $|g'(x)/g(x)|\le R<\infty$ for every $x\in(-c,c)$. T3 there exists $U>0$ with $h(y)=q_0(y)+q_0(-y)\le U$ for every $y\in[0,2c]$. T4 there exists $L>0$ with $q_0(\theta)\ge L$ for every $\theta$ in a neighborhood of $\theta_j^*$, for every $j$. The supplied pages do not derive T1–T4 from B1–B3; they are the operative rescaled working assumptions in the selected proof.

      Notation: $C_j=\{i\in\{1,\dots,n\}:X_i\in[\theta_j^*+a,\theta_j^*+b]\}$, $n_j=|C_j|$; $X^j_{(r)}$ the $r$-th order statistic of $X_{C_j}$; $Y^j_{n_j}:=\min[1,\ n_j(\log n)^{\frac1{2t}}\{c+\theta_j^*-X^j_{(n_j)}\}]$; $N_j$ the fixed integer threshold furnished by Lemma \ref{denom}; $\Omega_n=\{\text{for every }j=1,\dots,t:\ n_j\ge N_j,\ Y^j_{n_j}\in[1/2,1]\}$. The exact dependence and values of $N_j$ are not supplied. The logarithm base in $Y^j_{n_j}$ is not stated; any fixed base changes only constants and no uniformity in the base is claimed.

      Posterior-ratio conventions: the ratios $\frac{\operatorname{pr}(K_n=t+s\mid X_{1:n})}{\operatorname{pr}(K_n=t\mid X_{1:n})}$ are read as $0$ when the denominator posterior probability is $0$; the two conventions differ only on $\{\Pi_n(t)=0\}$, a set of $P^{(n)}$-probability tending to zero. Prior-integral factor $C(n,t,t+s):=\frac{\int_0^\infty\frac{\alpha^{t+s}}{\alpha^{(n)}}\pi(\alpha)\,d\alpha}{\int_0^\infty\frac{\alpha^{t}}{\alpha^{(n)}}\pi(\alpha)\,d\alpha}$, distinct from the event $C^{(n)}$, the sets $C_j$, and the combinatorial constant $C<7$. $R(n,t,t+s)$ in the selected proof’s final display is a data-dependent summand whose explicit displayed definition is not reproduced in the supplied excerpt. For $p>1$, $C_p=2^p\zeta(p)$, $\zeta(p)=\sum_{a=1}^\infty a^{-p}$; in the target application $p=2$, $C_2=4\zeta(2)<7$, and the source proof writes the resulting combinatorial bound with a constant $C<7$.

      Expectations and convergence scope: $\mathbb E$ in the target conclusion is under $X_{1:\infty}\sim P^{(\infty)}$, equivalently under $P^{(n)}$ for $X_{1:n}$; the expectations $\mathbb E(\alpha^{t+s-1})$ in Corollary \ref{cor_C} are prior expectations with respect to $\pi$. The asymptotic statement fixes $t$, the weights $p_j$, the data law $P$, $\theta^*$, $g$, $q_0$, and the prior $\pi$ before letting $n\to\infty$; it is not claimed uniform in these objects. The exponent $1/(2t)$ and constants such as $2^t$ and $K$ depend on the fixed $t$.

      Formalization clarifications from source and proof:
      1. Constants and quantifiers. The target result fixes the configuration before n→∞: t, the weights p_j, the data law P, θ*, g, q0, and π are fixed, and then n grows. The A1–A3 constants ε,δ,β,D,ν,ρ are existential for the fixed prior π; A3 is required “for every s≥1,” and ρ is only required to be “high enough.” The source does not give a uniform threshold: the main text says the minimum ρ depends on the specific P and k, while the supplied target notes additionally mention dependence on g and Q0; the exact dependency order and threshold are expressly left unspecified. In particular, do not formalize a single ρ that works uniformly over t, P, θ*, g, q0, π, or the random sample; an implicit Lean parameter does not make such a constant uniform. Constants attached to T1–T4 are fixed by the fixed rescaled data-generating/kernel setup: m,M from T1 depend on g and c; R from T2 on g and c; U from T3 on q0 and c; L from T4 on q0 and the finite θ* (the statement gives one L for all j, with N_j allowed to depend on j). The constants from Lemma \ref{denom} are fixed thresholds: K>0 is the denominator-lower-bound constant used in T^(n), and N_j is a fixed integer threshold, generally depending on j and the local neighborhood of θ_j*; the selected source explicitly says the exact constants and dependence of N_j are not printed beyond n_j≥N_j and Y^j_{n_j}∈[1/2,1]. The supplied proof of Lemma \ref{denom} suggests K=(2Le^{-R})^t, hence dependence on L,R,t, but it also contains an exponent inconsistency in the printed lower bound (K^{1/t} versus K^{1/(2t)}); use only the source-asserted positive constant K unless that proof detail is separately authorized. In R3/Lemma \ref{induction}, C_p=2^p ζ(p), and the target’s C<7 means C=C_2=4ζ(2)<7; R3 is a universal lemma for every p>1 and integers s≥2,n≥s, whereas the target applies p=2. The target proof applies the C^{s_j} bound even when s_j=1, but the printed R3 statement only covers s≥2; that is a source gap/edge case, not an expl