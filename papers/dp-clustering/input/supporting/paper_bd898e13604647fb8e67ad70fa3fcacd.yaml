      Formalization clarifications from source and proof:
      All notes below concern the selected Lemma \ref{bound_sum}, the multinomial-sum bound, and its proof context. No external cited result is used by this selected lemma; the only auxiliary probabilistic fact is the standard total mass one of a multinomial distribution.

      1. Constants and quantifier order. The only constant in the selected lemma is \(p^*=\min_j p_j\), which is a deterministic function of the dimension \(t\) and the weight vector \((p_1,\dots,p_t)\); it is not an absolute constant and is not uniform over \(t\), the weights, the integers \(n_j\), the total \(s\), or any sample. The intended order is: fix \(t\), fix the weights with \(p_j>0\) and \(\sum_j p_j=1\), fix the integers \(n_j\), fix \(s\), define \(\mathbf S\), then prove the bound. The proof’s line “\(\leq (p^*)^{-s}\sum_{\mathbf s}\binom{s}{s_1,\dots,s_t}\prod_j p_j^{s_j}\)” and its use of “the sum of the probabilities over all the possible values of a multinomial distribution with parameters \((s,p_1,\dots,p_t)\)” show that \(p^*\) is tied to \(p_j\) through the product weights, not an independent parameter. In the surrounding theorem \(t\) and the weights are fixed before \(n\to\infty\); the integers \(n_j\) are group-count random variables there, but the selected combinatorial lemma itself is pointwise for each realized tuple of \(n_j\). An implicit Lean parameter for \(p^*\) must therefore be computed from the weight vector and \(t\), not imposed as uniform. The printed hypothesis \(p_j\in(0,1)\) with \(p^*\in(0,1)\) does not by itself cover the \(t=1\) case allowed in parts of the surrounding theorem; the excerpt leaves that edge not resolved.

      2. Norms and mathematical objects. The selected lemma uses no Euclidean, sup, operator, Frobenius, or normalized norm. Its objects are scalar weights, integers, factorials, multinomial coefficients, and the finite index sets \(\mathbf S\subset R_t\); \(p^*\) is a minimum of weights, not a norm. The coefficient \(s!/\prod_j s_j!\) is exactly the multinomial coefficient for nonnegative integer components summing to \(s\). The proof’s “\(R_t=\{(s_1,\dots,s_t):\sum_j s_j=s\}\)” omits the nonnegative-integer side condition, but the subsequent multinomial-probability interpretation requires it. The set \(\mathbf S\) must not be replaced by \(R_t\); the proof only uses \(\mathbf S\subseteq R_t\). In the surrounding proof, \(n_j=|C_j|\) are cardinalities of data groups, but the selected lemma itself treats them as given integers and does not define their distribution.

      3. Asymptotics. The selected lemma contains no \(O\), \(o\), \(O_P\), \(o_P\), probability-limit, or asymptotic filter. It is an exact finite inequality; the right-hand side \( (p^*)^{-s}\) may grow with \(s\) and is not claimed to be \(o(1)\) or uniform in \(s,n_j,t\), or the weights. The proof’s equality is the exact multinomial total-probability identity. In the parent application, convergence in \(n\) and expectations are supplied later by other results; they are not consequences of this lemma alone. The source does not state any uniformity when \(t\), the weights, or the \(n_j\) vary with \(n\).

      4. Potentially omitted definitions and side conditions. The selected displayed statement says only \(s_j\le n_j\), while the surrounding proof defines \(\mathbf S=\{(s_1,\dots,s_t):1\le s_j\le n_j\ \forall j,\ \sum_j s_j=s\}\). Thus the lower bound \(1\le s_j\) is explicit in the application context but omitted in the selected statement as recorded; the excerpt leaves the standalone zero/lower-bound convention unresolved. Irrespective of that display, the factorial and multinomial coefficient require nonnegative integer components, and the proof’s multinomial outcome space requires \(\sum_j s_j=s\) with all \(s_j\ge0\). The source does not discuss the empty-\(\mathbf S\) case. The weights satisfy \(p_j>0\) and \(\sum_j p_j=1\), and \(p^*=\min_j p_j\) is printed as belonging to \((0,1)\); as noted, the \(t=1\) edge is not cleanly covered by those printed inequalities. The proof uses no other measure or random vector beyond the auxiliary multinomial distribution, and no cited external theorem.
