      2. Norms and mathematical objects. The target theorem uses no Euclidean, operator, sup, Frobenius, or normalized norm. Distances are ordinary absolute value on R: complete separation is the strict inequality |θ_j^*-θ_k^*|>b−a, which after the source rescaling is >2c, not ≥. Cardinalities |A| and |C_j| are set sizes. C_j is the closed interval set {i:X_i∈[θ_j^*+a,θ_j^*+b]}, after rescaling [θ_j^*−c,θ_j^*+c]; do not replace it by a ball or an abstract neighborhood. X^j_(r) is the r-th order statistic of the scalar list X_{C_j}, and Y^j_{n_j}=min[1,n_j(log n)^{1/(2t)}{c+θ_j^*−X^j_(n_j)}] uses the maximum order statistic, not a norm or absolute value; the exponent is 1/(2t), not 1/2 or 1/(2t+something). The logarithm base is not stated; any fixed base only changes constants, but no uniformity in the base is claimed. On Ω_n the source imposes n_j≥N_j and Y^j_{n_j}∈[1/2,1]. The kernel object is the location family k(x|θ)=g(x−θ) on R after rescaling; B1 gives g positive on [a,b] and zero elsewhere, so after rescaling its support is [−c,c] and its total mass is 1. T1–T4 are the operative rescaled working assumptions; the supplied pages do not derive T1–T4 from B1–B3, and T4’s local lower bound on q0 is not an explicit consequence of B3 plus “θ_j^* belongs to the interior support of Q0” in this excerpt, so do not drop it. The marginal likelihood m(X_A) is ∫∏_{i∈A}k(X_i|θ)Q0(dθ); under the location kernel and Q0(dθ)=q0(θ)dθ this is ∫∏g(X_i−θ)q0(θ)dθ. Later occurrences of Q0(dθ_h) in R1/T^(n) are the same object under B3, not a new measure. Blocks are nonempty; τ_s(n) partitions {1,...,n}; in the grouped step τ_{s_j}(n_j) partitions C_j identified with {1,...,n_j}. The surrounding proof’s S has 1≤s_j≤n_j, while R5’s lemma statement prints only s_j≤n_j; preserve the proof context when applying the multinomial bound. R1/Lemma \ref{numerator} is printed with a dimensionally odd product of integrals over R^{s_j} with scalar θ_h; the proof and the defining T^(n) in \eqref{upp