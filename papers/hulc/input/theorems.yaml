      ##### Content basis
      Source extraction. The cited result is stated in D2 (`main.tex`), Section 2.1, as Lemma \(\ref{lem:fixed-B-coverage-result}\), attributed to Kuchibhotla, Balakrishnan, and Wasserman in *The HulC: Confidence Regions from Convex Hulls*. The source passage states the bound used in the Citation for the two noncoverage probabilities with \(B_{\alpha,\Delta}-1\) and \(B_{\alpha,\Delta}\) estimators, and hence for the overcoverage inequality. The exact-coverage conclusion in the current theorem is not supplied by this lemma; the supplied source states exact coverage as part of its Theorem 1, which is the current target itself, so it is not imported here as an external premise. The lemma’s proof is relegated in the source to the supplement, Section \(\ref{appsec:fixed-B-coverage-result}\).

      ##### Lemma \(\ref{lem:fixed-B-coverage-result}\)
      ###### Definitions and notation
      Suppose \(\theta_0\in\mathbb{R}\) is a parameter or functional of interest. For \(B\ge1\), let \(\widehat{\theta}_1,\ldots,\widehat{\theta}_B\) be independent estimators of \(\theta_0\). Define the median bias of the estimator \(\widehat{\theta}_j\) for \(\theta_0\) as
      \begin{equation}\label{definition:median-bias}
      \operatorname{Med-Bias}_{\theta_0}(\widehat{\theta}_j) := \left(\frac{1}{2} - \min\left\{\mathbb{P}(\widehat{\theta}_j-\theta_0\ge0),\,\mathbb{P}(\widehat{\theta}_j-\theta_0\le0)\right\}\right)_+,
      \end{equation}
      where \((x)_+=\max\{x,0\}\) for any \(x\in\mathbb{R}\). From the definition, \(\operatorname{Med-Bias}_{\theta_0}(\widehat{\theta}_j)\) lies in \([0,1/2]\).

      For the lemma, the parameter \(\Delta\) is defined by
      \begin{equation}\label{eq:delta-definition-main-lemma}
      \Delta := \max_{1\le j\le B}\operatorname{Med-Bias}_{\theta_0}(\widehat{\theta}_j)\in[0,1/2].
      \end{equation}

      The right-hand side of the lemma is denoted in the source, for any \(B\ge1\) and \(\Delta\ge0\), by
      \begin{equation}\label{eq:miscoverage-function-B-Delta}
      P(B;\Delta) := \left(\frac{1}{2}-\Delta\right)^B + \left(\frac{1}{2}+\Delta\right)^B.
      \end{equation}

      ###### Assumptions
      Let \(B\ge1\), let \(\theta_0\in\mathbb{R}\), and let \(\widehat{\theta}_1,\ldots,\widehat{\theta}_B\) be independent random variables serving as estimators of \(\theta_0\). Let
      \[
      \Delta := \max_{1\le j\le B}\operatorname{Med-Bias}_{\theta_0}(\widehat{\theta}_j)\in[0,1/2],
      \]
      where \(\operatorname{Med-Bias}_{\theta_0}(\widehat{\theta}_j)\) is defined by \(\eqref{definition:median-bias}\).

      ###### Statement
      If \(\widehat{\theta}_j\), \(1\le j\le B\), are independent random variables and
      \begin{equation}\label{eq:delta-definition-main-lemma-restated}
      \Delta := \max_{1\le j\le B}\operatorname{Med-Bias}_{\theta_0}(\widehat{\theta}_j)\in[0,1/2],
      \end{equation}
      then
      \[
      \mathbb{P}\left(\theta_0\notin\left[\min_{1\le j\le B}\widehat{\theta}_j,\,\max_{1\le j\le B}\widehat{\theta}_j\right]\right)\le \left(\frac{1}{2}-\Delta\right)^B+\left(\frac{1}{2}+\Delta\right)^B.
      \]
