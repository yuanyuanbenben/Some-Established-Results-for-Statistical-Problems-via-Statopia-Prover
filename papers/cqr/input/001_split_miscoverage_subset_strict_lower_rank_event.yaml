  lean_namespace: Statlib.Workspace.Conformal
  target_dir: ProverJobs
  allow_axiom: false
theorems:
  - id: cqr.001.split_miscoverage_subset_strict_lower_rank_event
    title: "Split conformal miscoverage implies held-out lower-rank event"
    kind: theorem
    lean_name: cqr_001_split_miscoverage_subset_strict_lower_rank_event
    lean_namespace: Statlib.Workspace.Conformal
    priority: 1
    layer: conformal-rank-event-reduction
    target_file: ProverJobs/cqr_001_split_miscoverage_subset_strict_lower_rank_event/Main.lean
    dependencies:
      - statlib.Statlib.StatFoundation.Vocabulary.Conformal.ScoreMiscoveredBy
      - statlib.Statlib.StatFoundation.Vocabulary.Conformal.StrictLowerRankEvent
      - statlib.Statlib.StatFoundation.Vocabulary.Conformal.HasAtLeastKCalibrationScoresLE
      - statlib.Statlib.StatFoundation.Vocabulary.Conformal.calibrationLECount
      - statlib.Statlib.StatFoundation.Vocabulary.Conformal.appendCalibrationTestScoreProcess
      - statlib.Statlib.StatFoundation.Vocabulary.Conformal.calibrationTestLastIndex
    imports:
      - Statlib
    latex_statement: |
      Let \(S_1,\ldots,S_n\) be calibration scores with \(0<n\), and let
      \(S_{n+1}\) be a held-out score.  If the conformal threshold \(\widehat q\)
      has at least \(k\) calibration scores below it, then the miscoverage event
      \(S_{n+1}>\widehat q\) is contained in the event that at least \(k\)
      calibration scores are strictly smaller than the held-out score.
    assumptions:
      - "`hn : 0 < n` is an explicit regularity hypothesis for the calibration sample size."
      - Do not add any further hypotheses beyond the theorem_shape.
    proof_block:
      theorem_shape: |
        import Statlib

        open Statlib.StatFoundation.Vocabulary

        namespace Statlib.Workspace.Conformal

        theorem cqr_001_split_miscoverage_subset_strict_lower_rank_event {Ω : Type*} {n k : ℕ}
            (hn : 0 < n) (calScore : Fin n → Ω → ℝ) (newScore threshold : Ω → ℝ)
            (hquantile : HasAtLeastKCalibrationScoresLE calScore threshold k) :
            ScoreMiscoveredBy newScore threshold ⊆
              StrictLowerRankEvent
                (appendCalibrationTestScoreProcess calScore newScore)
                (calibrationTestLastIndex n) k := by
          sorry

        end Statlib.Workspace.Conformal
    proof_body: |
      DIRECT DEPTH-0 REPLACEMENT PROOF.  Replace the single `sorry` with exactly
      the Lean code below.  First try this proof verbatim with `replace_sorry`;
      do not call search, do not use leansearch, and do not introduce helper
      theorems or extra assumptions.

      Statement-integrity guard: `hn : 0 < n` is already an explicit
      regularity hypothesis in the YAML theorem_shape. Do not add any further
      hypothesis.

      ```
      intro ω hmis
      dsimp [ScoreMiscoveredBy] at hmis
      dsimp [StrictLowerRankEvent]
      unfold strictLowerScoreCount
      have hle : k ≤ calibrationLECount (fun i => calScore i ω) (threshold ω) := hquantile ω
      refine le_trans hle ?_
      unfold calibrationLECount
      refine Finset.card_le_card_of_injOn (fun i : Fin n => Fin.castSucc i) ?maps ?inj
      · intro i hi
        simp only [Finset.mem_coe, Finset.mem_filter, Finset.mem_univ, true_and] at hi ⊢
        dsimp [appendCalibrationTestScoreProcess]
        have hleft :
            appendCalibrationTestScore (fun j => calScore j ω) (newScore ω) (Fin.castSucc i) =
              calScore i ω := by
          unfold appendCalibrationTestScore
          simp
        have hright :
            appendCalibrationTestScore (fun j => calScore j ω) (newScore ω)
                (calibrationTestLastIndex n) =
              newScore ω := by
          unfold appendCalibrationTestScore calibrationTestLastIndex
          simp
        rw [hleft, hright]
        exact lt_of_le_of_lt hi hmis
      · intro i _ j _ hij
        exact Fin.castSucc_injective n hij
      ```

      Meaning of the node: this is the pointwise reduction from score
      miscoverage to a strict lower-rank event.  It only unfolds reusable
      Statlib vocabulary and uses the empirical-quantile count condition
      `hquantile`; no probability, measurability, exchangeability, or CQR
      algorithm facts belong in this node.
    acceptance:
      - lake build passes
      - theorem contains no sorry/admit/axiom
      - no hypotheses are added beyond the theorem_shape
