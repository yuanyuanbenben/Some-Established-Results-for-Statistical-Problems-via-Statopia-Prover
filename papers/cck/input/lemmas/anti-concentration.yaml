    latex_statement: |-
      The ambient space is \(\mathbb R^p\), with coordinatewise maximum \(\max_{1\le j\le p}\). For \(1\le j\le p\), write \(\sigma_j:=\sqrt{\mathbb E[X_j^2]}\). The Lévy concentration function is
      \[
      \mathcal L(\xi,\epsilon)=\sup_{x\in\mathbb R}\Pr(|\xi-x|\le\epsilon),\qquad \epsilon>0
      \]
      (attributed to RV09, Definition 3.1). For real numbers \(u,v\), \(u\vee v:=\max\{u,v\}\). A centered Gaussian random vector means a jointly Gaussian vector with mean zero; no independence between its coordinates is assumed.

      <!-- formalization-clarifications:v1:0ab0db226ca428cd3bed7031871598939b9d9a3441a28be2d3106a3c3c233f3b -->
      Formalization clarifications from source and proof:
      1. Constants and quantifier order. In the target “Anti-concentration” theorem, the intended reading is: fix the finite dimension \(p\) and a centered jointly Gaussian vector \(X=(X_1,\dots,X_p)\) with \(\sigma_j^2=\mathbb E[X_j^2]>0\), then state the corresponding bound for every \(\epsilon>0\). In case (i), \(4\) is an absolute numerical constant; there is no hidden constant depending on \(p\), \(X\), \(\epsilon\), or \(a_p\), while the displayed denominator \(\sigma\) is part of the bound. In case (ii), the source says “where \(C>0\) depends only on \(\underline{\sigma}\) and \(\overline{\sigma}\).” Thus \(C\) may be chosen after fixing those two numerical values; it is not allowed to depend on \(\epsilon\), the center \(x\) used in the supremum defining \(\mathcal L\), \(a_p\), correlations, or \(p\) except through the min/max standard deviations. The proof exhibits an admissible \(C\) of the form \(C_1=4C_0/\underline{\sigma}+1/\underline{\sigma}\), with \(C_0\) depending only on \(\overline{\sigma}/\underline{\sigma}\), so uniformity over \(\epsilon\) and over vectors sharing the same \(\underline{\sigma},\overline{\sigma}\) is proof-based and consistent with the statement. The quantity \(a_p=\mathbb E[\max_j X_j/\sigma_j]\) is not a universal constant; it is fixed by \(X\) and may depend on \(p\), the covariance, and the distribution. An implicit Lean parameter \(p\) or \(X\) does not make \(a_p\) uniform. The source theorem itself does not explicitly write “for every \(p\),” but the finite-coordinate notation and the proof’s handling of the one-coordinate case make \(p\ge1\) a natural side condition; this is a proof-based reading, not a separately stated hypothesis in the theorem.

      2. Norms and mathematical objects. The ambient space is ordinary \(\mathbb R^p\), and \(\max_{1\le j\le p}X_j\) is the coordinatewise maximum of the displayed real coordinates, not \(\max_j|X_j|\), not a Euclidean or operator norm, and not a Frobenius norm. The only norms/absolute values explicitly used in the target statement are the real absolute value in the Lévy concentration function, \(\mathcal L(\xi,\epsilon)=\sup_{x\in\mathbb R}\Pr(|\xi-x|\le\epsilon)\), and the ordinary absolute value in the proof. Here the supremum is over a real center \(x\), not over vectors. The quantities \(\sigma_j=\sqrt{\mathbb E[X_j^2]}\) are standard deviations, not variances; \(\underline{\sigma}\) and \(\overline{\sigma}\) are the min and max of the positive standard deviations, not eigenvalues or diagonal variance entries. The standardized coordinates are \(X_j/\sigma_j\). The object \(a_p\) is \(\mathbb E[\max_j(X_j/\sigma_j)]\), not \(\mathbb E\max_j|X_j|/\sigma_j\) and not an expected \(\ell_2\) or sup norm; replacing it by \(\sqrt{2\log p}\) is only an external worst-case corollary, not the theorem’s definition. “Centered Gaussian” means jointly Gaussian with mean zero; the selected definitions explicitly say no independence of coordinates is assumed. The standard normal objects are \(\phi,\Phi\) as defined in the source, \(y_+=\max\{y,0\}\), and \(N(\mu,1)\) means mean \(\mu\), variance \(1\). For the cited supplemental lemma Y65-1, the objects are a not-necessarily-centered Gaussian vector \(W\) with \(\operatorname{Var}(W_j)=1\) and \(\operatorname{Corr}(W_j,W_k)<1\) for \(j\ne k\); its density formula uses conditional probabilities given \(W_j=x\), understood via the regular conditional distribution. For lemma Y65-2, \(W_0\) has \(\operatorname{Var}(W_0)=1\) and \(\mathbb E[W_0]\ge0\). For the Gaussian concentration lemma thm3, the vector is centered, not assumed independent, and the hypothesis is \(\max_j\mathbb E[X_j^2]\le\sigma^2\). For Mill’s inequality the source uses the standard normal hazard \(\phi(z)/(1-\Phi(z))\) and the bound \(\le 2(z\vee1)\) for all real \(z\); the supplementary reference block gives no confirmed external owner or bibliography beyond the label “Mill’s inequality.” The logarithm is naturally the natural logarithm: the proof uses \(e^{-L}=\epsilon/\underline{\sigma}\) with \(L=\log(\underline{\sigma}/\epsilon)\); the theorem’s notation section does not separately define a log base.

      3. Asymptotics and comparable notation. The target anti-concentration theorem is non-asymptotic: it has no \(O,o,o_{\Pr}\), no limiting filter, no sample-size parameter, and no convergence statement. It gives deterministic inequalities for every positive \(\epsilon\), for each fixed finite \(p\) and each Gaussian vector satisfying the hypotheses. The phrase “dimension-free” in the paper means that the displayed bound involves \(p\) only through \(a_p\) (and in case (ii) through the fixed min/max standard deviations controlling \(C\)); it is not an assertion of a uniform asymptotic limit as \(p\to\infty\) or as \(\epsilon\to0\). In particular, any use of \(p\to\infty\), \(n\to\infty\), or \(o_{\Pr}(1)\) from the multiplier-bootstrap part of the paper must not be imported into this theorem. The probability notation is ordinary \(\Pr\); the concentration function takes a supremum over all real centers \(x\). The source does not define a separate “probability \(O\)” or uniform-in-distribution asymptotic in the selected theorem.

      4. Potentially omitted definitions and side conditions. All random variables are on the probability space fixed in the paper’s Notation section, \((\Omega,\mathcal F,\Pr)\); the anti-concentration theorem itself only uses probabilities, while the density proof uses Lebesgue measure and regular conditional distributions. The hypotheses \(\sigma_j^2=\mathbb E[X_j^2]>0\) ensure \(\underline{\sigma}>0\), and finiteness of \(a_p\) follows in the proof from \(a_p\le \sum_j\mathbb E|N(0,1)|<\infty\). The theorem does not explicitly state \(p\ge1\), but the finite list \(X_1,\dots,X_p\), the minima/maxima, and the proof’s \(q=1\) discussion imply the positive-integer reading. In the proof, before applying lemma Y65-1 the selected proof removes coordinates with correlation \(1\) and relabels the remaining \(q\) coordinates; this is a proof-based reduction, not an additional hypothesis of the theorem, and the original theorem allows arbitrary covariance including perfect positive dependence. The conditional probabilities in Y65-1 and Y65-2 are source-defined through regular conditional distributions; Y65-1 also states absolute continuity with respect to Lebesgue measure. The cited lemmas are universal results in their own right: applications in the target proof do not restrict their hypotheses beyond what each lemma states. Finally, the selected proof contains repaired details for the \(x<0\) branch and an elementary normal-tail bound (5) used in the far tail; these are proof-level devices, not hypotheses of the anti-concentration theorem. The original supplement handles \(x\ge0\) explicitly and says the \(x<0\) case is similar, so the explicit piecewise \(x<0\) construction should be treated as proof-based clarification rather than as independent source evidence.
      <!-- /formalization-clarifications -->

      Define \(\underline{\sigma}:=\min_{1\le j\le p}\sigma_j\), \(\overline{\sigma}:=\max_{1\le j\le p}\sigma_j\), and \(a_p:=\mathbb E[\max_{1\le j\le p}X_j/\sigma_j]\). Let \(\mathcal L\) denote the Lévy concentration function. (i) If the variances are all equal, \(\underline{\sigma}=\overline{\sigma}=\sigma\), then for every \(\epsilon>0\),
      \[
      \mathcal L\left(\max_{1\le j\le p}X_j,\epsilon\right)\le \frac{4\epsilon(a_p+1)}{\sigma}.
      \]
      (ii) If the variances are not equal, \(\underline{\sigma}<\overline{\sigma}\), then for every \(\epsilon>0\),
      \[
      \mathcal L\left(\max_{1\le j\le p}X_j,\epsilon\right)\le C\epsilon\left\{a_p+\sqrt{1\vee\log(\underline{\sigma}/\epsilon)}\right\},
      \]
      where \(C>0\) depends only on \(\underline{\sigma}\) and \(\overline{\sigma}\).
    assumptions:
      - All random variables are defined on the probability space fixed in the paper's Notation section. Let \(X=(X_1,\dots,X_p)^T\) be a centered Gaussian random vector in \(\mathbb R^p\), and suppose that \(\sigma_j^2:=\mathbb E[X_j^2]>0\) for all \(1\le j\le p\).
    proof_body: |-
      ### Definitions and notation used in Proof
      The standard normal density is
      \[
      \phi(x)=\frac{1}{\sqrt{2\pi}}e^{-x^2/2},
      \]
      and its distribution function is
      \[
      \Phi(x)=\int_{-\infty}^x \phi(u)\,du.
      \]
      The notation \(N(\mu,1)\) denotes the normal law with mean \(\mu\) and variance \(1\). For real \(y\), \(y_+=\max\{y,0\}\). Also \(\operatorname{Var}\) and \(\operatorname{Corr}\) denote variance and correlation, respectively.

      ### Proof
      #### Proof of the anti-concentration theorem

      Let
      \[
      M:=\max_{1\le j\le p}X_j,\qquad
      \underline\sigma:=\min_{1\le j\le p}\sigma_j,\qquad
      \overline\sigma:=\max_{1\le j\le p}\sigma_j,
      \]
      and
      \[
      a_p:=\mathbb E\left[\max_{1\le j\le p}\frac{X_j}{\sigma_j}\right].
      \]
      Since \(X\) is centered, \(a_p\ge \mathbb E[X_1/\sigma_1]=0\). Also set
      \[
      \delta:=\frac1{\underline\sigma}-\frac1{\overline\sigma}\ge 0.
      \]
      All quantities \(a_p,\delta,\underline\sigma,\overline\sigma\) are finite, and \(\underline\sigma>0\). Indeed, \(a_p\le\sum_{j=1}^p\mathbb E|X_j|/\sigma_j=\sum_{j=1}^p\mathbb E|N(0,1)|<\infty\).

      We shall use the following source results in the exact forms supplied by the references.

      **Density formula ([ref:R1], Lemma Y65-1).** Let \(V=(V_1,\dots,V_q)\) be a Gaussian vector with \(\operatorname{Var}(V_j)=1\) for all \(j\) and \(\operatorname{Corr}(V_j,V_k)<1\) for \(j\ne k\). Then \(\max_j V_j\) has a density, and a version of it is
      \[
      f_{\max V}(z)
      =\phi(z)\sum_{j=1}^q
      e^{\mathbb E[V_j]z-(\mathbb E[V_j])^2/2}
      \Pr\left(V_k\le z\ \forall k\ne j\mid V_j=z\right).
      \tag{R1}
      \]

      **Monotonicity of the density factor ([ref:R2], Lemma Y65-2).** Let \((V_0,V_1,\dots,V_q)\) be Gaussian with \(\operatorname{Var}(V_j)=1\) for all \(0\le j\le q\), and suppose \(\mathbb E[V_0]\ge0\). Then
      \[
      z\mapsto
      e^{\mathbb E[V_0]z-(\mathbb E[V_0])^2/2}
      \Pr\left(V_j\le z,\ 1\le\forall j\le q\mid V_0=z\right)
      \tag{R2}
      \]
      is non-decreasing on \(\mathbb R\).

      **Gaussian concentration inequality ([ref:R3], Lemma thm3).** If \(Y=(Y_1,\dots,Y_q)\) is a centered Gaussian vector and \(\max_{1\le j\le q}\mathbb E[Y_j^2]\le \sigma^2\), then for every \(r>0\),
      \[
      \Pr\left(\max_{1\le j\le q}Y_j\ge \mathbb E\left[\max_{1\le j\le q}Y_j\right]+r\right)
      \le e^{-r^2/(2\sigma^2)}.
      \tag{R3}
      \]

      **Mill's inequality (cf. [ref:R4]).** For all \(z\in\mathbb R\),
      \[
      \frac{\phi(z)}{1-\Phi(z)}\le 2(z\vee1).
      \tag{R4}
      \]
      For completeness we prove (R4). For \(z>0\) put \(h(z)=\phi(z)/(1-\Phi(z))\). The identity
      \[
      \phi(z)-z(1-\Phi(z))=\int_z^\infty (u-z)\phi(u)\,du
      \]
      shows that \(h(z)\ge z\). Integration by parts gives
      \[
      1-\Phi(z)=\int_z^\infty\phi(u)\,du
      =\frac{\phi(z)}{z}-\int_z^\infty\frac{\phi(u)}{u^2}\,du
      \ge\frac{\phi(z)}{z}-\frac{1-\Phi(z)}{z^2},
      \]
      so \(1-\Phi(z)\ge\frac{z}{1+z^2}\phi(z)\), i.e. \(h(z)\le z+1/z\). Hence
      \[
      h'(z)=\frac{-z\phi(z)(1-\Phi(z))+\phi(z)^2}{(1-\Phi(z))^2}
      =h(z)\bigl(h(z)-z\bigr)\ge0,
      \]
      and \(h\) is non-decreasing on \((0,\infty)\). In particular, taking \(z=1\) in the already proved bound \(h(z)\le z+1/z\) gives \(h(1)\le2\). For \(0<z\le1\), monotonicity gives \(h(z)\le h(1)\le2=2(z\vee1)\). For \(z\ge1\), \(h(z)\le z+1/z\le2z=2(z\vee1)\). For \(z\le0\), \(1-\Phi(z)\ge1/2\), so \(h(z)\le2\phi(z)\le2/\sqrt{2\pi}<2=2(z\vee1)\). This proves (R4).

      We shall also use the elementary consequence
      \[
      \Pr(N(0,1)\le -c)\le e^{-c^2/2},\qquad c\ge0.
      \tag{5}
      \]
      Indeed, if \(0\le c<1\), the left side is at most \(1/2\le e^{-c^2/2}\). If \(c\ge1\), by symmetry and the lower Mill inequality \(c\le \phi(c)/(1-\Phi(c))\),
      \[
      \Pr(N(0,1)\le -c)=1-\Phi(c)
      \le \frac{\phi(c)}{c}
      =\frac{e^{-c^2/2}}{c\sqrt{2\pi}}
      \le e^{-c^2/2}.
      \]

      #### 1. A uniform concentration bound for every center \(x\)

      Fix \(x\in\mathbb R\) and \(\epsilon>0\). Define
      \[
      s_x:=
      \begin{cases}
      1/\underline\sigma,& x\ge0,\\[2mm]
      1/\overline\sigma,& x<0,
      \end{cases}
      \qquad
      W_j:=\frac{X_j-x}{\sigma_j}+x s_x,\qquad 1\le j\le p,
      \]
      and put
      \[
      Z_x:=\max_{1\le j\le p}W_j.
      \]
      The vector \(W=(W_1,\dots,W_p)\) is Gaussian and
      \[
      \operatorname{Var}(W_j)=1.
      \]
      Its mean is
      \[
      \mu_j:=\mathbb E[W_j]=x\left(s_x-\frac1{\sigma_j}\right).
      \]
      If \(x\ge0\), then \(s_x=1/\underline\sigma\ge 1/\sigma_j\), so \(\mu_j\ge0\). If \(x<0\), then \(s_x=1/\overline\sigma\le 1/\sigma_j\) and \(x<0\), so again \(\mu_j\ge0\). Moreover,
      \[
      0\le \mu_j\le \bar z:=\delta |x|.
      \tag{1.1}
      \]
      Indeed, for \(x\ge0\),
      \[
      \mu_j=x\left(\frac1{\underline\sigma}-\frac1{\sigma_j}\right)
      \le x\left(\frac1{\underline\sigma}-\frac1{\overline\sigma}\right)=\delta x,
      \]
      and for \(x<0\),
      \[
      \mu_j
      =x\left(\frac1{\overline\sigma}-\frac1{\sigma_j}\right)
      =(-x)\left(\frac1{\sigma_j}-\frac1{\overline\sigma}\right)
      \le (-x)\left(\frac1{\underline\sigma}-\frac1{\overline\sigma}\right)=\delta |x|.
      \]
      Also,
      \[
      W_j-\mu_j=\frac{X_j}{\sigma_j}.
      \tag{1.2}
      \]

      #### 1.1 Density bound for \(Z_x\)

      We first note that we may delete redundant coordinates. If \(\operatorname{Corr}(W_j,W_k)=1\) for some \(j\ne k\), then, since \(X\) is centered and both standardized variables \(X_j/\sigma_j\), \(X_k/\sigma_k\) have variance \(1\), we have \(X_j/\sigma_j=X_k/\sigma_k\) a.s. Hence, by (1.2),
      \[
      W_k-W_j=\mu_k-\mu_j
      =x\left(\frac1{\sigma_j}-\frac1{\sigma_k}\right)
      \]
      is a deterministic constant. Therefore, for this fixed \(x\), one of \(W_j,W_k\) is pointwise at most the other, and hence it is redundant in the maximum. Deleting it changes neither \(Z_x=\max_l W_l\), nor the residual maximum
      \[
      \max_l(W_l-xs_x)=Z_x-xs_x,
      \]
      nor
      \[
      \max_l(W_l-\mu_l)=\max_l\frac{X_l}{\sigma_l}.
      \]
      Repeating finitely many times, we may assume
      \[
      \operatorname{Corr}(W_j,W_k)<1\qquad(j\ne k),
      \tag{1.3}
      \]
      without changing \(Z_x\) or the centered maximum in (1.2). We relabel the remaining coordinates \(1,\dots,q\).

      By [ref:R1], \(Z_x\) has a density
      \[
      f_{Z_x}(z)=\phi(z)G(z),
      \]
      where
      \[
      G(z):=\sum_{j=1}^q
      e^{\mu_j z-\mu_j^2/2}
      \Pr\left(W_k\le z\ \forall k\ne j\mid W_j=z\right).
      \tag{1.4}
      \]
      If \(q=1\), the single summand in (1.4) is \(e^{\mu_1 z-\mu_1^2/2}\), which is nonnegative and non-decreasing because \(\mu_1\ge0\). If \(q\ge2\), then for every fixed \(j\), [ref:R2] applies to \((W_0,W_1,\dots,W_q)=(W_j,(W_k)_{k\ne j})\), because all variances are \(1\) and \(\mathbb E[W_j]=\mu_j\ge0\). Thus in all cases each summand in (1.4) is nonnegative and non-decreasing as a function of \(z\). Since \(G\) is their sum,
      \[
      G:\mathbb R\to\mathbb R\ \text{is nonnegative and non-decreasing}.
      \tag{1.5}
      \]

      Let
      \[
      \widetilde Z:=\max_{1\le j\le q}(W_j-\mu_j).
      \]
      By (1.2), after the deletion above,
      \[
      \widetilde Z=\max_{1\le j\le p}\frac{X_j}{\sigma_j}
      \quad\text{a.s.},
      \]
      so
      \[
      \mathbb E[\widetilde Z]=a_p.
      \tag{1.6}
      \]
      Since \(\mu_j\le\bar z\) by (1.1), for every \(z\in\mathbb R\),
      \[
      \{Z_x>z\}\subseteq \{\widetilde Z>z-\bar z\}.
      \]
      Using (1.5), for every \(z\in\mathbb R\),
      \[
      \begin{aligned}
      (1-\Phi(z))G(z)
      &\le \int_z^\infty \phi(u)G(u)\,du
      =\Pr(Z_x>z)\\
      &\le \Pr(\widetilde Z>z-\bar z).
      \end{aligned}
      \tag{1.7}
      \]
      The centered Gaussian vector \((W_j-\mu_j)_{1\le j\le q}\) has variances \(1\). Applying [ref:R3] with \(\sigma^2=1\) and using (1.6) gives, for all \(z\in\mathbb R\),
      \[
      \Pr(\widetilde Z>z-\bar z)
      \le \exp\left\{-\frac{(z-\bar z-a_p)_+^2}{2}\right\}.
      \tag{1.8}
      \]
      Indeed, if \(z-\bar z-a_p\le0\), the right side of (1.8) equals \(1\), while if \(z-\bar z-a_p>0\), it follows from (R3) with \(r=z-\bar z-a_p\).

      Combining (1.7), (1.8) and Mill's inequality (R4), we obtain
      \[
      f_{Z_x}(z)
      =\phi(z)G(z)
      \le 2(z\vee1)
      \exp\left\{-\frac{(z-\bar z-a_p)_+^2}{2}\right\},
      \qquad z\in\mathbb R.
      \tag{1.9}
      \]

      We now use the elementary fact that, for every \(a\ge0\) and every \(z\in\mathbb R\),
      \[
      (z\vee1)e^{-(z-a)_+^2/2}\le a+1.
      \tag{1.10}
      \]
      To see this, if \(z\le a\), then the left side is at most \(a\vee1\le a+1\). If \(z>a\) and \(z<1\), then it is at most \(1\le a+1\). If \(z\ge\max(a,1)\), write \(h(z)=z e^{-(z-a)^2/2}\). On \([\max(a,1),a+1]\), one has \(h(z)\le z\le a+1\). On \([a+1,\infty)\),
      \[
      h'(z)=e^{-(z-a)^2/2}\bigl(1-z(z-a)\bigr)\le0,
      \]
      because \(z(z-a)\ge a+1\ge1\). Hence on \([a+1,\infty)\), \(h\) is non-increasing and
      \[
      h(z)\le h(a+1)=(a+1)e^{-1/2}\le a+1.
      \]
      This proves (1.10).

      Applying (1.10) with \(a=\bar z+a_p\ge0\) to (1.9) yields
      \[
      f_{Z_x}(z)\le 2(\bar z+a_p+1),\qquad \forall z\in\mathbb R.
      \tag{1.11}
      \]
      Therefore, for every \(y\in\mathbb R\) and \(t>0\),
      \[
      \begin{aligned}
      \Pr(|Z_x-y|\le t)
      &=\int_{y-t}^{y+t}f_{Z_x}(z)\,dz\\
      &\le 2t\sup_{z\in[y-t,y+t]}f_{Z_x}(z)
      \le 4t(\bar z+a_p+1).
      \end{aligned}
      \tag{1.12}
      \]

      #### 1.2 From \(Z_x\) back to \(M\)

      We claim that
      \[
      \Pr(|M-x|\le\epsilon)
      \le \Pr\left(\left|\max_{1\le j\le p}\frac{X_j-x}{\sigma_j}\right|\le\frac{\epsilon}{\underline\sigma}\right).
      \tag{1.13}
      \]
      Indeed, if \(|M-x|\le\epsilon\), then for every \(j\),
      \[
      \frac{X_j-x}{\sigma_j}\le \frac{\epsilon}{\sigma_j}\le\frac{\epsilon}{\underline\sigma}.
      \]
      Also, choosing \(j_0\) with \(X_{j_0}=M\), we have \(X_{j_0}-x\ge-\epsilon\), hence
      \[
      \frac{X_{j_0}-x}{\sigma_{j_0}}\ge -\frac{\epsilon}{\sigma_{j_0}}\ge-\frac{\epsilon}{\underline\sigma}.
      \]
      Thus (1.13) holds. Since
      \[
      Z_x=\max_{1\le j\le p}\frac{X_j-x}{\sigma_j}+x s_x,
      \]
      we get from (1.13) that
      \[
      \Pr(|M-x|\le\epsilon)
      \le \sup_{y\in\mathbb R}\Pr\left(|Z_x-y|\le\frac{\epsilon}{\underline\sigma}\right).
      \]
      Applying (1.12) with \(t=\epsilon/\underline\sigma\) and \(\bar z=\delta |x|\), we obtain the uniform bound
      \[
      \Pr(|M-x|\le\epsilon)
      \le \frac{4\epsilon}{\underline\sigma}
      \bigl(\delta |x|+a_p+1\bigr),
      \qquad \forall x\in\mathbb R,\ \epsilon>0.
      \tag{1.14}
      \]

      #### 2. The equal-variance case

      Assume \(\underline\sigma=\overline\sigma=\sigma\). Then \(\delta=0\), and (1.14) gives
      \[
      \Pr(|M-x|\le\epsilon)
      \le \frac{4\epsilon(a_p+1)}{\sigma},
      \qquad \forall x\in\mathbb R,\ \epsilon>0.
      \]
      Taking the supremum over \(x\in\mathbb R\) yields
      \[
      \mathcal L(M,\epsilon)
      \le \frac{4\epsilon(a_p+1)}{\sigma},
      \qquad \epsilon>0.
      \]
      This proves assertion (i).

      #### 3. The unequal-variance case

      Assume now \(\underline\sigma<\overline\sigma\). Let \(0<\epsilon\le\underline\sigma\) and set
      \[
      L:=\log\left(\frac{\underline\sigma}{\epsilon}\right)\ge0,\qquad
      s:=\sqrt{2L},\qquad
      R:=\sqrt{1\vee L}.
      \tag{3.1}
      \]
      Thus \(s\le \sqrt2\,R\) and \(R\ge1\).

      Define
      \[
      A:=\overline\sigma(a_p+s),\qquad
      T:=\epsilon+A
      =\epsilon+\overline\sigma\left(a_p+\sqrt{2\log(\underline\sigma/\epsilon)}\right).
      \tag{3.2}
      \]

      #### 3.1 Far tails

      If \(x\ge T\), then
      \[
      \Pr(|M-x|\le\epsilon)
      \le \Pr(M\ge x-\epsilon)
      \le \Pr(M\ge A).
      \]
      Since \(M=\max_j\sigma_j(X_j/\sigma_j)\le\overline\sigma\max_j(X_j/\sigma_j)\), we have \(\mathbb E[M]\le \overline\sigma a_p\), and hence \(A\ge\mathbb E[M]+\overline\sigma s\). If \(s=0\), then \(\Pr(M\ge A)\le1=e^{-s^2/2}=\epsilon/\underline\sigma\); otherwise, applying [ref:R3] to the centered Gaussian vector \(X\), for which \(\max_j\mathbb E[X_j^2]=\overline\sigma^2\), with \(\sigma^2=\overline\sigma^2\) and \(r=\overline\sigma s>0\) gives
      \[
      \Pr(M\ge A)
      \le \Pr(M\ge\mathbb E[M]+\overline\sigma s)
      \le e^{-s^2/2}
      =e^{-L}
      =\frac{\epsilon}{\underline\sigma}.
      \tag{3.3}
      \]

      If \(x\le -T\), then
      \[
      \Pr(|M-x|\le\epsilon)
      \le \Pr(M\le x+\epsilon)
      \le \Pr(M\le -A).
      \]
      Since \(M\ge X_1\), \(\Pr(M\le -A)\le \Pr(X_1\le -A)\). Let \(Y:=X_1/\sigma_1\sim N(0,1)\). Then, using (5) and \(\sigma_1\le\overline\sigma\),
      \[
      \begin{aligned}
      \Pr(X_1\le -A)
      &=\Pr\left(Y\le -\frac{A}{\sigma_1}\right)
      \le \exp\left\{-\frac{A^2}{2\sigma_1^2}\right\}\\
      &\le \exp\left\{-\frac{A^2}{2\overline\sigma^2}\right\}
      =\exp\left\{-\frac{(a_p+s)^2}{2}\right\}
      \le e^{-s^2/2}
      =\frac{\epsilon}{\underline\sigma}.
      \end{aligned}
      \tag{3.4}
      \]
      Thus for all \(|x|\ge T\),
      \[
      \Pr(|M-x|\le\epsilon)\le \frac{\epsilon}{\underline\sigma}.
      \tag{3.5}
      \]

      #### 3.2 The middle range

      Suppose \(|x|\le T\). From (1.14) and \(\epsilon\le\underline\sigma\),
      \[
      \Pr(|M-x|\le\epsilon)
      \le \frac{4\epsilon}{\underline\sigma}
      \bigl(\delta T+a_p+1\bigr).
      \tag{3.6}
      \]
      Now
      \[
      \delta T+a_p+1
      =\delta\epsilon+\delta\overline\sigma(a_p+s)+a_p+1.
      \]
      Since
      \[
      \delta\overline\sigma=\frac{\overline\sigma}{\underline\sigma}-1,
      \qquad
      \delta\epsilon\le 1-\frac{\underline\sigma}{\overline\sigma},
      \]
      we obtain
      \[
      \begin{aligned}
      \delta T+a_p+1
      &\le \frac{\overline\sigma}{\underline\sigma}a_p
      +\left(\frac{\overline\sigma}{\underline\sigma}-1\right)s
      +2-\frac{\underline\sigma}{\overline\sigma}\\
      &\le C_0(a_p+R),
      \end{aligned}
      \tag{3.7}
      \]
      where
      \[
      C_0:=
      \frac{\overline\sigma}{\underline\sigma}
      +\left(\frac{\overline\sigma}{\underline\sigma}-1\right)\sqrt2
      +2-\frac{\underline\sigma}{\overline\sigma}.
      \]
      Here we used \(s\le\sqrt2 R\), \(R\ge1\), and \(a_p\ge0\).

      Combining (3.6), (3.7) and (3.5), for \(0<\epsilon\le\underline\sigma\) we have
      \[
      \Pr(|M-x|\le\epsilon)
      \le C_1\epsilon(a_p+R),
      \qquad \forall x\in\mathbb R,
      \tag{3.8}
      \]
      where
      \[
      C_1:=\frac{4C_0}{\underline\sigma}+\frac1{\underline\sigma}
      \]
      depends only on \(\underline\sigma\) and \(\overline\sigma\). Indeed, on the middle range use (3.6)–(3.7), and on the far tails use (3.5) together with \(\epsilon/\underline\sigma\le (\epsilon/\underline\sigma)(a_p+R)\), since \(R\ge1\) and \(a_p\ge0\).

      If \(\epsilon>\underline\sigma\), then \(1\vee\log(\underline\sigma/\epsilon)=1\), so \(R=1\). Since \(C_1\ge1/\underline\sigma\), we have \(C_1\underline\sigma\ge1\). As \(\Pr(|M-x|\le\epsilon)\le1\), we have
      \Pr(|M-x|\le\epsilon)
      \le 1
      \le C_1\epsilon
      \le C_1\epsilon(a_p+1)
      = C_1\epsilon(a_p+R)
      \qquad \forall x\in\mathbb R.
      \tag{3.9}
      \]
      Thus, for every \(\epsilon>0\) and every \(x\in\mathbb R\),
      \[
      \Pr\left(\left|M-x\right|\le\epsilon\right)
      \le C_1\epsilon
      \left\{a_p+\sqrt{1\vee\log\left(\frac{\underline\sigma}{\epsilon}\right)}\right\}.
      \]
      Taking the supremum over \(x\in\mathbb R\) gives
      \[
      \mathcal L\left(\max_{1\le j\le p}X_j,\epsilon\right)
      \le C_1\epsilon
      \left\{a_p+\sqrt{1\vee\log\left(\frac{\underline\sigma}{\epsilon}\right)}\right\},
      \qquad \epsilon>0.
      \]
      This proves assertion (ii) with \(C=C_1>0\), which depends only on \(\underline\sigma\) and \(\overline\sigma\). The proof is complete.

