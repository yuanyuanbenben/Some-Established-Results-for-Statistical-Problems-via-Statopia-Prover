      ##### Lemma \ref{lemma: Y65-1}

      ###### Definitions and notation
      - \(\mathbb R\) denotes the real line and \(\mathbb R^p\) the \(p\)-dimensional Euclidean space; \(p\) is the number of coordinates.
      - \(W=(W_1,\dots,W_p)^T\) is a Gaussian random vector in \(\mathbb R^p\), meaning that its coordinates have a joint Gaussian distribution. It is not assumed centered.
      - \(\Ep\) denotes expectation, \(\Var\) variance, and \(\Corr\) correlation. Since \(\Var(W_j)=1\), \(\Corr(W_j,W_k)=\Ep[(W_j-\Ep W_j)(W_k-\Ep W_k)]\).
      - \(\phi\) is used for the standard normal density,
        \[
        \phi(x)=\frac1{\sqrt{2\pi}}e^{-x^2/2},\qquad x\in\mathbb R.
        \]
      - \(\Pr(\cdot\mid W_j=x)\) denotes conditional probability given \(W_j=x\), understood through the regular conditional distribution of the Gaussian vector \(W\) given its \(j\)-th coordinate.
      - “The distribution of \(M=\max_{1\le j\le p}W_j\) is absolutely continuous with respect to Lebesgue measure” means \(\Pr(M\in A)=0\) for every Borel set \(A\subset\mathbb R\) of Lebesgue measure zero. A “version of the density” is a measurable function \(f\) such that \(\Pr(M\in A)=\int_A f(x)\,dx\) for all Borel \(A\).

      ###### Assumptions
      - \(p\) is a positive integer and \(W=(W_1,\dots,W_p)^T\) is a (not necessarily centered) Gaussian random vector in \(\mathbb R^p\).
      - \(\Var(W_j)=1\) for all \(1\le j\le p\).
      - \(\Corr(W_j,W_k)<1\) whenever \(j\ne k\).

      No independence of the coordinates and no centering of \(W\) are assumed.

      ###### Statement
      Let \(W=(W_1,\dots,W_p)^T\) be a (not necessarily centered) Gaussian random vector in \(\mathbb R^p\) with \(\Var(W_j)=1\) for all \(1\le j\le p\). Suppose that \(\Corr(W_j,W_k)<1\) whenever \(j\ne k\). Then the distribution of \(\max_{1\le j\le p}W_j\) is absolutely continuous with respect to Lebesgue measure, and a version of the density is given by
      \[
      f(x)
      =
      \phi(x)\sum_{j=1}^{p}
      e^{\Ep[W_j]x-(\Ep[W_j])^2/2}
      \cdot
      \Pr\!\left(W_k\le x,\ \forall k\ne j \mid W_j=x\right).
      \tag{density}
      \]

