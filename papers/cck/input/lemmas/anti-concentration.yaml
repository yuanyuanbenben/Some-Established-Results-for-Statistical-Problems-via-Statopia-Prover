      ##### Mill’s inequality

      ###### Definitions and notation
      - \(\phi(z)\) is the standard normal density and \(\Phi(z)\) is the standard normal distribution function.
      - \(z\vee 1=\max\{z,1\}\).

      ###### Assumptions
      - The first chain is stated for \(z>0\).
      - The auxiliary bound \(\phi(z)/(1-\Phi(z))\le 1.53\le 2\) is stated for \(z\in(-\infty,1)\).
      - The final bound is asserted for all \(z\in\RR\).

      ###### Statement
      Mill’s inequality states that for \(z>0\),
      \[
      z
      \le
      \frac{\phi(z)}{1-\Phi(z)}
      \le
      z\frac{1+z^2}{z^2},
      \]
      and in particular \((1+z^2)/z^2\le 2\) when \(z>1\). Moreover,
      \[
      \frac{\phi(z)}{1-\Phi(z)}
      \le 1.53\le 2
      \]
      for \(z\in(-\infty,1)\). Therefore,
      \[
      \frac{\phi(z)}{1-\Phi(z)}
      \le 2(z\vee 1),
      \qquad \forall z\in\RR.
      \]

