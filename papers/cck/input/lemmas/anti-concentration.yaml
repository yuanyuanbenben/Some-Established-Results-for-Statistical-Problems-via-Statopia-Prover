      ##### Lemma \ref{thm3} (Gaussian concentration inequality)

      ###### Definitions and notation
      - \(\mathbb{R}^p\) is \(p\)-dimensional Euclidean space; \(X=(X_1,\dots,X_p)^T\) is a random vector in \(\mathbb{R}^p\).
