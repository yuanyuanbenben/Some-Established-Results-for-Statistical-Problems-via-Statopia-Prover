      ##### Lemma \ref{lemma: smooth max property}
      ###### Definitions and notation
      For a smooth function \(f:\mathbb R^p\to\mathbb R\), write
      \[
      \partial_jf(z)=\frac{\partial f(z)}{\partial z_j},
      \qquad z=(z_1,\dots,z_p)^T.
      \]
      The smooth maximum is
      \[
      F_\beta(z)=\beta^{-1}\log\left(\sum_{m=1}^p e^{\beta z_m}\right),
      \qquad z=(z_1,\dots,z_p)^T\in\mathbb R^p,
      \]
      where the index \(m\) in the sum is a summation index. Define
      \[
      \pi_j(z):=\frac{e^{\beta z_j}}{\sum_{m=1}^p e^{\beta z_m}},
      \qquad
      w_{jk}(z):=1(j=k)\pi_j(z)-\pi_j(z)\pi_k(z),
      \]
      where \(1(j=k)\) denotes the indicator of the equality \(j=k\). The notation \((z)\) denotes evaluation at \(z\).

      ###### Assumptions
      Let \(p\) be a positive integer, let \(\beta>0\), and let \(z=(z_1,\dots,z_p)^T\in\mathbb R^p\). The indices \(j,k\) range over \(\{1,\dots,p\}\). The result is a deterministic pointwise statement in \(z\); no Gaussian, covariance, or integrability condition is required for this lemma.

      ###### Statement
      For every \(1\le j,k\le p\),
      \[
      \partial_jF_\beta(z)=\pi_j(z),
      \qquad
      \partial_j\partial_kF_\beta(z)=\beta w_{jk}(z),
      \]
      where
      \[
      \pi_j(z)=\frac{e^{\beta z_j}}{\sum_{m=1}^p e^{\beta z_m}},
      \qquad
      w_{jk}(z)=1(j=k)\pi_j(z)-\pi_j(z)\pi_k(z).
      \]
      Moreover,
      \[
      \pi_j(z)\ge0,
      \qquad
      \sum_{j=1}^p\pi_j(z)=1,
      \qquad
      \sum_{j,k=1}^p|w_{jk}(z)|\le2.
      \]
