      Here \(F_\beta(z)=\beta^{-1}\log(\sum_{j=1}^p e^{\beta z_j})\) for \(z=(z_1,\dots,z_p)^T\in\mathbb R^p\) and \(\beta>0\) is the smooth max, and \(\Delta\) is the entrywise maximum absolute covariance difference:
      \[
      \Delta:=\max_{1\le j,k\le p}|\sigma^X_{jk}-\sigma^Y_{jk}|,
      \]
      where \(\Sigma^X=(\sigma^X_{jk})_{1\le j,k\le p}\) and \(\Sigma^Y=(\sigma^Y_{jk})_{1\le j,k\le p}\) are covariance matrices. The theorem imposes no additional hypothesis \(p\ge2\) and no positivity condition on the variances \(\sigma^Y_{jj}\). It requires \(g\in C^2(\mathbb R)\) with finite first and second derivative sup-norms and \(\beta>0\). We write \(\|g\|_\infty:=\sup_{z\in\mathbb R}|g(z)|\). A centered Gaussian random vector is a mean-zero Gaussian random vector. The coordinatewise maximum is \(\max_{1\le j\le p} z_j\). Expectations are taken on the probability space fixed in the paper’s Notation section.

