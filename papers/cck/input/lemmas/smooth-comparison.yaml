      ##### Lemma [lemma: talagrand] (Stein's identity)

      ###### Definitions and notation
      Let \(p\) be a positive integer. Write
      \[
      W=(W_1,\dots,W_p)^T\in\mathbb R^p,
      \qquad
      z=(z_1,\dots,z_p)^T,
      \]
      and, for a smooth function \(f:\mathbb R^p\to\mathbb R\), define
      \[
      \partial_j f(z)=\frac{\partial f(z)}{\partial z_j}.
      \]
      The symbol \(\mathbb E\) denotes expectation. A centered Gaussian random vector is a mean-zero Gaussian random vector in \(\mathbb R^p\). A \(C^1\)-function is a continuously differentiable function. In the displayed identity in the Statement, \(\mathbb E[W_jW_k]\) is the \((j,k)\)-entry of the covariance matrix of \(W\), since \(W\) is centered.

      ###### Assumptions
      - \(W=(W_1,\dots,W_p)^T\) is a centered Gaussian random vector in \(\mathbb R^p\).
      - \(f:\mathbb R^p\to\mathbb R\) is a \(C^1\)-function.
      - For every \(1\le j\le p\),
        \[
        \mathbb E\bigl[|\partial_j f(W)|\bigr]<\infty.
        \]

      ###### Statement
      For every \(1\le j\le p\),
      \[
      \mathbb E[W_jf(W)]
      =
      \sum_{k=1}^p \mathbb E[W_jW_k]\,\mathbb E[\partial_k f(W)].
      \]

      #### Reference R2
      Target: Lemma \ref{lemma: smooth max property}
      Citation: “We will use the following properties of the smooth max function. Lemma \ref{lemma: smooth max property} For every \(1\le j,k\le p\), \(\partial_jF_\beta(z)=\pi_j(z),\ \partial_j\partial_kF_\beta(z)=\beta w_{jk}(z)\), where \(\pi_j(z)=e^{\beta z_j}/\sum_{m=1}^pe^{\beta z_m}\) and \(w_{jk}(z)=1(j=k)\pi_j(z)-\pi_j(z)\pi_k(z)\). Moreover, \(\pi_j(z)\ge0,\ \sum_{j=1}^p\pi_j(z)=1,\ \sum_{j,k=1}^p|w_{jk}(z)|\le2\).” In the proof of Theorem \ref{theorem:comparison}: “By Lemmas \ref{lemma: smooth max property} and \ref{lemma: second deriv m}, \(\sum_{j,k=1}^p|\partial_j\partial_k m(Z(t))|\le |(g''\circ F_\beta)(Z(t))|+2\beta|(g'\circ F_\beta)(Z(t))|\).” The source proof of the lemma states: “The first property was noted in \cite{Chatterjee2005b}. The other properties follow from a direct calculation.”
