      Let \(p\) be a positive integer, let \(\beta>0\), let \(g\in C^2(\mathbb R)\), and let \(z\in\mathbb R^p\). Let \(1\le j,k\le p\) be arbitrary indices. No Gaussian distribution, covariance matrix, or positivity condition on variances is assumed; the lemma is a pointwise deterministic identity.

