      Let \(p\) be a positive integer, let \(\beta>0\), and let \(z\in\mathbb R^p\). Let \(1\le j,k\le p\) be arbitrary indices. No Gaussian, covariance, or variance-positivity hypothesis is assumed; the identities and inequalities are pointwise in \(z\).

