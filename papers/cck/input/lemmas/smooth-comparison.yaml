    proof_body: |-
      ### Definitions and notation used in Proof
      Write \(\partial_j f(z)=\partial f(z)/\partial z_j\). For \(z\in\mathbb R^p\), define
      \[
      \pi_j(z)=\frac{e^{\beta z_j}}{\sum_{\ell=1}^p e^{\beta z_\ell}},
      \qquad
      w_{jk}(z)=1(j=k)\pi_j(z)-\pi_j(z)\pi_k(z).
      \]
      For \(g\in C^2(\mathbb R)\), set \(m:=g\circ F_\beta\).

      ### Proof
      We use Stein’s identity [ref:R1]: for a centered Gaussian vector \(W=(W_1,\dots,W_p)^T\) and a \(C^1\)-function \(f\) with \(\mathbb E|\partial_j f(W)|<\infty\),
      \[
      \mathbb E[W_j f(W)]
      =\sum_{k=1}^p \mathbb E[W_jW_k]\mathbb E[\partial_k f(W)].
      \]
      We also use the smooth-max derivative formulas [ref:R2]:
      \[
      \partial_j F_\beta(z)=\pi_j(z),\qquad
      \partial_j\partial_k F_\beta(z)=\beta w_{jk}(z),
      \]
      and
      \[
      \sum_{j=1}^p \pi_j(z)=1,\qquad
      \sum_{j,k=1}^p |w_{jk}(z)|\le 2.
      \]
      For \(m=g\circ F_\beta\), the chain rule gives [ref:R3]
      \[
      \partial_j\partial_k m(z)
      =(g''\circ F_\beta)(z)\pi_j(z)\pi_k(z)
      +\beta (g'\circ F_\beta)(z)w_{jk}(z).
      \]
      Without loss of generality, assume \(X\) and \(Y\) are independent, so that \(\mathbb E[X_jY_k]=0\) for all \(j,k\). Define the Slepian interpolation
      \[
      Z(t):=\sqrt{t}\,X+\sqrt{1-t}\,Y,\qquad t\in[0,1],
      \]
      and set
      \[
      \Psi(t):=\mathbb E[m(Z(t))].
      \]
      Then
      \[
      |\mathbb E[m(X)]-\mathbb E[m(Y)]|
      =|\Psi(1)-\Psi(0)|
      =\left|\int_0^1 \Psi'(t)\,dt\right|.
      \]
      Differentiating and applying Stein’s identity [ref:R1] with
      \[
      W=\bigl(t^{-1/2}X_j-(1-t)^{-1/2}Y_j,Z(t)^T\bigr)^T,
      \qquad f(W)=\partial_j m(Z(t)),
      \]
      we obtain
      \[
      \Psi'(t)
      =\frac12\sum_{j=1}^p\mathbb E\!\left[\partial_j m(Z(t))
      \bigl(t^{-1/2}X_j-(1-t)^{-1/2}Y_j\bigr)\right]
      =\frac12\sum_{j=1}^p\sum_{k=1}^p
      (\sigma^X_{jk}-\sigma^Y_{jk})
      \mathbb E[\partial_j\partial_k m(Z(t))].
      \]
      Hence
      \[
      \begin{aligned}
      \left|\int_0^1 \Psi'(t)\,dt\right|
      &\le \frac12\sum_{j,k=1}^p
      |\sigma^X_{jk}-\sigma^Y_{jk}|
      \left|\int_0^1\mathbb E[\partial_j\partial_k m(Z(t))]\,dt\right|\\
      &\le \frac{\Delta}{2}\int_0^1
      \sum_{j,k=1}^p
      \left|\mathbb E[\partial_j\partial_k m(Z(t))]\right|dt.
      \end{aligned}
      \]
      Using the displayed formula for \(\partial_j\partial_k m\),
      \[
      \sum_{j,k=1}^p |\partial_j\partial_k m(Z(t))|
      \le |(g''\circ F_\beta)(Z(t))|
      +2\beta |(g'\circ F_\beta)(Z(t))|.
      \]
      Therefore
      \[
      \begin{aligned}
      |\mathbb E[g(F_\beta(X))-g(F_\beta(Y))]|
      &\le \Delta\left(
      \frac12\|g''\|_\infty+\beta\|g'\|_\infty
      \right).
      \end{aligned}
      \]
      This proves the first assertion.

      For the second assertion, use the smooth-max approximation
      \[
      0\le F_\beta(z)-\max_{1\le j\le p}z_j
      \le \beta^{-1}\log p,\qquad z\in\mathbb R^p.
      \]
      Since \(g\) is Lipschitz with constant \(\|g'\|_\infty\),
      \[
      \begin{aligned}
      &\left|\mathbb E\left[g\!\left(\max_{1\le j\le p}X_j\right)
      -g\!\left(\max_{1\le j\le p}Y_j\right)\right]\right|\\
      &\le 
      \left|\mathbb E[g(F_\beta(X))-g(F_\beta(Y))]\right|
      +2\beta^{-1}\|g'\|_\infty\log p\\
      &\le
      \left(\frac{\|g''\|_\infty}{2}+\beta\|g'\|_\infty\right)\Delta
      +2\beta^{-1}\|g'\|_\infty\log p.
      \end{aligned}
      \]
      This completes the proof.

      ### References
      #### Reference R1
      Target: Lemma \ref{lemma: talagrand} (Stein's identity)
      Citation: “We shall use the following version of Stein's identity. Lemma \ref{lemma: talagrand} Let \(W=(W_1,\dots,W_p)^T\) be a centered Gaussian random vector in \(\mathbb R^p\). Let \(f:\mathbb R^p\to\mathbb R\) be a \(C^1\)-function such that \(\mathbb E[|\partial_j f(W)|]<\infty\) for all \(1\le j\le p\). Then for every \(1\le j\le p\), \(\mathbb E[W_jf(W)]=\sum_{k=1}^p\mathbb E[W_jW_k]\mathbb E[\partial_k f(W)]\).” In the proof of Theorem \ref{theorem:comparison}: “where the second equality follows from applying Lemma \ref{lemma: talagrand} to \(W=(t^{-1/2}X_j-(1-t)^{-1/2}Y_j,Z(t)^T)^T\) and \(f(W)=\partial_j m(Z(t))\).” The source proof of the lemma states: “See Section A.6 of \cite{Talagrand2003}; also \cite{ChenGoldsteinShao2011} and \cite{Stein1981}.”
