      ##### Lemma \ref{lemma: smooth max property}
      ###### Definitions and notation
      For \(z=(z_1,\dots,z_p)^T\in\mathbb R^p\), let
      \[
      F_\beta(z):=\beta^{-1}\log\left(\sum_{m=1}^p e^{\beta z_m}\right),\qquad \beta>0.
