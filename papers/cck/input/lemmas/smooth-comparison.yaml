      ##### Lemma \ref{lemma: smooth max property}

      ###### Definitions and notation
      For a smooth function \(f:\mathbb R^{p}\to\mathbb R\), write
      \[
      \partial_{j} f (z) = \frac{\partial f(z)}{\partial z_{j}}
      \]
      for \(z = (z_{1},\dots,z_{p})^{T}\).

      The smooth max function is denoted by \(F_{\beta}\). For \(z\in\mathbb R^p\), define
      \[
      \pi_{j}(z) := \frac{e^{\beta z_{j}}}{\sum_{m=1}^p e^{\beta z_m}},
      \qquad
      w_{jk}(z) := 1(j = k)\pi_{j}(z)- \pi_{j}(z) \pi_{k}(z),
      \]
      where \(1(j=k)\) is the indicator of \(j=k\).

      ###### Assumptions
      \(1\le j,k\le p\), with \(z=(z_1,\dots,z_p)^T\in\mathbb R^p\) (the displayed identities hold for every such \(j,k,z\)). No further hypothesis is stated in the source lemma.

      ###### Statement
      For every \(1 \leq j,k \leq p\),
      \[
       \partial_{j} F_{\beta}(z) = \pi_{j}(z), \quad \partial_{j} \partial_k F_{\beta}(z) = \beta w_{jk} (z),
      \]
      where \(\pi_j\) and \(w_{jk}\) are as defined above. Moreover,
      \[
      \pi_{j}(z) \geq 0, \quad \sum_{j=1}^p \pi_{j} (z) = 1, \quad \sum_{j,k=1}^p |w_{jk}(z)|  \leq 2.
      \]

      ##### Lemma \ref{lemma: second deriv m}

      ###### Definitions and notation
      Let \(m := g \circ F_{\beta}\) with \(g \in C^{2}(\mathbb R)\), and let \(\pi_{j}\) and \(w_{jk}\) be as defined in Lemma \ref{lemma: smooth max property}, namely
      \[
      \pi_{j}(z) = \frac{e^{\beta z_{j}}}{\sum_{m=1}^p e^{\beta z_m}},
      \qquad
      w_{jk}(z) = 1(j = k)\pi_{j}(z)- \pi_{j}(z) \pi_{k}(z).
      \]
      As above, \(\partial_{j} f (z) = \partial f(z)/\partial z_{j}\).

      ###### Assumptions
      \(g \in C^{2}(\mathbb R)\) and \(m = g\circ F_\beta\). The identity is asserted for every \(1\le j,k\le p\) and \(z\in\mathbb R^p\).

      ###### Statement
      For every \(1 \leq j,k \leq p\),
      \[
      \partial_{j} \partial_k m(z) =   (g'' \circ F_\beta) (z) \pi_{j} (z) \pi_{k} (z)+ \beta (g' \circ F_\beta) (z) w_{jk}(z),
      \]
      where \(\pi_{j}\) and \(w_{jk}\) are defined in Lemma \ref{lemma: smooth max property}.

