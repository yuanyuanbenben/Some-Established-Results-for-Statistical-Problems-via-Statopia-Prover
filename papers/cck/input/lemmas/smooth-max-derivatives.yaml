      ##### Content basis
      Source extraction. The first derivative identity is displayed in Chatterjee (2005), arXiv:math/0510424, in the proof of Theorem 1.2, physical PDF pp. 2–3, after the definition of \(F_\beta\). It supports the first property \(\partial_j F_\beta(z)=\pi_j(z)\) of the current smooth-max lemma. The source uses \(n\), coordinates \(x_i\), vector \(\mathbf x\), and weights \(p_i(\mathbf x)\); its \(p_i\) is the weight denoted \(\pi_j\) in the current proof context, not the dimension. The same located passage also displays the second derivative formula and states the nonnegativity and normalization of the weights; these support the corresponding conclusions of the current smooth-max lemma. The absolute-sum bound \(\sum_{j,k}|w_{jk}(z)|\le 2\) is not displayed in the supplied passage; the current proof assigns the remaining properties to direct calculation rather than to the Chatterjee citation. No Gaussian, covariance, independence, or variance-positivity condition applies to these deterministic formulas.

      ##### First derivative identity for \(F_\beta\) (Chatterjee 2005)
      ###### Definitions and notation
      Let \(n\) be a positive integer, let \(\mathbf x=(x_1,\ldots,x_n)\in\mathbb R^n\), and let \(\beta>0\). Define
      \[
      F_\beta(\mathbf x)=\beta^{-1}\log\left(\sum_{i=1}^n e^{\beta x_i}\right),
      \]
      and, for \(i=1,\ldots,n\),
      \[
      p_i(\mathbf x)=\frac{e^{\beta x_i}}{\sum_{j=1}^n e^{\beta x_j}}.
      \]
      The source uses the convention \(\mathbf x=(x_1,\ldots,x_n)\). The sum, not the average, is inside the logarithm. Here \(p_i(\mathbf x)\) is the source’s weight notation; \(j\) is a summation index.

      ###### Assumptions
      - \(\beta>0\).
      - \(n\) is a positive integer and \(\mathbf x=(x_1,\ldots,x_n)\in\mathbb R^n\).
      - No Gaussian law, covariance matrix, independence, or positivity of variances is required for this deterministic identity.

      ###### Statement
      For every \(\mathbf x\in\mathbb R^n\) and every \(i=1,\ldots,n\),
      \[
      \frac{\partial F_\beta}{\partial x_i}(\mathbf x)
      =p_i(\mathbf x)
      =\frac{e^{\beta x_i}}{\sum_{j=1}^n e^{\beta x_j}}.
      \]

      ##### Second derivative identity for \(F_\beta\) (adjoining display in Chatterjee 2005)
      ###### Definitions and notation
      Let \(n\) be a positive integer, let \(\mathbf x=(x_1,\ldots,x_n)\in\mathbb R^n\), and let \(\beta>0\). Define
      \[
      F_\beta(\mathbf x)=\beta^{-1}\log\left(\sum_{i=1}^n e^{\beta x_i}\right),
      \]
      and, for \(i=1,\ldots,n\),
      \[
      p_i(\mathbf x)=\frac{e^{\beta x_i}}{\sum_{j=1}^n e^{\beta x_j}}.
      \]
      In the displayed quotient for \(p_i\), \(j\) is a summation index; in the second derivative display, \(i,j\) are coordinate indices. The sum is inside the logarithm.

      ###### Assumptions
      - \(\beta>0\).
      - \(n\) is a positive integer and \(\mathbf x=(x_1,\ldots,x_n)\in\mathbb R^n\).
      - No Gaussian or covariance hypotheses are required for this deterministic derivative formula.

      ###### Statement
      For every \(\mathbf x\in\mathbb R^n\) and all \(i,j\in\{1,\ldots,n\}\),
      \[
      \frac{\partial^2 F_\beta}{\partial x_j\partial x_i}(\mathbf x)=
      \begin{cases}
      \beta\bigl(p_i(\mathbf x)-p_i(\mathbf x)^2\bigr), & \text{if } i=j,\\[1mm]
      -\beta p_i(\mathbf x)p_j(\mathbf x), & \text{if } i\neq j.
      \end{cases}
      \]

      ##### Nonnegativity and normalization of the weights \(p_i\) (Chatterjee 2005)
      ###### Definitions and notation
      Let \(n\) be a positive integer, let \(\mathbf x=(x_1,\ldots,x_n)\in\mathbb R^n\), and let \(\beta>0\). For \(i=1,\ldots,n\), set
      \[
      p_i(\mathbf x)=\frac{e^{\beta x_i}}{\sum_{j=1}^n e^{\beta x_j}}.
      \]
      The source calls these numbers \(p_1(\mathbf x),\ldots,p_n(\mathbf x)\); they are weights on coordinates. The sum in the denominator is over \(j=1,\ldots,n\).

      ###### Assumptions
      - \(\beta>0\).
      - \(n\) is a positive integer and \(\mathbf x=(x_1,\ldots,x_n)\in\mathbb R^n\).
      - No Gaussian or covariance condition is required.

      ###### Statement
      For each \(\mathbf x\in\mathbb R^n\), the numbers \(p_1(\mathbf x),\ldots,p_n(\mathbf x)\) satisfy
      \[
      p_i(\mathbf x)\ge 0 \quad (i=1,\ldots,n),
      \qquad
      \sum_{i=1}^n p_i(\mathbf x)=1.
      \]
      The source adds that they induce a probability measure on \(\{1,2,\ldots,n\}\).
