    latex_statement: |-
      The logarithm is the ordinary logarithm inverse to the exponential. Here \(1(j=k)\) denotes the indicator of equality.

      <!-- formalization-clarifications:v1:7ae1bde6ea5b15169ceafe87a376a4473fa880d34314e003b533fc8616c5b85b -->
      Formalization clarifications from source and proof:
      1. Constants and quantifier order. For the selected target, the text “Let \(p\) be a positive integer and \(\beta>0\)” followed by “for every \(z\in\mathbb R^p\) and every \(1\le j,k\le p\)” gives the intended order
      \[
      \forall p\in\mathbb N_{>0}\ \forall \beta>0\ \forall z\in\mathbb R^p\ \forall j,k\in\{1,\dots,p\}.
      \]
      There is no random vector, distribution, sample size, set, or external limiting parameter in this target. The constant \(2\) in \(\sum_{j,k=1}^p |w_{jk}(z)|\le 2\) is absolute: it does not depend on \(p,\beta,z\), or the indices. The derivative identities are equalities whose right sides depend on the parameters through \(\beta\), \(p\), and \(z\) via \(\pi_j(z)\) and \(\beta w_{jk}(z)\); do not replace the second derivative by \(w_{jk}\) alone, nor the bound on \(w\) by a bound on the Hessian. An implicit Lean parameter \(p\) or \(\beta\) does not turn the literal \(2\) into a parameter-dependent constant. The proof says “The other properties follow from a direct calculation,” so the detailed algebra for the absolute-sum bound is omitted, but no additional constant or hypothesis is introduced. For the cited external result R1/Chatterjee 2005, the quantifier pattern is over positive dimension \(n\), \(\beta>0\), \(x\in\mathbb R^n\), and \(i\) (or \(i,j\)); its \(n\) is the dimension and its \(p_i(x)\) are weights, not the target’s dimension \(p\). The supplied extract states that no Gaussian law, covariance, independence, or variance-positivity condition is needed for these deterministic derivative formulas. The selected proof explicitly attributes only the first derivative to R1; although the supplied Chatterjee extract also displays the second derivative and nonnegativity/normalization of weights, the absolute-sum bound is not in that supplied passage and is attributed in the target only to “direct calculation.” Do not import constants or asymptotic parameters from the paired paper, such as \(\Delta\), \(C\), \(C'\), \(a_p\), or \(\sigma\)-dependencies, into this deterministic lemma.

      2. Norms and mathematical objects. The target uses only the ordinary real absolute value \(|\cdot|\). The expression \(\sum_{j,k=1}^p |w_{jk}(z)|\le 2\) is a double scalar sum, not a named norm; if one insists on a matrix interpretation, it is the entrywise \(\ell_1\)-sum over the \(p\times p\) matrix \(w(z)\), not the Euclidean, sup, operator, Frobenius, or normalized norm. No norm on \(z\in\mathbb R^p\) appears. The ambient space is \(\mathbb R^p\), and the source defines the smooth max by the exact formula
      \[
      F_\beta(z)=\beta^{-1}\log\Bigl(\sum_{m=1}^p e^{\beta z_m}\Bigr),
      \]
      so the sum, not an average, is inside the logarithm, and the exponential is \(e^{\beta z_m}\), not \(\beta z_m\), \(e^{\beta}z_m\), or a normalized/max-subtracted variant. The logarithm is explicitly the “ordinary logarithm inverse to the exponential,” i.e. the natural logarithm in Lean. The weight is
      \[
      \pi_j(z)=\frac{e^{\beta z_j}}{\sum_{m=1}^p e^{\beta z_m}},
      \]
      not the external Chatterjee \(p_i(\mathbf x)\) notation conflated with the dimension \(p\). The object
      \[
      w_{jk}(z)=1(j=k)\pi_j(z)-\pi_j(z)\pi_k(z)
      \]
      is the source-defined matrix used in the second derivative; the Hessian entry is \(\beta w_{jk}(z)\), not \(w_{jk}(z)\). For \(j=k\), \(w_{jj}=\pi_j-\pi_j^2\); for \(j\ne k\), \(w_{jk}=-\pi_j\pi_k\). The indicator \(1(j=k)\) is the equality indicator, not an off-diagonal indicator.

      3. Asymptotics. The selected target has no asymptotic statement: no \(O\), \(o\), \(o_{\Pr}\), probability limit, filter, or \(p\to\infty\). It is a pointwise deterministic identity and inequality, valid for every admissible \(p,\beta,z,j,k\). The source proof’s “direct calculation” does not hide an asymptotic claim or a rate. Although the surrounding paired paper discusses \(p=p_n\), \(o_{\Pr}\), and dimension-free bounds in other theorems, none of those asymptotic or probabilistic meanings belongs to this target unless separately invoked. Consequently, formalizing this lemma should not add a fixed/varying-parameter filter, a sample size \(n\), or a uniformity range in \(p\); the exact source assertion is that the identities and the bound hold for each positive integer \(p\) and each real \(\beta>0\). The source does not specify any asymptotic uniformity for this lemma because it states no asymptotic limit.

      4. Potentially omitted definitions and side conditions. The proof section defines “\(\partial_j f(z)=\partial f(z)/\partial z_j\),” so \(\partial_j\) is the coordinate partial derivative in \(\mathbb R^p\); \(\partial_j\partial_k\) is the corresponding iterated mixed partial, with the usual convention. The source does not give a separate Lean-level definition of mixed partial order, but \(F_\beta\) is obtained from exponential and logarithm with \(\beta>0\), so these partial derivatives exist on all of \(\mathbb R^p\); the displayed formulas are the source’s assertions, not hypotheses to be added. The index set is \(\{1,\dots,p\}\), with \(m\) the summation index in the denominator and \(j,k\) coordinate indices. Positivity \(p>0\) ensures the sum \(\sum_{m=1}^p e^{\beta z_m}\) is over a nonempty finite set, and the denominator is positive because each exponential is positive; \(\beta>0\) is required for \(F_\beta\). The target does not assume \(p\ge2\); in particular \(p=1\) is allowed according to “positive integer.” It does not assume centeredness, covariance structure, independence, measurability, or integrability. The probability-space notation in the paired paper is for other results, not for this deterministic lemma; if the lemma is later applied to a random \(z\), any measurability or integrability needed for that application is an additional application-level condition, not part of the source statement. The source leaves the detailed differentiation algebra and the detailed proof of \(\sum|w_{jk}|\le2\) to “direct calculation”; this is an omitted derivation, not an omitted assumption. The phrase “smooth max” refers to the displayed \(F_\beta\); it should not be replaced by the exact maximum \(\max_m z_m\) or augmented with the separate approximation inequality from the surrounding paper unless that surrounding claim is being formalized separately.
      <!-- /formalization-clarifications -->

      Let \(p\) be a positive integer and \(\beta>0\). For \(z=(z_1,\dots,z_p)^T\in\mathbb R^p\), define the smooth max
      \[
      F_\beta(z)=\beta^{-1}\log\left(\sum_{m=1}^p e^{\beta z_m}\right),
      \]
      and set
      \[
      \pi_j(z)=\frac{e^{\beta z_j}}{\sum_{m=1}^p e^{\beta z_m}},
      \qquad
      w_{jk}(z)=1(j=k)\pi_j(z)-\pi_j(z)\pi_k(z).
      \]
      Then for every \(z\in\mathbb R^p\) and every \(1\le j,k\le p\),
      \[
      \partial_j F_\beta(z)=\pi_j(z),
      \qquad
      \partial_j\partial_k F_\beta(z)=\beta\,w_{jk}(z).
      \]
      Moreover,
      \[
      \pi_j(z)\ge 0,
      \qquad
      \sum_{j=1}^p \pi_j(z)=1,
      \qquad
      \sum_{j,k=1}^p |w_{jk}(z)|\le 2.
      \]
