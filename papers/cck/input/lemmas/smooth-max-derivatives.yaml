    proof_body: |-
      The first property was noted in [ref:R1]. The other properties follow from a direct calculation. These give the displayed first and second derivative identities, together with
      \[
      \pi_j(z)\ge0,\qquad \sum_{j=1}^p\pi_j(z)=1,\qquad \sum_{j,k=1}^p |w_{jk}(z)|\le2.
      \]

      ### References
      #### Reference R1
      Target: first property (the identity \(\partial_j F_\beta(z)=\pi_j(z)\) for every \(1\le j,k\le p\))
      Citation: Proof of Lemma \ref{lemma: smooth max property}: “The first property was noted in \cite{Chatterjee2005b}. The other properties follow from a direct calculation.”
      Bibliography: Chatterjee, S. (2005). An error bound in the Sudakov-Fernique inequality. arXiv:math/0510424.

