      ##### Theorem (Anti-concentration)
      ###### Definitions and notation
      Let \(X=(X_{1},\dots,X_{p})^{T}\) be a centered Gaussian random vector in \(\RR^{p}\). For each coordinate, set
      \[
      \sigma_{j}^{2}:=\Ep[X_{j}^{2}],\qquad 1\le j\le p.
      \]
      Moreover, define
      \[
      \underline{\sigma}:=\min_{1\le j\le p}\sigma_{j},\qquad
      \overline{\sigma}:=\max_{1\le j\le p}\sigma_{j},
      \qquad
      a_{p}:=\Ep\!\left[\max_{1\le j\le p}\frac{X_{j}}{\sigma_{j}}\right].
      \]
      Here \(\Ep\) denotes expectation and \(a\vee b=\max\{a,b\}\).

      **Definition (Lévy concentration function; [\cite{RV09}, Definition 3.1]).** The Lévy concentration function of a real valued random variable \(\xi\) is defined for \(\epsilon>0\) as
      \[
      \LL(\xi,\epsilon)
      =\sup_{x\in\RR}\Pr\bigl(|\xi-x|\le\epsilon\bigr).
      \]

      ###### Assumptions
      Let \(X=(X_{1},\dots,X_{p})^{T}\) be a centered Gaussian random vector in \(\RR^{p}\), and suppose that
      \[
      \sigma_{j}^{2}:=\Ep[X_{j}^{2}]>0
      \qquad\text{for all }1\le j\le p.
      \]
      The quantities \(\underline{\sigma}\), \(\overline{\sigma}\), and \(a_{p}\) are defined as above.

      ###### Statement
      Let \((X_{1},\dots,X_{p})^{T}\) be a centered Gaussian random vector in \(\RR^{p}\) with \(\sigma_{j}^{2}:=\Ep[X_{j}^{2}]>0\) for all \(1\le j\le p\). Moreover, let
      \[
      \underline{\sigma}:=\min_{1\le j\le p}\sigma_{j},
      \qquad
      \overline{\sigma}:=\max_{1\le j\le p}\sigma_{j},
      \qquad
      a_{p}:=\Ep\!\left[\max_{1\le j\le p}\frac{X_{j}}{\sigma_{j}}\right].
      \]

      (i) If the variances are all equal, namely \(\underline{\sigma}=\overline{\sigma}=\sigma\), then for every \(\epsilon>0\),
      \[
      \LL\!\left(\max_{1\le j\le p}X_{j},\epsilon\right)
      \le \frac{4\epsilon(a_{p}+1)}{\sigma}.
      \]

      (ii) If the variances are not equal, namely \(\underline{\sigma}<\overline{\sigma}\), then for every \(\epsilon>0\),
      \[
      \LL\!\left(\max_{1\le j\le p}X_{j},\epsilon\right)
      \le C\epsilon\left\{a_{p}+\sqrt{1\vee\log(\underline{\sigma}/\epsilon)}\right\},
      \]
      where \(C>0\) depends only on \(\underline{\sigma}\) and \(\overline{\sigma}\).

      ##### Worst-case bound for \(a_p\) (unnamed statement following Theorem [Anti-concentration])
      ###### Definitions and notation
      Under the setup of the preceding anti-concentration theorem,
      \[
      a_{p}:=\Ep\!\left[\max_{1\le j\le p}\frac{X_{j}}{\sigma_{j}}\right],
      \qquad
      \sigma_{j}^{2}=\Ep[X_{j}^{2}],
      \]
      and the coordinates satisfy \(X_{j}/\sigma_{j}\sim N(0,1)\).

      ###### Assumptions
      Let \((X_{1},\dots,X_{p})^{T}\) be a centered Gaussian random vector in \(\RR^{p}\) with \(\sigma_{j}^{2}:=\Ep[X_{j}^{2}]>0\) for all \(1\le j\le p\).

      ###### Statement
      Since \(X_{j}/\sigma_{j}\sim N(0,1)\), by a standard calculation, we have
      \[
      a_{p}\le \sqrt{2\log p}
      \]
      in the worst case (see, for example, \cite{Talagrand2003}, Proposition 1.1.3).
