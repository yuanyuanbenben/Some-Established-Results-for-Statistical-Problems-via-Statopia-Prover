    title: "Theorem 2 (Comparison of distributions; second conclusion: covariance-only Kolmogorov bound Cprime Delta^(1/3) max(1,log(p/Delta))^(2/3), including Delta=0; not the separate first a_p-dependent inequality)"
    kind: theorem
    latex_statement: |-
      Correction dated 2026-10-31, grounded in main.tex Theorem 2 and its paragraph on key features (lines 266 and 297), and supp.tex proof: the earlier generated clarification allowing dimension dependence was erroneous. There must exist a single positive constant function Cprime(a,b), chosen before the dimension p, the probability space and all Gaussian vectors/covariances/thresholds. It depends only on the minimum and maximum diagonal covariance entries of Y. In particular it is independent of p, X, Y beyond these extrema, Delta, and x. This is a parameter-dependent function of a,b, not one scalar universal over all positive variance scales. Only the second covariance-only conclusion is selected; the preceding a_p-dependent bound is context. The matrices are genuine covariance matrices and are symmetric. Since the library Gaussian MGF predicate alone fixes only their symmetric parts, the Lean statement explicitly requires SigmaX.IsSymm and SigmaY.IsSymm to represent those source covariance matrices. These are source object properties, not additional distribution restrictions. No coordinate independence or nonsingular covariance may be added. The Delta=0 right side is exactly zero. The source ap notation has a variance versus standard-deviation ambiguity; the covariance-only target exposes no ap and the repaired proof uses Nazarov directly, without assuming the ambiguous Talagrand formulation.

      For the centered Gaussian random vectors \(X=(X_1,\dots,X_p)^T\) and \(Y=(Y_1,\dots,Y_p)^T\) with covariance matrices \(\Sigma^X=(\sigma^X_{jk})_{1\le j,k\le p}\) and \(\Sigma^Y=(\sigma^Y_{jk})_{1\le j,k\le p}\) introduced in the Assumptions, we use
      \[
      \Delta:=\max_{1\le j,k\le p}|\sigma^X_{jk}-\sigma^Y_{jk}|,\qquad
      a_p:=\Ep\left[\max_{1\le j\le p}(Y_j/\sigma^Y_{jj})\right].
      \]
      The Kolmogorov distance between (the distributions) of two real valued random variables \(\xi\) and \(\eta\) is defined by
      \[
      \sup_{x\in\RR}|\Pr(\xi\le x)-\Pr(\eta\le x)|.
      \]

      Suppose that \(p\ge 2\) and \(\sigma^Y_{jj}>0\) for all \(1\le j\le p\). Then
      \begin{align*}
      &\sup_{x\in\RR}|\Pr(\max_{1\le j\le p}X_j\le x)-\Pr(\max_{1\le j\le p}Y_j\le x)|\\
      &\qquad \le C\Delta^{1/3}\bigl\{1\vee a_p^2\vee \log(1/\Delta)\bigr\}^{1/3}\log^{1/3}p,
      \end{align*}
      where \(C>0\) depends only on \(\min_{1\le j\le p}\sigma^Y_{jj}\) and \(\max_{1\le j\le p}\sigma^Y_{jj}\) (the right side is understood to be \(0\) when \(\Delta=0\)). Moreover, in the worst case, \(a_p\le\sqrt{2\log p}\), so that
      \[
      \sup_{x\in\RR}|\Pr(\max_{1\le j\le p}X_j\le x)-\Pr(\max_{1\le j\le p}Y_j\le x)|
      \le C'\Delta^{1/3}\{1\vee\log(p/\Delta)\}^{2/3},
      \]
      where as before \(C'>0\) depends only on \(\min_{1\le j\le p}\sigma^Y_{jj}\) and \(\max_{1\le j\le p}\sigma^Y_{jj}\).
    assumptions:
      - |-
        Let \(X=(X_1,\dots,X_p)^T\) and \(Y=(Y_1,\dots,Y_p)^T\) be centered Gaussian random vectors in \(\RR^p\) with covariance matrices \(\Sigma^X=(\sigma^X_{jk})_{1\le j,k\le p}\) and \(\Sigma^Y=(\sigma^Y_{jk})_{1\le j,k\le p}\), respectively.

        Suppose that \(p\ge 2\) and \(\sigma^Y_{jj}>0\) for all \(1\le j\le p\).
    proof_body: |-
      ### Definitions and notation used in Proof
      According to \cite{RV09}, Definition 3.1, the Lévy concentration function of a real valued random variable \(\xi\) is defined for \(\epsilon>0\) as
      \[
      \LL(\xi,\epsilon)=\sup_{x\in\RR}\Pr(|\xi-x|\le\epsilon).
      \]

      The proof uses the smooth max function \(F_\beta\) from Theorem \ref{theorem:comparison} and the inequality \((\ref{eq: smooth max property})\) for it. For \(z=(z_1,\dots,z_p)^T\in\RR^p\) and \(\beta>0\), the smooth max function is
      \[
      F_\beta(z):=\beta^{-1}\log\left(\sum_{j=1}^p \exp(\beta z_j)\right),
      \]
      where \(\beta>0\) is the smoothing parameter. For every \(z\in\RR^p\),
      \[
      0\le F_\beta(z)-\max_{1\le j\le p}z_j\le \beta^{-1}\log p.
      \]
      Also, for a function \(g:\RR\to\RR\),
      \[
      \|g\|_\infty=\sup_{z\in\RR}|g(z)|,
      \]
      and \(C^2(\RR)\) denotes the class of twice continuously differentiable real-valued functions on \(\RR\).

      In what follows, let \(C>0\) be a generic constant that depends only on \(\min_{1\le j\le p}\sigma^Y_{jj}\) and \(\max_{1\le j\le p}\sigma^Y_{jj}\), and its value may change from place to place. For \(\beta>0\), define
      \[
      e_{p,\beta}:=\beta^{-1}\log p.
      \]
      Consider and fix a \(C^2\)-function \(g_0:\RR\to[0,1]\) such that \(g_0(t)=1\) for \(t\le 0\) and \(g_0(t)=0\) for \(t\ge 1\). For example, we may take
      \[
      g_0(t)=
      \begin{cases}
      0,& t\ge 1,\\
      30\int_t^1 s^2(1-s)^2\,ds,& 0<t<1,\\
      1,& t\le 0.
      \end{cases}
      \]
      For given \(x\in\RR\), \(\beta>0\) and \(\delta>0\), define
      \[
      g_{x,\beta,\delta}(t)=g_0(\delta^{-1}(t-x-e_{p,\beta})).
      \]
      For this function,
      \[
      \|g'_{x,\beta,\delta}\|_\infty=\delta^{-1}\|g_0'\|_\infty,\qquad
      \|g''_{x,\beta,\delta}\|_\infty=\delta^{-2}\|g_0''\|_\infty.
      \]
      Moreover,
      \[
      1(t\le x+e_{p,\beta})\le g_{x,\beta,\delta}(t)\le 1(t\le x+e_{p,\beta}+\delta),
      \quad \forall t\in\RR.
      \]

      ### Proof
      To prove the final assertion, it is enough to prove the \(a_p\)-dependent comparison inequality, since the final assertion follows from the inequality
      \[
      a_p\le\sqrt{2\log p}
      \]
      (see, for example, [ref:R1]). We first note that we may assume that \(0<\Delta<1\) since otherwise the proof is trivial (take \(C\ge 2\) in the \(a_p\)-dependent comparison inequality).

      For arbitrary \(x\in\RR\), \(\beta>0\) and \(\delta>0\), observe that
      \begin{align*}
      \Pr(\max_{1\le j\le p}X_j\le x)
      &\le \Pr(F_\beta(X)\le x+e_{p,\beta})
      \le \Ep[g_{x,\beta,\delta}(F_\beta(X))]\\
      &\le \Ep[g_{x,\beta,\delta}(F_\beta(Y))] + C(\delta^{-2}+\beta\delta^{-1})\Delta\\
      &\le \Pr(F_\beta(Y)\le x+e_{p,\beta}+\delta) + C(\delta^{-2}+\beta\delta^{-1})\Delta\\
      &\le \Pr(\max_{1\le j\le p}Y_j\le x+e_{p,\beta}+\delta) + C(\delta^{-2}+\beta\delta^{-1})\Delta,
      \end{align*}
      where the first inequality follows from the inequality \((\ref{eq: smooth max property})\), the second from the displayed inequality for \(g_{x,\beta,\delta}\), the third from [ref:R2], the fourth from the displayed inequality for \(g_{x,\beta,\delta}\), and the last from the inequality \((\ref{eq: smooth max property})\).

      We wish to compare
      \[
      \Pr(\max_{1\le j\le p}Y_j\le x+e_{p,\beta}+\delta)
      \]
      with
      \[
      \Pr(\max_{1\le j\le p}Y_j\le x),
      \]
      and this is where the anti-concentration inequality plays its role. By [ref:R3], we have
      \begin{align*}
      &\Pr(\max_{1\le j\le p}Y_j\le x+e_{p,\beta}+\delta)
      -\Pr(\max_{1\le j\le p}Y_j\le x)\\
      &=\Pr(x<\max_{1\le j\le p}Y_j\le x+e_{p,\beta}+\delta)\\
      &\le \LL(\max_{1\le j\le p}Y_j,e_{p,\beta}+\delta)\\
      &\le C(e_{p,\beta}+\delta)\sqrt{1\vee a_p^2\vee \log\{1/(e_{p,\beta}+\delta)\}}\\
      &\le C(e_{p,\beta}+\delta)\sqrt{1\vee a_p^2\vee \log(1/\delta)}.
      \end{align*}
      Therefore,
      \[
      \Pr(\max_{1\le j\le p}X_j\le x)-\Pr(\max_{1\le j\le p}Y_j\le x)
      \le C\left\{(\delta^{-2}+\beta\delta^{-1})\Delta
      +(e_{p,\beta}+\delta)\sqrt{1\vee a_p^2\vee\log(1/\delta)}\right\}.
      \]
      Take
      \[
      a=a_p\vee\log^{1/2}(1/\Delta),
      \]
      and choose \(\beta\) and \(\delta\) in such a way that
      \[
      \beta=\delta^{-1}\log p
      \quad\text{and}\quad
      \delta=\Delta^{1/3}(1\vee a)^{-1/3}(2\log p)^{1/3}.
      \]
      Recall that \(p\ge 2\) and \(0<\Delta<1\). Observe that
      \[
      (\delta^{-2}+\beta\delta^{-1})\Delta
      \le C\Delta^{1/3}(1\vee a)^{2/3}\log^{1/3}p,
      \]
      \[
      (e_{p,\beta}+\delta)(1\vee a_p)
      \le C\Delta^{1/3}(1\vee a)^{2/3}\log^{1/3}p,
      \]
      and since \(\delta\ge\Delta^{1/3}(1\vee a)^{-1/3}\), we have
      \[
      \log(1/\delta)\le (1/3)\log((1\vee a)/\Delta).
      \]
      Hence the right side of the multline bound above is bounded by
      \[
      C\Delta^{1/3}\{(1\vee a)^{2/3}\log^{1/3}p
      +(1\vee a)^{-1/3}(\log^{1/3}p)\log^{1/2}((1\vee a)/\Delta)\}.
      \]
      In addition, \((1\vee a)^{-1}\log^{1/2}(1\vee a)\) is bounded by a universal constant, so that
      \[
      \text{right side of the multline bound above}
      \le C\Delta^{1/3}\{(1\vee a)^{2/3}\log^{1/3}p
      +(1\vee a)^{-1/3}(\log^{1/3}p)\log^{1/2}(1/\Delta)\}.
      \]
      The second term inside the bracket is bounded by \((\log^{1/3}p)\log^{1/3}(1/\Delta)\) as \((1\vee a)^{-1/3}\le(\log(1/\Delta))^{-1/6}\), and the first term is bounded by
      \[
      (1\vee a_p)^{2/3}\log^{1/3}p+(\log^{1/3}p)\log^{1/3}(1/\Delta).
      \]
      Adjusting the constant \(C\), the right side of the above displayed equation is bounded by
      \[
      C\Delta^{1/3}\{1\vee a_p^2\vee\log(1/\Delta)\}^{1/3}\log^{1/3}p.
      \]

      For the opposite direction, observe that
      \begin{align*}
      \Pr(\max_{1\le j\le p}X_j\le x)
      &\ge \Pr(F_\beta(X)\le x)
      \ge \Ep[g_{x-e_{p,\beta}-\delta,\beta,\delta}(F_\beta(X))]\\
      &\ge \Ep[g_{x-e_{p,\beta}-\delta,\beta,\delta}(F_\beta(Y))]
      -C(\delta^{-2}+\beta\delta^{-1})\Delta\\
      &\ge \Pr(F_\beta(Y)\le x-\delta)
      -C(\delta^{-2}+\beta\delta^{-1})\Delta\\
      &\ge \Pr(\max_{1\le j\le p}Y_j\le x-e_{p,\beta}-\delta)
      -C(\delta^{-2}+\beta\delta^{-1})\Delta.
      \end{align*}
      The rest of the proof is similar and hence omitted.

      Combining the two directions yields the \(a_p\)-dependent comparison inequality. Together with \(a_p\le\sqrt{2\log p}\) (see, for example, [ref:R1]), this gives the asserted covariance-only bound. \qed

      ### References
      #### Reference R1
      Target: Proposition 1.1.3 in \cite{Talagrand2003}
      Citation: The final assertion follows from the inequality $a_{p} \leq \sqrt{2 \log p}$ (see, for example, \cite{Talagrand2003}, Proposition 1.1.3).
      Bibliography: Talagrand, M. (2003). {\em Spin Glasses: A Challenge for Mathematicians}. Springer.

