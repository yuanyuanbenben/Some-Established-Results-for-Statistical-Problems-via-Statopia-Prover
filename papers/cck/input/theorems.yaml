      ##### Theorem [theorem:comparison] (Comparison bounds for smooth functions)
      ###### Definitions and notation
      Let
      \[
      X=(X_1,\dots,X_p)^T,\qquad Y=(Y_1,\dots,Y_p)^T
      \]
      be centered Gaussian random vectors in \(\RR^p\) with covariance matrices
      \[
      \Sigma^X=(\sigma^X_{jk})_{1\le j,k\le p},\qquad
      \Sigma^Y=(\sigma^Y_{jk})_{1\le j,k\le p},
      \]
      respectively. Define
      \[
      \Delta:=\max_{1\le j,k\le p}|\sigma^X_{jk}-\sigma^Y_{jk}|.
      \]
      For \(z=(z_1,\dots,z_p)^T\in\RR^p\) and \(\beta>0\), the smooth max function is
      \[
      F_\beta(z):=\beta^{-1}\log\left(\sum_{j=1}^p \exp(\beta z_j)\right),
      \]
      where \(\beta>0\) is the smoothing parameter. For a function \(g:\RR\to\RR\),
      \[
      \|g\|_\infty=\sup_{z\in\RR}|g(z)|.
      \]
      Also \(C^2(\RR)\) denotes the class of twice continuously differentiable real-valued functions on \(\RR\).

      ###### Assumptions
      Let \(X=(X_1,\dots,X_p)^T\) and \(Y=(Y_1,\dots,Y_p)^T\) be centered Gaussian random vectors in \(\RR^p\) with covariance matrices \(\Sigma^X=(\sigma^X_{jk})_{1\le j,k\le p}\) and \(\Sigma^Y=(\sigma^Y_{jk})_{1\le j,k\le p}\), respectively. Let \(g\in C^2(\RR)\) satisfy
      \[
      \|g'\|_\infty\vee\|g''\|_\infty<\infty,
      \]
      and let \(\beta>0\). No additional condition \(p\ge2\) and no positivity condition on the variances \(\sigma^Y_{jj}\) are imposed.

      ###### Statement
      For every \(g\in C^2(\RR)\) with \(\|g'\|_\infty\vee\|g''\|_\infty<\infty\) and every \(\beta>0\),
      \[
      \left|\Ep[g(F_\beta(X))-g(F_\beta(Y))]\right|
      \le \left(\frac{\|g''\|_\infty}{2}+\beta\|g'\|_\infty\right)\Delta,
      \]
      and hence
      \[
      \left|\Ep\left[g\left(\max_{1\le j\le p}X_j\right)-g\left(\max_{1\le j\le p}Y_j\right)\right]\right|
      \le \left(\frac{\|g''\|_\infty}{2}+\beta\|g'\|_\infty\right)\Delta
      +2\beta^{-1}\|g'\|_\infty\log p.
      \]

      ##### Smooth max property [eq: smooth max property]
      ###### Definitions and notation
      For \(z=(z_1,\dots,z_p)^T\in\RR^p\) and \(\beta>0\), define
      \[
      F_\beta(z):=\beta^{-1}\log\left(\sum_{j=1}^p \exp(\beta z_j)\right).
      \]
      Also write
      \[
      \max_{1\le j\le p}z_j
      \]
      for the maximum of the coordinates of \(z\).

      ###### Assumptions
      Let \(p\) be a positive integer, let \(z=(z_1,\dots,z_p)^T\in\RR^p\), and let \(\beta>0\).

      ###### Statement
      For every \(z\in\RR^p\),
      \[
      0\le F_\beta(z)-\max_{1\le j\le p}z_j\le \beta^{-1}\log p.
      \]
      This is the inequality labelled `eq: smooth max property` in the source.

      #### Reference R3
      Target: Theorem \ref{thm:anticoncentration}
      Citation: By Theorem \ref{thm:anticoncentration}, we have
      \begin{align*}
      &\Pr (\max_{1 \leq j \leq p} Y_{j} \leq x+e_{p,\beta}+\delta ) -  \Pr (\max_{1 \leq j \leq p} Y_{j} \leq x ) \\
      &= \Pr (x < \max_{1 \leq j \leq p} Y_{j} \leq x+e_{p,\beta}+\delta ) \leq \LL ( \max_{1 \leq j \leq p} Y_{j}, e_{p,\beta}+\delta) \\
      &\leq  C (e_{p,\beta} + \delta) \sqrt{1 \vee a_{p}^{2} \vee \log \{ 1 / (e_{p,\beta} + \delta) \}} \leq  C (e_{p,\beta} + \delta) \sqrt{1 \vee a_{p}^{2} \vee  \log (1 / \delta)}.
      \end{align*}
