name: msc62-latex-v1
description: LaTeX-input benchmark for MSC 62 statistics problems.
msc_root: "62"
# Case difficulty is track-specific. Track A difficulty rates the
# LaTeX-to-Lean statement formalization burden. Track B difficulty rates proof
# search under this harness and the current trusted Lean statement.
# Do not add per-case search_route fields; benchmark cases intentionally keep
# proof-planning hints out of the manifest.
tracks:
  - id: A
    name: Autoformalization
    allow_sorry: true
    require_full_proof: false
  - id: B
    name: Proof Success
    allow_sorry: false
    require_full_proof: true

