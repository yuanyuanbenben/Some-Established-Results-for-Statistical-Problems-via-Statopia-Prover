    latex_statement: >-
      \begin{theorem}[Functional PCA reconstruction mean squared error]

      Let $(\Omega,\mathcal F,P)$ be a probability space and let $H$ be a

      complete, second-countable real inner-product space.  Let

      $X:\Omega\to H$ be strongly measurable and assume

      $\int_\Omega\|X(\omega)\|^2\,dP(\omega)<\infty$.  Let

      $C:H\to H$ be a continuous linear map, let $(\phi_k)_{k\ge0}$ be an

      orthonormal sequence in $H$, and let $(\lambda_k)_{k\ge0}$ be a

      nonincreasing sequence of nonnegative real numbers.  Assume that the
      linear

      span of $\{\phi_k:k\ge0\}$ is dense in $H$, that

      \[
        C\phi_k=\lambda_k\phi_k\qquad(k\ge0),
      \]

      and that, for every $h\in H$,

      \[
        Ch=\int_\Omega
        \langle X(\omega)-\mathbb E_P[X],h\rangle
        \bigl(X(\omega)-\mathbb E_P[X]\bigr)\,dP(\omega).
      \]

      For every integer $r\ge1$, define

      \[
        \mu=\int_\Omega X(\omega)\,dP(\omega)
      \]

      and

      \[
        X_r(\omega)=\mu+
        \sum_{k=0}^{r-1}\langle X(\omega)-\mu,\phi_k\rangle\phi_k.
      \]

      Then

      \[
        \int_\Omega\|X(\omega)-X_r(\omega)\|^2\,dP(\omega)
        =\sum_{k=0}^\infty
          \begin{cases}\lambda_k,&r\le k,\\0,&r>k.\end{cases}
      \]

      \end{theorem}
    proof_body: ""
    assumptions: []
