    latex_statement: |-
      \begin{theorem}[Least-Squares Residual Sum, 62J05]
      Let $n \in \mathbb{N}$ with $n \ge 1$. Let
      \[
      x_1,\ldots,x_n,y_1,\ldots,y_n \in \mathbb{R}.
      \]
      For $a,b \in \mathbb{R}$, define
      \[
      Q(a,b)=\sum_{i=1}^n (y_i-a-bx_i)^2.
      \]
      Let $\hat a,\hat b \in \mathbb{R}$ minimize $Q$. Define
      \[
      e_i = y_i-\hat a-\hat b x_i.
      \]
      Then
      \[
      \sum_{i=1}^n e_i=0.
      \]
      \end{theorem}
